      // out=1：工作区外写入（页面已弹出位置+操作详情确认，宿主仍会做系统目录/重解析点校验）
      bridge.send({ t: 'fs', id: id, op: op, path: path || '', data: data == null ? '' : data, root: root || '', out: !!out });
      setTimeout(function(){ // setroot 含选目录交互放宽超时；普通 IO 15s
        if (bridge.pend[id]){ delete bridge.pend[id]; rej(new Error('文件操作超时')); }
      }, op === 'setroot' ? 300000 : 15000);
    });
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* ---- 联网搜索管线：查询预处理 → LLM 改写 → 九源检索 → 网页正文抓取 → 结构化注入 ---- */
  var SEARCH_HEADS = ['请帮我查', '请帮我搜索', '请帮我', '麻烦帮我', '能不能帮我', '可以帮我', '麻烦', '请你', '请问',
    '帮我查', '帮我搜索', '帮我', '给我查', '查一下', '查询一下', '搜一下', '搜索一下', '检索一下',
    '找一下', '查找一下', '想知道', '我要查', '我要搜索'];
  var SEARCH_REFER = /(第\s*[一二三四五六七八九十\d]+\s*[个条项种类号页章节款]|上面|前面|刚才|之前|后者|前者|上述|上文|这个问题|那个问题|该问题|这些|那些|这个|那个|它|他们)/;

  /* 规则预处理（档①）：去客套前缀；短且含指代 → 判定追问，拼上上一条用户消息 */
  function prepQuery(raw, prev){
    var s = String(raw || '').trim().replace(/\s+/g, ' ');
    for (var pass = 0; pass < 3; pass++){ // 多轮去客套：麻烦请帮我查一下… → 实体
      var before = s;
      for (var i = 0; i < SEARCH_HEADS.length; i++){
        if (s.indexOf(SEARCH_HEADS[i]) === 0){
          var rest = s.slice(SEARCH_HEADS[i].length)
            .replace(/^[\s,，。.、;；:：!！?？]+/, '').replace(/^一下/, '')
            .replace(/^[\s,，。.、;；:：!！?？]+/, '');
          if (rest) s = rest;
          break;
        }
      }
      if (s === before) break;
    }
    var follow = s.length > 0 && s.length <= 40 && SEARCH_REFER.test(s);
    if (follow && prev){
      var p = String(prev).replace(/\s+/g, ' ').trim();
      if (p) s = p.slice(-160) + ' ' + s;
    }
    return { q: s || String(raw || '').trim(), follow: follow };
  }
  /* 当前消息发送前已入列，取更早的一条不同内容的用户消息作追问上下文 */
  function lastUserBefore(msgs, raw){
    var t = String(raw || '').trim();
    for (var i = (msgs || []).length - 1; i >= 0; i--){
      var m = msgs[i];
      if (m && m.role === 'user'){
        var c = String(m.content || '').trim();
        if (c && c !== t) return c;
      }
    }
    return null;
  }

  /* 非流式 chat 补全（查询改写用）：双通道，任何失败返回 null */
  function chatOnce(messages, opt){
    opt = opt || {};
    var base = normBase(S.cfg.baseURL);
    if (!base || !S.cfg.currentModel) return Promise.resolve(null);
    var headers = { 'Content-Type': 'application/json' };
    if (S.cfg.apiKey) headers['Authorization'] = 'Bearer ' + S.cfg.apiKey;
    var body = { model: S.cfg.currentModel, messages: messages, stream: false,
      temperature: opt.temperature == null ? 0.2 : opt.temperature, max_tokens: opt.maxTokens || 160 };
    var ms = opt.timeout || 15000;
    var url = base + '/chat/completions';
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 'q' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 500000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (status && (status < 200 || status >= 300)){ console.warn('[chatOnce] http ' + status + ' ' + String(acc).slice(0, 300)); return resolve(null); }
            try { var jj = JSON.parse(acc); var ms0 = jj.choices[0].message || null; if (!ms0 || !String(ms0.content || '').trim()) console.warn('[chatOnce] empty content, finish=' + (jj.choices[0].finish_reason) + ' msg=' + JSON.stringify(ms0).slice(0, 260)); resolve(ms0); } catch (e) { console.warn('[chatOnce] parse fail ' + String(acc).slice(0, 200)); resolve(null); }
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(url), url: url, method: 'POST', headers: headers, body: JSON.stringify(body) });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: ac.signal })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.json(); })
      .then(function(j){ clearTimeout(t); return (j && j.choices && j.choices[0] && j.choices[0].message) || null; })
      .catch(function(){ clearTimeout(t); return null; });
  }
  /* 搜索规划（档③，v1.4.2）：模型先自判「是否需要联网」，需要则同时给出「简化检索词」。
     返回 {need:bool, q:string}。调用失败/关改写 → 回退 {need:true, q:原查询}（维持联网开关的旧行为）。 */
  function planSearch(q, msgs){
    var fb = { need: true, q: q };
    if (!S.cfg.searchRewrite || isMock()) return Promise.resolve(fb);
    var sys = '你是联网搜索规划器。对用户问题做两步判断与处理：' +
      '(1)是否需要实时联网搜索才能准确回答——需要：最新新闻/公告、实时数据(价格、天气、股价、赛况)、近期事件、' +
      '某个具体网页的内容、或你不确定且时效性强的事实；不需要：常识问答、数学计算、代码编写调试、通用概念解释、闲聊、创作写作。' +
      '(2)若需要，把问题精简成一条适合网页搜索的检索词：保留实体、年份、数字，去掉客套与指代。' +
      '严格输出两行：第一行只能是 YES 或 NO；第二行在 YES 时为检索词(不带引号与解释)、在 NO 时为一个减号 -。不要输出其它任何内容。';
    var ctx = '';
    (msgs || []).slice(-3).forEach(function(m){
      if (m && m.role === 'user' && m.content) ctx += '用户：' + String(m.content).slice(0, 160) + '\n';
    });
    return chatOnce([
      { role: 'system', content: sys },
      { role: 'user', content: (ctx ? '最近对话：\n' + ctx : '') + '当前问题：' + q }
    ], { temperature: 0.2, maxTokens: 120, timeout: 15000 }).then(function(m){
      var r = m && m.content ? String(m.content).trim() : '';
      var lines = r.split(/\r?\n/).map(function(s){ return s.trim(); })
        .filter(function(s){ return s && !/^```/.test(s); });
      if (!lines.length) return fb;
      var head = lines[0];
      var no = /^no/i.test(head) || /不需要|无需/.test(head);
      var yes = /^yes/i.test(head) || (/需要/.test(head) && !no);
      if (no) return { need: false, q: q };
      if (yes){
        var rq = (lines[1] || '').replace(/^[-—:：]\s*/, '')
          .replace(/^["'「『\s]+/, '').replace(/["'」』\s]+$/, '').replace(/\s+/g, ' ');
        return { need: true, q: (rq.length >= 2 && rq.length <= 200) ? rq : q };
      }
      return fb; // 无法识别 → 保守回退为需要搜索（保持联网开关语义）
    });
  }

  function safeUrl(u){
    try {
      var p = new URL(String(u));
      return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
    } catch (e) { return null; }
  }
  /* HTML → 纯文本：块级标签先转 \n，再去脚本样式与导航壳 */
  function htmlToText(html){
    var src = String(html || '')
      .replace(/<(br\s*\/?|\/(p|div|li|h[1-6]|tr|section|article|blockquote|pre))\s*>/gi, '\n');
    var doc = null;
    try { doc = new DOMParser().parseFromString(src, 'text/html'); } catch (e) { return ''; }
    if (!doc || !doc.body) return '';
    var drop = doc.querySelectorAll('script,style,noscript,svg,canvas,iframe,nav,header,footer,aside,form,button,select,textarea,template');
    for (var i = 0; i < drop.length; i++) if (drop[i].parentNode) drop[i].parentNode.removeChild(drop[i]);
    return (doc.body.textContent || '').replace(/\u00a0/g, ' ')
      .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }
  /* 单页抓取（档④）：桥 GET 优先，浏览器直连受 CORS 约束，失败返回 null（回退摘要） */
  /* v0.2.3：把外部地址交给宿主 —— mode='window' 是应用内播放窗口（同一浏览器环境，带 cookie/登录态），
     'browser' 是系统默认浏览器。纯网页版退化为 window.open。 */
  /* v0.2.8：通用抓取 —— 宿主把 URL 存成文件（按真实类型命名），文档类回传字节让页面本地解析 */
  function fileGet(url, name, onProgress){
    var u = safeUrl(url);
    if (!u) return Promise.reject(new Error('地址无效'));
    return bridge.file({ url: u, name: name || '', readBack: true, onProgress: onProgress });
  }
  function fileText(entry){
    if (!entry || !entry.b64) return Promise.resolve('');
    var bin = atob(String(entry.b64).replace(/\s/g, ''));
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var ext = String(entry.name || entry.path || '').split('.').pop().toLowerCase();
    if (/^(docx|xlsx|pptx|pdf|rtf|epub)$/.test(ext)){
      try { return DOC.parse(new File([u8], entry.name || ('file.' + ext))); }
      catch (e) { return Promise.reject(e); }
    }
    try { return Promise.resolve(new TextDecoder('utf-8').decode(u8)); }
    catch (e) { return Promise.resolve(''); }
  }
  /* v0.2.4：视频下载（宿主做，页面只收进度/结果） */
  function mediaDownload(opts){ return bridge.media(opts); }
  function revealPath(path){ bridge.reveal(path); }
  function openExternal(url, mode){
    var u = safeUrl(url);
    if (!u) return false;
    if (bridge.ok){
      try { bridge.send({ t: 'open', url: u, mode: mode || 'window' }); return true; } catch (e) {}
    }
    try { window.open(u, '_blank', 'noopener'); return true; } catch (e) {}
    return false;
  }
  /* v0.2.4：图片/媒体/压缩包之类抓成文本只会得到乱码，直接拒掉（web 工具只取文本） */
  var BIN_RE = /\.(jpe?g|png|gif|webp|ico|bmp|avif|heic|mp4|m4s|mp3|m4a|flv|mov|avi|mkv|zip|rar|7z|gz|tar|pdf|woff2?|ttf|otf|eot|wasm|exe|msi|dmg|apk|jar)(\?|#|$)/i;
  function isBinaryUrl(u){
    try { return BIN_RE.test(new URL(String(u)).pathname); } catch (e) { return BIN_RE.test(String(u)); }
  }
  function looksBinary(t){
    if (!t) return false;
    var n = Math.min(t.length, 4000), bad = 0;
    for (var i = 0; i < n; i++){
      var c = t.charCodeAt(i);
      if (c === 0xFFFD || (c < 32 && c !== 9 && c !== 10 && c !== 13)) bad++;
    }
    return n > 0 && bad / n > 0.02;
  }
  function fetchPageText(u){
    var href = safeUrl(u);
    if (!href) return Promise.resolve(null);
    if (isBinaryUrl(href)) return Promise.resolve(null); // 图片/视频等直接跳过
    var ms = 8000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 'p' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 400000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (!(status >= 200 && status < 300)) return resolve(null);
            var txt = htmlToText(acc);
            resolve(looksBinary(txt) ? null : txt);
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(href), url: href, method: 'GET',
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml' } });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(href, { signal: ac.signal, headers: { 'Accept': 'text/html,application/xhtml+xml' } })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.text(); })
      .then(function(h){ clearTimeout(t); if (!h) return null; var txt = htmlToText(h); return looksBinary(txt) ? null : txt; })
      .catch(function(){ clearTimeout(t); return null; });
  }
  function fetchPages(list){
    if (!S.cfg.searchFetch || !list || !list.length) return Promise.resolve(list);
    var n = clamp(parseInt(S.cfg.searchFetchCount, 10), 0, 5);
    if (!n) return Promise.resolve(list);
    var jobs = [];
    for (var i = 0; i < list.length && jobs.length < n; i++){
      (function(it){
        /* 已是长文（Firecrawl markdown）或地址非法则跳过 */
        if (!it || !safeUrl(it.url) || it.full || String(it.text || '').length >= 1600) return;
        jobs.push(fetchPageText(it.url).then(function(t){
          if (t && t.length >= 120){ it.text = t.slice(0, 3500); it.full = 1; }
        }));
      })(list[i]);
    }
    return jobs.length ? Promise.all(jobs).then(function(){ return list; }) : Promise.resolve(list);
  }

  /* POST/GET JSON 双通道：桥/fetch，超时或非 2xx 返回 null */
  function httpJSON(req, ms){
    ms = ms || 15000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 's' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 1000000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (status && (status < 200 || status >= 300)) return resolve(null);
            try { resolve(req.parse(JSON.parse(acc))); } catch (e) { resolve(null); }
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(req.url), url: req.url, method: req.method || 'POST', headers: req.headers, body: req.body });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    var mth = req.method || 'POST';
    return fetch(req.url, { method: mth, headers: req.headers, body: mth === 'GET' ? undefined : req.body, signal: ac.signal })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.json(); })
      .then(function(j){ clearTimeout(t); try { return j ? req.parse(j) : null; } catch (e) { return null; } })
      .catch(function(){ clearTimeout(t); return null; });
  }
  /* 各源响应解析（命名函数，便于单测抓取） */
  function parseSerper(j){
    return (j.organic || []).map(function(r){ return { title: r.title, url: r.link, text: r.snippet }; });
  }
  function parseSerpApi(j){
    return (j.organic_results || []).map(function(r){ return { title: r.title, url: r.link, text: r.snippet }; });
  }
  function parseBrave(j){
    return ((j.web && j.web.results) || []).map(function(r){ return { title: r.title, url: r.url, text: r.description }; });
  }
  function parseTavily(j){
    return (j.results || []).map(function(r){ return { title: r.title, url: r.url, text: (r.content || '').slice(0, 1500) }; });
  }
  function parseFirecrawl(j){
    return (j.data || []).map(function(r){
      return { title: (r.metadata && r.metadata.title) || '', url: (r.metadata && r.metadata.sourceURL) || '', text: (r.markdown || '').slice(0, 2000) };
    });
  }
  function parseBocha(j){
    var wp = (j && (j.webPages || (j.data && j.data.webPages))) || {};
    return (wp.value || []).map(function(r){ return { title: r.name, url: r.url, text: (r.summary || r.snippet || '').slice(0, 2000) }; });
  }
  function parseJina(j){
    return (j.data || []).map(function(r){ return { title: r.title, url: r.url, text: (r.content || r.description || '').slice(0, 2000) }; });
  }
  function parseExa(j){
    return (j.results || []).map(function(r){ return { title: r.title, url: r.url, text: (r.text || '').slice(0, 2000) }; });
  }

  /* 九源检索 + 地址校验 + URL 去重（Issue 17） */
  function runProviders(query, num){
    var prov = (S.cfg.searchProvider || 'none').toLowerCase();
    var key = S.cfg.searchKey || '';
    if (prov === 'none' || !key) return Promise.resolve(null);
    var req = null;
    if (prov === 'serper'){
      req = {
        url: 'https://google.serper.dev/search',
        headers: { 'X-API-KEY': key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: query, num: num }),
        parse: parseSerper
      };
    } else if (prov === 'serpapi'){
      req = {
        method: 'GET',
        url: 'https://serpapi.com/search.json?engine=google&q=' + encodeURIComponent(query) + '&num=' + clamp(num, 1, 100) + '&api_key=' + encodeURIComponent(key),
        headers: { 'Accept': 'application/json' },
        parse: parseSerpApi
      };
    } else if (prov === 'brave'){
      req = {
        method: 'GET',
        url: 'https://api.search.brave.com/res/v1/web/search?q=' + encodeURIComponent(query) + '&count=' + clamp(num, 1, 20),
        headers: { 'X-Subscription-Token': key, 'Accept': 'application/json' },
        parse: parseBrave
      };
    } else if (prov === 'tavily'){
      req = {
        url: 'https://api.tavily.com/search',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: key, query: query, max_results: num }),
        parse: parseTavily
      };
    } else if (prov === 'firecrawl'){
      req = {
        url: 'https://api.firecrawl.dev/v1/search',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, limit: num, scrapeOptions: { formats: ['markdown'] } }),
        parse: parseFirecrawl
      };
    } else if (prov === 'bocha'){
      req = {
        url: 'https://api.bochaai.com/v1/web-search',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, count: num, freshness: 'noLimit', summary: true }),
        parse: parseBocha
      };
    } else if (prov === 'jina'){
      req = {
        url: 'https://s.jina.ai/',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ q: query, num: num }),
        parse: parseJina
      };
    } else if (prov === 'exa'){
      req = {
        url: 'https://api.exa.ai/search',
        headers: { 'x-api-key': key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, numResults: num, type: 'auto', contents: { text: { maxCharacters: 2000 } } }),
        parse: parseExa
      };
    } else return Promise.resolve(null);
    return httpJSON(req, 15000).then(function(list){
      if (!list || !list.length) return null;
      var seen = {}, out = [];
      for (var i = 0; i < list.length; i++){
        var it = list[i]; if (!it) continue;
        var u = safeUrl(it.url);
        if (!u || seen[u]) continue; // 非 http/https 与重复 URL 直接丢弃
        seen[u] = 1; it.url = u; out.push(it);
      }
      return out.length ? out : null;
    });
  }

  /* 结构化注入格式（档②）：编号 + 引用要求 + 正文/摘要标注，总量 16384 字符 */
  function fmtBlock(list, query){
    if (!list || !list.length) return null;
    function pad(x){ return x < 10 ? '0' + x : '' + x; }
    var ts = new Date();
    var stamp = ts.getFullYear() + '-' + pad(ts.getMonth() + 1) + '-' + pad(ts.getDate()) + ' ' + pad(ts.getHours()) + ':' + pad(ts.getMinutes());
    var entries = [], total = 0;
    for (var i = 0; i < list.length && total < 16384; i++){
      var body = String((list[i] && list[i].text) || '').slice(0, 3500);
      if (!body) continue;
      total += body.length;
      entries.push({ title: ((list[i].title || '').trim()) || '（无标题）', url: list[i].url || '', body: body, full: !!list[i].full });
    }
    if (!entries.length) return null;
    var out = ['【联网搜索结果 · ' + stamp + ' · 查询：' + query + '】',
      '作答要求：仅依据下列结果作答；关键论断在句末用「可点击引用链接」标注对应来源，格式 [标题](网址)，其中标题用该条结果的标题、网址用该条结果给出的链接（严禁编造未列出的网址）；' +

      var e = entries[j];

  }

  /* 入口：raw=用户原话；onStage=阶段回调（更新 live 指示器）；永不 reject */
  function searchWeb(raw, onStage, force){
    var stage = typeof onStage === 'function' ? onStage : function(){};
    var prov = (S.cfg.searchProvider || 'none').toLowerCase();
    var key = S.cfg.searchKey || '';
    if (prov === 'none' || !prov || !key) return Promise.resolve(null);
    var t0 = Date.now();
    var num = clamp(parseInt(S.cfg.searchCount, 10) || 5, 1, 10);
    var prep = prepQuery(raw, lastUserBefore(S.msgs, raw));
    var q = prep.q;
    function fail(){ return { block: null, n: 0, ms: Date.now() - t0, items: [], query: q }; }
    stage('判断是否需要联网搜索…');
    /* v0.2.1：Work 里是模型显式要求检索（search 围栏），跳过「是否需要联网」的二次判定，省一次模型调用 */
    return (force ? Promise.resolve({ need: true, q: prep.q })
                  : planSearch(prep.q, S.msgs).catch(function(){ return { need: true, q: prep.q }; }))
      .then(function(plan){
        if (plan && plan.need === false) return { block: null, n: 0, ms: Date.now() - t0, items: [], query: q, skip: true };
        q = (plan && plan.q) || prep.q;
        stage('正在联网搜索：' + q);
        return runProviders(q, num);
      })
      .then(function(list){
        if (list && list.skip) return list; // 模型判定无需联网，透传 skip
        if (!list || !list.length){ stage('搜索无结果'); return fail(); }
        stage('抓取网页正文…');
        return fetchPages(list).then(function(l2){
          var blk = fmtBlock(l2, q);
          if (!blk){ stage('搜索无结果'); return fail(); }
          var items = [];
          for (var i = 0; i < Math.min(l2.length, 8); i++) items.push({ t: l2[i].title || '', u: l2[i].url || '' });
          return { block: blk, n: l2.length, ms: Date.now() - t0, items: items, query: q };
        });
      })
      .catch(function(){ return fail(); });
  }

  /* GET {base}/models；桥优先 */
  /* /models 解析：模型列表 + 各家上下文窗口字段。
     v1.6 加固：① 字段名全集（context_window / context_length / max_model_len / input_token_limit …）
     ② 嵌套容器（topProvider / architecture / info / model_info / capabilities / configuration）
     ③ 值兼容 1000000 / "1,000,000" / "128k" / "1m" 字面量

  function deepField(m, keys){

  /* v0.2.5：按模型名推断「思考字段 + 可用档位」——接口目录常常只给一个 reasoning:true，

    [/gemini-3|gemini-2\.5/,         'reasoning_effort', ['low', 'medium', 'high']],
    [/claude|sonnet|opus|haiku/,     'reasoning_effort', ['low', 'medium', 'high']],
    [/qwq|qwen3|qwen-3/,             'enable_thinking',  ['enabled', 'disabled']],
    [/glm-4\.[5-9]|glm-z1|glm-5/,    'thinking',         ['enabled', 'disabled']],
    [/doubao|seed-oss|kimi-k2/,      'thinking',         ['enabled', 'disabled']],

    var s2 = String(name || '').toLowerCase();
    for (var i = 0; i < REASON_NAME.length; i++)
      if (REASON_NAME[i][0].test(s2)) return { field: REASON_NAME[i][1], efforts: REASON_NAME[i][2].slice() };

  function modelCaps(m){
    var rec = {};
    var c = parseCtxVal(deepField(m, CTX_KEYS)); if (c) rec.ctx = c;
    var o = parseCtxVal(deepField(m, OUT_KEYS)); if (o) rec.out = o;
    var mods = null;
    if (m.modalities && m.modalities.input) mods = m.modalities.input;
    else if (m.architecture && m.architecture.input_modalities) mods = m.architecture.input_modalities;
    else if (m.input_modalities) mods = m.input_modalities;
    if (mods && mods.length){
      var ins = [];
      for (var i = 0; i < mods.length; i++){
        var x = String(mods[i] || '').toLowerCase();
        if (x === 'text' || x === 'image' || x === 'audio' || x === 'video' || x === 'pdf' || x === 'file'){
          if (ins.indexOf(x) < 0) ins.push(x === 'file' ? 'pdf' : x);

    if (sp && sp.length){

  }
  /* 模型名 → 上下文窗口兜底推断：接口没给窗口字段时启用；规则按公开规格维护，命中才覆盖默认值 */

    ['glm-5', 1000000], ['glm-4-long', 2000000], ['glm-4.6', 200000], ['glm-4.5', 131072],
    ['minimax-m1', 1000000], ['minimax-m2', 1000000],
    ['nemotron-4', 4096],
    ['gemini-3', 1048576], ['gemini-2.5', 1048576],
    ['gpt-4.1', 1048576], ['gpt-5', 400000], ['gpt-4o', 128000], ['gpt-4-turbo', 131072],
    ['claude-sonnet-4', 200000], ['claude-opus-4', 200000], ['claude-haiku-4', 200000], ['claude', 200000],
    ['deepseek-v3', 131072], ['deepseek-chat', 131072], ['deepseek-reasoner', 131072],
    ['qwen3-max', 262144], ['kimi-k2', 131072], ['moonshot-v1', 131072],
    ['llama-4', 1048576], ['llama-3', 131072],
    ['grok-4', 262144], ['grok-3', 131072]
  ];
  function guessCtx(id){
    var s = String(id || '').toLowerCase();
    if (!s) return 0;
    /* Qwen 家族（阿里云百炼/DashScope 兼容接口的 /models 不返回窗口字段，按系列规格推断）。
       v1.7 修：qwen3.8max / qwen3.8flash 等新一代命名未命中旧表，落到 131072 默认值。 */
    if (s.indexOf('qwen') >= 0){
      if (/long/.test(s)) return 10000000; // qwen-long：千万级
      if (/(vl|omni|audio|ocr|asr|tts|embed|rerank)/.test(s)) return 131072; // 多模态/非对话按 128k 档
      if (/(turbo|flash|plus|coder|3[.\-]?[0-9])/.test(s)) return 1000000;   // 主力文本系百万档（qwen3.8max、qwen-turbo、qwen-plus、qwen3-coder…）

    for (var i = 0; i < CTX_NAME.length; i++) if (s.indexOf(CTX_NAME[i][0]) >= 0) return CTX_NAME[i][1];

    if (kk) return +kk[1] * 1000;

  }
  function parseModels(j){
    var data = (j && j.data) || [], list = [], ctx = {}, meta = {};
    for (var i = 0; i < data.length; i++){

      if (!m || !m.id) continue;
      list.push(m.id);
      var caps = modelCaps(m);
      if (caps.ctx) ctx[m.id] = caps.ctx;

  /* ---- v2.9：token 估算（参照 openai-cookbook「How to count tokens」、Anthropic token counting、

  function httpJson(url, ms){

  function fillMetaFromCatalog(ids, useNet){

      var n = 0;
      ids.forEach(function(id){

        if (!hit) return;
        var rec = {};
        if (!cur.ctx && hit.c) rec.ctx = hit.c;
        if (!cur.out && hit.o) rec.out = hit.o;
        if (!cur.in && hit.i) rec.in = hit.i;
        if (!cur.reason && hit.r) rec.reason = 'reasoning_effort';

function walkEntry(ent, path, out){
  return new Promise(function(res){
    if (ent.isFile){ ent.file(function(f){ if (f){ f._rel = path + ent.name; out.push(f); } res(); }, function(){ res(); }); return; }
    if (ent.isDirectory){
      var rd = ent.createReader(), all = [];
      (function more(){
        rd.readEntries(function(es){
          if (!es.length){
            var ch = Promise.resolve();
            all.forEach(function(x){ ch = ch.then(function(){ return walkEntry(x, path + ent.name + '/', out); }); });
            ch.then(function(){ res(); }); return;
          }
          all = all.concat(Array.prototype.slice.call(es)); more();
        }, function(){ res(); });
      })();
      return;
    }
    res();
  });
}
function collectDrop(dt){
  var items = dt && dt.items ? Array.prototype.slice.call(dt.items) : [];
  var ents = items.map(function(it){ try { return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; } catch(e){ return null; } }).filter(Boolean);
  if (!ents.length) return Promise.resolve(Array.prototype.slice.call((dt && dt.files) || []));
  var out = [], ch = Promise.resolve();
  ents.forEach(function(en){ ch = ch.then(function(){ return walkEntry(en, '', out); }); });
  return ch.then(function(){ return out; });
}

  /* 侧栏会话列表 */
  function ago(ts){
    var d = Date.now() - (ts || 0);
    if (d < 6e4) return '刚刚';
    if (d < 36e5) return Math.floor(d / 6e4) + '分钟';
    if (d < 864e5) return Math.floor(d / 36e5) + '小时';
    return Math.floor(d / 864e5) + '天';
  }
  /* 侧栏：会话+项目组混排 */
  function renderSessions(){
    var q = ($('#sb-q').value || '').trim().toLowerCase();
    $list.textContent = '';
    var frag = document.createDocumentFragment();
    var pins = [], units = [], byWs = {};
    for (var i = 0; i < S.sessions.length; i++){
      var s = S.sessions[i];
      if (s.temp) continue; /* v2.8：临时会话不进历史列表 */
      var hit = !q || (s.title || '').toLowerCase().indexOf(q) >= 0 || (s.workspace || '').toLowerCase().indexOf(q) >= 0;
      if (!hit) continue;
      if (s.workspace) (byWs[s.workspace] || (byWs[s.workspace] = [])).push(s);
      else (s.pinned ? pins : units).push({ t: s.updatedAt, s: s });
    }
    for (var ws in byWs){
      var arr = byWs[ws], mt = 0;
      for (var k = 0; k < arr.length; k++) if (arr[k].updatedAt > mt) mt = arr[k].updatedAt;
      arr.sort(function(a, b){
        if (!!b.pinned !== !!a.pinned) return b.pinned - a.pinned; // 项目内置顶优先
        return b.updatedAt - a.updatedAt;
      });
      units.push({ t: mt, ws: ws, arr: arr, pin: !!(S.cfg.pinnedWs || {})[ws] });
    }
    units.sort(function(a, b){ return b.t - a.t; });
    /* v3.0 #21：手动拖拽顺序优先（未拖过的按时间） */
    if (S.cfg.order){
      var om = S.cfg.order, ordered = [], rest = [], q;
      for (q = 0; q < units.length; q++){
        var uu = units[q];
        if (uu.s && om[uu.s.id] != null) ordered.push(uu); else rest.push(uu);
      }
      ordered.sort(function(a, b){ return om[a.s.id] - om[b.s.id]; });
      units.length = 0;
      for (q = 0; q < ordered.length; q++) units.push(ordered[q]);
      for (q = 0; q < rest.length; q++) units.push(rest[q]);
    }
    for (var ui = units.length - 1; ui >= 0; ui--)
      if (units[ui].ws && units[ui].pin) pins.push(units.splice(ui, 1)[0]); // 置顶项目并入置顶组
    pins.sort(function(a, b){ return b.t - a.t; });
    function group(label, arr){
      if (!arr.length) return;
      if (label) frag.appendChild(el('div', { class: 'ss-group', text: label }));
      for (var i = 0; i < arr.length; i++){
        var u = arr[i];
        if (u.s){ frag.appendChild(sessionNode(u.s)); continue; }
        var closed = !!(S.cfg.wsClosed || {})[u.ws];
        var nm = u.ws.split(/[\\/]/).filter(Boolean).pop() || u.ws;
        frag.appendChild(el('div', { class: 'ss-proj' + (closed ? ' closed' : '') + (u.pin ? ' pinned' : ''), 'data-pws': u.ws, title: u.ws }, [
          icon('down', 'chev'),
          icon('folder'),
          el('span', { class: 'nm', text: nm }),
          el('button', { class: 'pinb' + (u.pin ? ' on' : ''), 'data-ppin': '1', title: u.pin ? '取消置顶' : '置顶项目' }, [icon('pin')]),
          el('button', { class: 'add', 'data-pnew': '1', title: '新建任务（Agent+本文件夹）' }, [icon('plus')]),
          el('button', { class: 'delb', 'data-pdel': '1', title: '删除项目（含全部任务）' }, [icon('trash')])
        ]));
        if (!closed) for (var j = 0; j < u.arr.length; j++) frag.appendChild(sessionNode(u.arr[j], true));
      }
    }
    group(pins.length ? '置顶' : null, pins);
    /* v3.0 #21：无项目分组时，普通会话按「今天/昨天/本周/更早」分桶 */
    (function(){
      var hasProj = false;
      for (var i = 0; i < units.length; i++) if (units[i].ws){ hasProj = true; break; }
      if (S.cfg.groupSessions !== false && !hasProj && units.length > 1){
        var d0 = new Date(); d0.setHours(0, 0, 0, 0);
        var t0 = d0.getTime(), day = 864e5;
        var buckets = [['今天', [], 0], ['昨天', [], 0], ['本周', [], 0], ['更早', [], 0]];
        for (var j = 0; j < units.length; j++){
          var ts = units[j].t || 0;
          var bi = ts >= t0 ? 0 : ts >= t0 - day ? 1 : ts >= t0 - 7 * day ? 2 : 3;
          buckets[bi][1].push(units[j]); buckets[bi][2] = 1;
        }
        for (var k = 0; k < buckets.length; k++)
          if (buckets[k][2]) group(buckets[k][0], buckets[k][1]);
      } else {
        group(pins.length && units.length ? '会话' : null, units);
      }
    })();
    $list.appendChild(frag);
    wireDrag();
  }
  /* #21 拖拽排序：拖完把当前可见普通会话顺序写成 cfg.order，之后按它排 */
  function wireDrag(){
    var items = $list.querySelectorAll('.ss-item:not(.sub)');
    for (var i = 0; i < items.length; i++){
      (function(it){
        it.setAttribute('draggable', 'true');
        it.addEventListener('dragstart', function(e){
          S._dragSid = it.getAttribute('data-sid');
          try { e.dataTransfer.setData('text/plain', S._dragSid); } catch (x) {}
        });
        it.addEventListener('dragover', function(e){ e.preventDefault(); it.classList.add('drag-over'); });
        it.addEventListener('dragleave', function(){ it.classList.remove('drag-over'); });
        it.addEventListener('drop', function(e){
          e.preventDefault(); it.classList.remove('drag-over');
          var from = S._dragSid, to = it.getAttribute('data-sid');
          if (!from || !to || from === to) return;
          var order = [], nodes = $list.querySelectorAll('.ss-item:not(.sub)');
          for (var j = 0; j < nodes.length; j++) order.push(nodes[j].getAttribute('data-sid'));
          var fi = order.indexOf(from), ti = order.indexOf(to);
          if (fi < 0 || ti < 0) return;
          order.splice(fi, 1);
          var ni = order.indexOf(to);                      /* 移除后重新定位，避免下标漂移 */
          order.splice(fi < ti ? ni + 1 : ni, 0, from);    /* 向下拖插到目标之后，向上拖插到之前 */
          var map = {};
          order.forEach(function(sid, n){ map[sid] = n; });
          setCfg({ order: map });
          renderSessions();
        });
      })(items[i]);
    }
  }

  /* v0.2.1：工具卡片 —— 「运行 js / 写入 x.mjs / 抓取 URL / 搜索 q」一行一条，点开才看原始输出 */
  var TOOL_LABEL = { run: '运行', write: '写入', patch: '打补丁', list: '列目录', preview: '预览', web: '抓取', search: '搜索', play: '播放', download: '下载', get: '抓取', read: '读取' };
  function toolEvents(m){
    if (m.tools && m.tools.length) return m.tools;
    var out = [], lines = String(m.content || '').split('\n');
    for (var i = 0; i < lines.length; i++){
      var l = lines[i], a, b;
      if ((a = /^\[run-result\]\s*(\S+)\s*(成功|失败)（(\d+)ms/.exec(l)))
        out.push({ op: 'run', kind: a[1], ok: a[2] === '成功', ms: +a[3] });
      else if ((b = /^\[vfs\]\s*已(写入|打补丁)\s*(\S+?)（([^）]+)）/.exec(l)))
        out.push({ op: b[1] === '写入' ? 'write' : 'patch', path: b[2], size: b[3], ok: true });
      else if ((b = /^\[vfs\]\s*(写入失败|打补丁失败)：(.+)$/.exec(l)))
        out.push({ op: 'write', ok: false, brief: b[2] });
      else if ((b = /^\[web\]\s*(https?:\/\/\S+?)（成功，(\d+)\s*字/.exec(l)))
        out.push({ op: 'web', url: b[1], len: +b[2], ok: true });
      else if ((b = /^\[web\]\s*(抓取失败|地址无效)[：:]?(.*)$/.exec(l)))
        out.push({ op: 'web', ok: false, brief: (b[2] || b[1]).slice(0, 60) });
      else if ((b = /^\[search\]\s*(.+?)（(\d+)\s*条/.exec(l)))
        out.push({ op: 'search', q: b[1], n: +b[2], ok: true });

        navigator.clipboard.writeText(t).then(function(){ return true; }).catch(function(){ return legacyCopy(t); }),
        new Promise(function(res){ setTimeout(function(){ res(legacyCopy(t)); }, 600); })
      ]);
    }
    return Promise.resolve(legacyCopy(t));
  }
  function legacyCopy(t){
    var ta = el('textarea', { style: 'position:fixed;opacity:0' });
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  function $listNode(id){ // Issue 19: 转义属性值中的引号/反斜杠，防特殊 id 破坏选择器

  /* 附件：图片压缩 / 纯文本直读 / 文档解析（§4.3，v1.4 放宽格式与大小） */
  var TEXT_EXT = { txt: 1, md: 1, markdown: 1, json: 1, html: 1, htm: 1, css: 1, js: 1, py: 1,
    java: 1, c: 1, cpp: 1, h: 1, cs: 1, xml: 1, yml: 1, yaml: 1, csv: 1, log: 1, ini: 1, toml: 1, sql: 1, sh: 1, bat: 1 };
  var TEXT_SLICE = 256 * 1024;     // 注入 prompt 时截断长度
  function extOf(name){ var m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toLowerCase() : ''; }
  function docMaxBytes(){ return clamp(parseInt(S.cfg.maxDocMB, 10) || 20, 1, 100) * 1048576; }  // 文本/文档上限
  function imgMaxBytes(){ return clamp(parseInt(S.cfg.maxImgMB, 10) || 10, 1, 100) * 1048576; }   // 图片上限
  function isTextFile(f){
    if (/^text\//.test(f.type)) return true;
    return !!TEXT_EXT[extOf(f.name)];
  }
  function isDocFile(f){ return !!DOC_EXT[extOf(f.name)]; }   // docx/xlsx/pptx/pdf/rtf（v1.4）
  function addFiles(files){
    var imgs = [], texts = [], docs = [], bad = [];
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      if (/^image\//.test(f.type)) imgs.push(f);
      else if (isTextFile(f)) texts.push(f);
      else if (isDocFile(f)) docs.push(f);
      else bad.push(f);
    }
    bad.forEach(function(f){ toast('不支持的文件格式：' + f.name, true); });
    if (!imgs.length && !texts.length && !docs.length) return;
    imgs.forEach(function(f){
      if (f.size > imgMaxBytes()){ toast('图片超过 ' + (parseInt(S.cfg.maxImgMB, 10) || 10) + 'MB：' + f.name, true); return; }
      compressImage(f).then(function(r){
        S.pendAtts.push({ id: uuid(), name: f.name, blob: r.blob, w: r.w, h: r.h, url: URL.createObjectURL(r.blob) });
        renderChips();
      }).catch(function(){ toast('图片处理失败：' + f.name, true); });
    });
    texts.forEach(function(f){
      if (f.size > docMaxBytes()){ toast('文本/文档超过 ' + (parseInt(S.cfg.maxDocMB, 10) || 20) + 'MB：' + f.name, true); return; }
      f.text().then(function(content){
        S.pendAtts.push({
          id: uuid(), name: f.name, blob: f, isText: true, size: f.size,
          text: content.slice(0, TEXT_SLICE), truncated: content.length > TEXT_SLICE
        });
        renderChips();
      }).catch(function(){ toast('文件读取失败：' + f.name, true); });
    });
    docs.forEach(function(f){ // 文档解析：提取为纯文本附件，随重试/导入持久化
      if (!S.cfg.docParse){ toast('文档解析未开启（设置 → 文档解析）：' + f.name, true); return; }
      if (f.size > docMaxBytes()){ toast('文档超过 ' + (parseInt(S.cfg.maxDocMB, 10) || 20) + 'MB：' + f.name, true); return; }
      toast('正在解析文档：' + f.name);
      DOC.parse(f).then(function(txt){
        if (!txt || !txt.replace(/\s/g, '')) throw new Error('empty');
        S.pendAtts.push({
          id: uuid(), name: f.name, blob: f, isText: true, size: f.size, doc: true,
          text: txt.slice(0, TEXT_SLICE), truncated: txt.length > TEXT_SLICE
        });
        renderChips();
        toast('已解析 ' + f.name + (txt.length > TEXT_SLICE ? '（超长已截断）' : ''));
      }).catch(function(e){
        toast('文档解析失败：' + f.name + ' —— ' + (e && e.message ? e.message : '未知错误'), true);
      });
    });
  }
  function compressImage(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file); // 避免 5MB 图转 base64 常驻（§5.2.6）
      var img = new Image();
      function done(){ URL.revokeObjectURL(url); }
      img.onload = function(){
        done();
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, LIMITS.ATTACH_EDGE / Math.max(w, h));
        var q = LIMITS.ATTACH_Q, tries = 0;
        (function attempt(){
          var cw = Math.round(w * scale), ch = Math.round(h * scale);
          var cv = el('canvas');
          cv.width = cw; cv.height = ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          cv.toBlob(function(b){
            if (!b) return rej(new Error('compress'));
            if (b.size <= LIMITS.ATTACH_SEND || ++tries >= 3)
              return res({ blob: b, w: cw, h: ch });
            scale *= 0.8; q = Math.max(0.6, q - 0.1);
            attempt();
          }, 'image/jpeg', q);
        })();
      };
      img.onerror = function(){ done(); rej(new Error('decode')); };
      img.src = url;
    });
  }
  function revokePreviews(){
    for (var i = 0; i < S.previewUrls.length; i++) URL.revokeObjectURL(S.previewUrls[i]);

  /* 导入/导出：流式写 Blob
     F5：导出含全部聊天/附件；默认【脱敏分享】把 workspace 绝对路径压成末级文件夹名，
     避免泄露本机目录结构。选【完整备份】才保留绝对路径（仅自用/还原；工作区需重新授权）。 */
  function doExport(){
    var full = confirm('导出模式\n\n【确定】完整备份 —— 保留本机工作区绝对路径，用于自用还原\n【取消】脱敏分享 —— 工作区只保留文件夹名，去除本机绝对路径\n\n导出文件包含全部聊天记录与附件，请确认分享对象。');
    DB.exportData().then(function(d){
      var sess = d.sessions;
      if (!full){
        sess = sess.map(function(s){
          var o = {}; for (var k in s) o[k] = s[k];
          if (o.workspace) o.workspace = (String(o.workspace).split(/[\\/]/).filter(Boolean).pop()) || '';
          return o;
        });
      }
      var atts = d.attachments || [];
      var parts = ['{"v":2,"sessions":', JSON.stringify(sess), ',"messages":', JSON.stringify(d.messages), ',"workfs":', JSON.stringify(d.workfs || []), ',"attachments":['];
      var chain = Promise.resolve();
      atts.forEach(function(a, i){
        chain = chain.then(function(){
          return blobToDataURL(a.blob).then(function(u){
            parts.push((i ? ',' : '') + JSON.stringify({ id: a.id, sid: a.sid, name: a.name, mime: a.mime, size: a.size, w: a.w, h: a.h, data: u }));
          });
        });
      });
      chain.then(function(){
        parts.push(']}');
        var blob = new Blob(parts, { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = el('a', { href: url, download: 'solochat-export-' + new Date().toISOString().slice(0, 10) + '.json' });
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); // createObjectURL 与 revoke 成对（§5.2.1）
        toast('导出完成');
      });
    });
  }
  function doImport(file){
    var r = new FileReader();
    r.onload = function(){
      var d;
      try { d = JSON.parse(r.result); } catch (e) { toast('文件不是有效 JSON', true); return; }
      if (!d || !Array.isArray(d.sessions) || !Array.isArray(d.messages)){ toast('文件格式不符', true); return; }
      (d.attachments || []).forEach(function(a){
        if (a.data){
          try { a.blob = dataURLtoBlob(a.data); } // Issue 19: 单个损坏附件不再中断整个导入
          catch (e){ a.blob = null; }
        }
        delete a.data;
      });
      DB.importData(d).then(function(){ reloadSessions(); toast('导入完成'); });
    };
    r.readAsText(file);
  }

  /* 上下文估算（v2.9 重做 / v3.0 修正口径）
     口径 = 缓存命中 + 未缓存历史 + 本次输入 + 本次输出。
     注意「本次输出」是**已经发生的**：上一轮回复真实生成的 completion token，
     不再按 max_tokens 预占一个「预计输出」（那既会重复计数，又会在空草稿时凭空多出几千）。 */
  function ctxEst(){
    var fam = NET.estimate.family(S.cfg.currentModel);
    var u = lastUsage(S.msgs);
    var sys = (curSession() && curSession().systemPrompt) || S.cfg.systemPrompt || '';
    var sysT = Math.ceil(NET.estimate.text(sys, fam));
    var histT, cache = 0, outT = 0, src = 'estimate';
    if (u && u.p > 0){
      /* 真实口径：prompt（缓存+未缓存）与 completion 分开报，不再拿「预计输出」凑数 */
      histT = u.p;                        /* 上一轮请求的 prompt = 系统提示 + 全部历史 */
      outT = u.c || 0;                    /* 上一轮回复真实生成的 token（已发生） */
      cache = Math.min(u.h || 0, histT);
      src = 'actual';
    } else {
      var t = 0, n = 0, chars = 0;
      for (var i = S.msgs.length - 1; i >= 0 && n < LIMITS.CTX_MSGS; i--){
        var m = S.msgs[i], len = String(m.content || '').length;
        if (chars + len > LIMITS.CTX_CHARS && n) break;
        t += 4 + NET.estimate.text(m.content, fam); chars += len; n++;
      }
      histT = Math.ceil(sysT + t);
    }
    var inp = ($input && $input.value) || '';
    var inpT = (inp ? 4 : 0) + NET.estimate.text(inp, fam);
    var imgN = 0, attT = 0;
    for (var k = 0; k < S.pendAtts.length; k++){
      var a = S.pendAtts[k];
      if (a.isText) attT += NET.estimate.text(a.text || '', fam);
      else { imgN++; attT += NET.estimate.image(a.w, a.h); }
    }
    var used = histT + inpT + attT + outT;
    return { tok: Math.ceil(used), sys: sysT, hist: histT, cache: Math.ceil(cache),
      uncached: Math.ceil(Math.max(0, histT - cache)),
      inp: Math.ceil(inpT), att: Math.ceil(attT), imgN: imgN,
      out: Math.ceil(outT), src: src, nMsgs: u ? 0 : undefined };
  }
  function renderCtxRing(){

    var fg = z.querySelector('.ctx-fg'), num = z.querySelector('.ctx-num');

    if (num) num.textContent = '≈' + fmtTok(e.tok) + '/' + fmtTok(lim);
    z.classList.toggle('warn', pct >= 0.7 && pct < 0.9);
    z.classList.toggle('over', pct >= 0.9);
    var tip = ['上下文占用 ≈ ' + e.tok.toLocaleString() + ' / ' + lim.toLocaleString() + ' tok（' + Math.round(pct * 100) + '%）',
      '= 缓存命中 ' + e.cache.toLocaleString() + ' + 未缓存输入 ' + e.uncached.toLocaleString() +
      ' + 草稿 ' + (e.inp + e.att).toLocaleString() + ' + 本次输出 ' + e.out.toLocaleString(),

      ensure(); items = source(); items._view = items; sel = 0;
      inp.value = ''; render(''); box.classList.add('show'); shown = true;
      setTimeout(function(){ inp.focus(); }, 20);
    }
    function close(){ if (box) box.classList.remove('show'); shown = false; }
    function isOpen(){ return shown; }
    function key(e){
      if (!shown) return false;

      if (e.key === 'ArrowDown'){ sel = Math.min(n - 1, sel + 1); render(inp.value.trim().toLowerCase()); return true; }

  /* ---------- #23 会话内搜索 ---------- */
  var FIND = (function(){
    var bar, inp, cnt, hits = [], idx = -1, on = false;
    function ensure(){
      if (bar) return;
      inp = el('input', { placeholder: '在会话内查找…', spellcheck: 'false' });
      cnt = el('span', { class: 'cnt', text: '' });
      bar = el('div', { id: 'find-bar' }, [
        inp, cnt,
        el('button', { class: 'btn btn-sec', 'data-f': 'prev', text: '↑' }),
        el('button', { class: 'btn btn-sec', 'data-f': 'next', text: '↓' }),
        el('button', { class: 'btn btn-sec', 'data-f': 'close', text: '✕' })
      ]);
      var sc = $('#msg-scroll');
      sc.parentNode.insertBefore(bar, sc);
      inp.addEventListener('input', function(){ scan(inp.value); });
      bar.addEventListener('click', function(e){
        var b = e.target.closest('[data-f]'); if (!b) return;
        var a = b.getAttribute('data-f');
        if (a === 'close') return close();
        step(a === 'next' ? 1 : -1);
      });
    }
    function clearMarks(){
      var ms = document.querySelectorAll('#msg-list mark.hit');
      for (var i = 0; i < ms.length; i++){
        var m = ms[i], p = m.parentNode;
        p.replaceChild(document.createTextNode(m.textContent), m);
        p.normalize();
      }
      hits = []; idx = -1;
    }
    function scan(q){
      clearMarks();
      if (!q){ cnt.textContent = ''; return; }
      var root = $('#msg-list'), walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var nodes = [], t;
      while ((t = walker.nextNode())) if (t.nodeValue && t.nodeValue.trim()) nodes.push(t);
      var lq = q.toLowerCase();
      for (var i = 0; i < nodes.length; i++){
        var node = nodes[i], txt = node.nodeValue, low = txt.toLowerCase(), from = 0;
        while (true){
          var k = low.indexOf(lq, from);
          if (k < 0) break;
          var r = document.createRange();
          r.setStart(node, k); r.setEnd(node, k + q.length);
          var mk = el('mark', { class: 'hit', text: txt.slice(k, k + q.length) });
          try { r.deleteContents(); r.insertNode(mk); } catch (e) { break; }
          hits.push(mk);
          node = mk.nextSibling;                         /* 继续在剩下的文本节点里找 */
          if (!node || node.nodeType !== 3) break;
          txt = node.nodeValue; low = txt.toLowerCase(); from = 0;
        }
      }
      cnt.textContent = hits.length ? '0/' + hits.length : '无结果';
      idx = -1;
      if (hits.length) step(1);
    }
    function step(d){
      if (!hits.length) return;
      if (idx >= 0 && hits[idx]) hits[idx].classList.remove('cur');
      idx = (idx + d + hits.length) % hits.length;
      var h = hits[idx];
      if (!h) return;
      h.classList.add('cur');
      try { h.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { h.scrollIntoView(); }
      cnt.textContent = (idx + 1) + '/' + hits.length;
    }
    function open(){ ensure(); bar.classList.add('show'); on = true; inp.focus(); inp.select(); }
    function close(){ if (!bar) return; clearMarks(); bar.classList.remove('show'); on = false; }
    function isOpen(){ return on; }
    function key(e){
      if (e.key === 'Escape' && on){ close(); return true; }
      if (e.key === 'F3' && on){ step(1); return true; }
      return false;
    }
    return { open: open, close: close, isOpen: isOpen, key: key, rescan: function(){ if (on) scan(inp.value); } };
  })();

    box.appendChild(el('div', { class: 'f-actions' }, [

    function render(){
      body.textContent = '';
      Promise.all([DB.allSessions(), DB.allAttachments(), DB.allWorkfs()]).then(function(r){
        var ses = r[0] || [], atts = r[1] || [], wfs = r[2] || [];
        var ids = {}; ses.forEach(function(s){ ids[s.id] = 1; });
        var aBytes = 0, orphan = [];
        atts.forEach(function(a){
          var sz = (a.blob && a.blob.size) || a.size || (a.text ? a.text.length : 0);
          aBytes += sz;
          if (a.sid && !ids[a.sid]) orphan.push(a.id);
        });
        var wBytes = 0;
        wfs.forEach(function(w){ wBytes += (w.content || '').length + (w.path || '').length; });
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '会话' }), el('b', { text: String(ses.length) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '附件' }), el('b', { text: atts.length + ' 个 · ' + kb(aBytes) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '虚拟工作区文件' }), el('b', { text: wfs.length + ' 个 · ' + kb(wBytes) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '孤立附件' }), el('b', { text: orphan.length + ' 个' })]));
        S._orphan = orphan;
        /* v3.0 #3：按会话排出占用前 20，长会话可压缩（只留最近 30 条 + 一条摘要占位） */
        var top = ses.slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 20);
        var attBySid = {};
        atts.forEach(function(a){
          var sz = (a.blob && a.blob.size) || a.size || (a.text ? a.text.length : 0);
          if (a.sid) attBySid[a.sid] = (attBySid[a.sid] || 0) + sz;
        });
        Promise.all(top.map(function(s){ return DB.msgsBySid(s.id); })).then(function(lists){
          var rows = [];
          for (var i = 0; i < top.length; i++){
            var ms = lists[i] || [], bytes = attBySid[top[i].id] || 0;
            for (var j = 0; j < ms.length; j++) bytes += (ms[j].content || '').length;
            rows.push({ s: top[i], n: ms.length, b: bytes });
          }
          rows.sort(function(a, b){ return b.b - a.b; });
          if (!rows.length) return;
          body.appendChild(el('div', { class: 'sub', style: 'margin-top:12px', text: '占用最大的会话（前 20）' }));
          rows.forEach(function(r){
            body.appendChild(el('div', { class: 'sc-row' }, [
              el('span', { class: 't', text: r.s.title || '未命名会话', title: r.s.title || '' }),
              el('span', { class: 'hint', text: r.n + ' 条 · ' + (r.b / 1024).toFixed(0) + ' KB' }),
              r.n > 40 ? el('button', { class: 'btn btn-ghost rn-mini', 'data-m': 'compress', 'data-id': r.s.id, text: '压缩' }) : ''
            ]));
          });
        });
        if (navigator.storage && navigator.storage.estimate)
          navigator.storage.estimate().then(function(est){
            var pct = est.quota ? est.usage / est.quota : 0;
            body.appendChild(el('div', { class: 'kv', style: 'margin-top:8px' }, [
              el('span', { text: '浏览器分配空间' }), el('b', { text: kb(est.usage || 0) + ' / ' + kb(est.quota || 0) })
            ]));
            var bar = el('div', { class: 'bar' }, [el('i', { style: 'width:' + Math.max(1, Math.round(pct * 100)) + '%' })]);
            body.appendChild(bar);
          });
      });
    }
    S._refreshStorage = render;
  }
  /* v3.0 #3：压缩单个长会话——保留最近 30 条，早前消息合并成一条摘要占位（不可逆，需二次确认） */
  function compressSession(sid){
    DB.msgsBySid(sid).then(function(ms){
      ms.sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
      var keep = 30, dropN = ms.length - keep;
      if (dropN <= 10) return toast('消息不多，无需压缩');
      var drop = ms.slice(0, dropN);
      return confirmBox({
        title: '压缩会话',
        text: '将删除该会话最早的 ' + dropN + ' 条消息，保留最近 ' + keep + ' 条，并插入一条摘要占位。此操作不可撤销，确定继续？',
        okText: '压缩'
      }).then(function(ok){
        if (!ok) return;
        var head = (drop[0].content || '').replace(/\s+/g, ' ').slice(0, 40);
        var tail = (drop[drop.length - 1].content || '').replace(/\s+/g, ' ').slice(0, 40);
        var chain = Promise.resolve();
        drop.forEach(function(m){ chain = chain.then(function(){ return DB.delMessage(m.id); }); });
        chain = chain.then(function(){
          return DB.putMessage({
            id: uuid(), sid: sid, role: 'system', status: 'ok', ts: (drop[0].ts || Date.now()),
            content: '（已压缩 ' + dropN + ' 条早期消息：' + head + ' … ' + tail + '）', attachments: []
          });
        }).then(function(){
          return DB.msgsBySid(sid);
        }).then(function(now){
          var s = (S.sessions || []).filter(function(x){ return x.id === sid; })[0];
          if (s){ s.msgCount = now.length; DB.putSession(s); }
          toast('已压缩 ' + dropN + ' 条早期消息');
          if (sid === S.sid) renderMsgs();
          if (S._refreshStorage) S._refreshStorage();
        });
        return chain;
      });
    });
  }

  function exportSnapshot(){

    try { c = JSON.parse(JSON.stringify(S.cfg)); } catch (e) { c = {}; }
    for (var k0 in c) if (skip.test(k0)) delete c[k0];
    /* presets 里也有 apiKey：深拷贝时递归剥离，避免密钥进快照文件 */
    (function scrub(v){
      if (!v || typeof v !== 'object') return v;
      for (var kk in v){
        if (skip.test(kk)) delete v[kk];
        else if (v[kk] && typeof v[kk] === 'object') scrub(v[kk]);
      }
      return v;
    })(c);
    var o = { app: 'SoloChat', v: 1, ts: Date.now(), cfg: c };
    download('solochat-快照-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(o, null, 2), 'application/json');

/* v1.17：记忆 —— 工作记忆（每会话一张任务卡）+ 情景记忆（历史任务卡，词法检索）
   不引入向量库：中文按二元组切词，拉丁按词切，做重叠打分；够用且零依赖。 */
var MEM = (function(){
  var MAXN = 300;
  function toks(t){
    t = String(t || '').toLowerCase();
    var out = (t.match(/[a-z0-9_.\-]{2,}/g) || []).slice(0, 80);
    var hz = t.match(/[\u4e00-\u9fa5]+/g) || [];
    for (var i = 0; i < hz.length && out.length < 200; i++){
      var x = hz[i];
      if (x.length === 1){ out.push(x); continue; }
      for (var j = 0; j < x.length - 1 && out.length < 200; j++) out.push(x.slice(j, j + 2));
    }
    return out;
  }
  function uniq(a){ var m = {}, o = []; for (var i = 0; i < a.length; i++) if (!m[a[i]]){ m[a[i]] = 1; o.push(a[i]); } return o; }
  function score(qt, card){
    if (!card._t) card._t = uniq(toks((card.goal || '') + ' ' + (card.lesson || '') + ' ' + (card.artifacts || []).join(' ')));
    var set = {}, n = card._t.length;
    for (var i = 0; i < n; i++) set[card._t[i]] = 1;
    var hit = 0;
    for (var j = 0; j < qt.length; j++) if (set[qt[j]]) hit++;
    return n ? hit / Math.sqrt(n) : 0;
  }
  function lastUser(msgs){
    for (var i = (msgs || []).length - 1; i >= 0; i--)
      if (msgs[i].role === 'user') return String(msgs[i].content || '').trim();
    return '';
  }
  /* 写入：工作记忆 + （有工具动作时）情景卡 */
  function note(sid, msgs, status){
    if (!sid || S.cfg.memory === false) return Promise.resolve();
    var goal = lastUser(msgs).slice(0, 160);
    if (!goal) return Promise.resolve();
    return DB.workfsBySid(sid).then(function(files){
      var arts = (files || []).map(function(f){ return f.path; }).slice(0, 12);
      var card = { sid: sid, goal: goal, artifacts: arts, ts: Date.now(), status: status || 'ok' };
      return DB.taskPut(card).then(function(){
        if (!arts.length) return;
        return DB.memAll().then(function(all){
          var dup = null;
          for (var i = 0; i < (all || []).length; i++)
            if (all[i].sid === sid && all[i].goal === goal) dup = all[i];
          var rec = dup || { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
          rec.sid = sid; rec.goal = goal; rec.artifacts = arts; rec.ts = Date.now(); rec.status = status || 'ok';
          rec.lesson = rec.lesson || '';
          return DB.memPut(rec);
        });
      });
    }).then(function(){
      return promptFor(sid, msgs);
    }).then(function(blk){
      S._mem = S._mem || {}; S._mem[sid] = blk || '';
    }).catch(function(){});
  }
  /* 打开会话时预热一次 */
  function warm(sid, msgs){
    if (!sid || S.cfg.memory === false) return Promise.resolve('');
    return promptFor(sid, msgs).then(function(blk){ S._mem = S._mem || {}; S._mem[sid] = blk || ''; return blk; }).catch(function(){ return ''; });
  }
  /* 注入：当前任务卡 + 相似历史（不含本会话） */
  function promptFor(sid, msgs){
  /* v1.29.7：只注入本会话目标（会话内记忆）；不再检索其它会话的卡片 */
  if (S.cfg.memory === false) return Promise.resolve('');
  var q = lastUser(msgs).slice(0, 400);
  if (!q) return Promise.resolve('');
  return DB.taskGet(sid).then(function(t){
    if (!t || !t.goal) return '';
    return '【记忆】\n本会话目标：' + t.goal +
      (t.artifacts && t.artifacts.length ? '；已有产物：' + t.artifacts.join('、') : '');
  }).catch(function(){ return ''; });
}
function search(q){
    return DB.memAll().then(function(all){
      var qt = uniq(toks(q));
      var arr = (all || []).slice();
      if (!qt.length) return arr.sort(function(a, b){ return b.ts - a.ts; });
      arr = arr.map(function(c){ return { c: c, s: score(qt, c) }; }).filter(function(x){ return x.s > 0; });
      arr.sort(function(a, b){ return b.s - a.s; });
      return arr.map(function(x){ return x.c; });
    });
  }
  function all(){ return DB.memAll(); }
  function del(id){ return DB.memDel(id); }
  function clear(){ return DB.memClear(); }
  return { note: note, warm: warm, promptFor: promptFor, search: search, all: all, del: del, clear: clear };
})();

/* v1.17：编排 —— 多智能体流水线 / 辩论 / 工作流（DAG + 自检回边） */
var ORCH = (function(){

  /* 没有会话就先建一个（编排要落库/落盘，必须有 sid） */
  function ensureSid(title){
    if (S.sid && curSession()) return S.sid;

    var s = { id: id, title: title || '编排', createdAt: now, updatedAt: now, pinned: false,

    try { renderSessions(); } catch(e){}

  /* ---------- 1. 流水线：方案 → 执行 → 验证 → 交付 ---------- */
  var HINT = {
    plan: '只做设计：文件清单、每个文件的职责与关键接口/数据形状、验收标准。不要写完整实现。',
    build: '按上面的设计实现，交完整文件内容（用 ```write 围栏）。',
    verify: '基于设计与实现，列出可照做的验证步骤、逐条断言（输入→期望），并指出明显缺陷。',
    deliver: '汇总成果：完成了什么、怎么用、有哪些限制、还有什么待办。不要复述全文。'
  };
  function pipeline(){
    ask('多智能体流水线', '四个角色依次干活，后一个看得到前一个的产出。', '例如：做一个能记事的待办页面', function(goal){
      ensureSid('流水线：' + cut(goal, 16));
      var m = modal('流水线：' + cut(goal, 40), '方案 → 执行 → 验证 → 交付');
      var ctx = '', chain = Promise.resolve();
      var steps = [['plan', '方案'], ['build', '执行'], ['verify', '验证'], ['deliver', '交付']];
      steps.forEach(function(st, i){
        chain = chain.then(function(){
          m.log('▶ ' + (i + 1) + '/4 ' + st[1] + '（' + st[0] + '）…');
          var task = '目标：' + goal + (ctx ? '\n\n前序产出：\n' + cut(ctx, 3000) : '') + '\n\n' + (HINT[st[0]] || '');

        var ins = el('button', { class: 'btn btn-sec', text: '把结论放进输入框' });
        ins.addEventListener('click', function(){ addToInput(cut(ctx, 8000)); m.close(); });
        var cp = el('button', { class: 'btn btn-ghost', text: '复制' });
        cp.addEventListener('click', function(){
          try { if (window.chrome && chrome.webview) chrome.webview.postMessage({ t: 'copy', text: ctx }); } catch(e){}
          UI.toast('已复制');

        m.acts.appendChild(cp); m.acts.appendChild(ins);

  /* ---------- 2. 辩论：三视角并行 + 裁判 ---------- */
  function debate(){
    ask('多智能体辩论', '三个视角各自论证，再由审查角色合并共识与分歧。', '例如：这个页面该不该拆成组件？', function(q){
      ensureSid('辩论：' + cut(q, 16));
      var m = modal('辩论：' + cut(q, 40), 'plan / build / verify 并行 → 裁判合并');
      var views = [
        ['plan', '从事实与证据角度：先列已知/未知，再论证。'],
        ['build', '从实现与代价角度：给出可执行方案与成本。'],
        ['verify', '从风险与反例角度：找漏洞、边界条件、反例。']
      ];
      var ps = views.map(function(v){
        return SUB.run('问题：' + q + '\n' + v[1] + '\n结论 5 行以内，给出你方最强的三条论据。', v[0], 0)

          .catch(function(e){ return '【' + v[0] + '】（失败：' + (e && e.message || e) + '）'; });

      Promise.all(ps).then(function(arr){
        m.log('▶ 裁判合并…');

          { role: 'user', content: '问题：' + q + '\n\n各方观点：\n' + cut(arr.join('\n\n'), 8000) }

    });
  }

  /* ---------- 3. 工作流：生成 → 运行 → 自检重写 → 存盘 ---------- */
  function extractHtml(t){
    var t2 = String(t || '');
    var mm = /```(?:html)?\s*\n([\s\S]*?)```/i.exec(t2);
    if (mm && /<[a-z!]/i.test(mm[1])) return mm[1].trim();
    var i = t2.search(/<!doctype html|<html/i);
    return i >= 0 ? t2.slice(i).trim() : '';
  }
  function flow(){
    ask('工作流 · 生成页面并自检', '生成 → 沙箱运行 → 有报错就带着报错重写（最多 2 次）→ 存入工作区', '例如：做一个能拖拽排序的看板', function(goal){
      ensureSid('工作流：' + cut(goal, 16));
      var m = modal('工作流', '节点 1 生成 · 2 运行 · 3 判定 · 4 存盘');
      var code = '', tries = 0, lastErr = '';
      function gen(err){
        m.log('▶ 节点 1 生成' + (tries ? '（第 ' + tries + ' 次重写）' : ''));
        return NET.chatOnce([
          { role: 'system', content: '你是前端实现者。只输出一个完整可运行的单文件 HTML（内联 CSS/JS），不要解释。' },
          { role: 'user', content: goal + (err ? '\n\n上次沙箱报错：\n' + cut(err, 2000) + '\n修好后输出完整 HTML。' : '') }
        ], { maxTokens: 6000, timeout: 240000 }).then(function(msg){
          var txt = (msg && msg.content) || '';
          code = extractHtml(txt);
          if (!code) throw new Error('模型没给出 HTML（回复 ' + txt.length + ' 字符：' + cut(txt, 120).replace(/\n/g, ' ') + '）');
          m.log('✔ 生成 ' + code.length + ' 字符', 'ok');
        });

      /* v1.28.3：一条回复里的多个 agent/sub 先聚成一批并行跑，剩下的工具照原样串行 */
      (function hoistSubs(){
        var subs = [], rest = [];
        for (var i = 0; i < calls.length; i++){
          var c0 = calls[i];
          if (c0.op === 'agent' || c0.op === 'sub'){
            if (c0.items){ for (var q = 0; q < c0.items.length; q++) subs.push(c0.items[q]); continue; }
            var nm = String(c0.arg || '').trim().split(/\s+/)[0];
            var tk = (String(c0.arg || '').replace(nm, '') + (c0.body ? '\n' + c0.body : '')).trim();
            if (nm) subs.push({ name: nm, task: tk });
          } else rest.push(c0);
        }
        if (subs.length > 1){ rest.unshift({ op: 'suball', items: subs }); calls = rest; }
      })();
    /* v0.2.1：一次工具结果 = 一条 role='tool' 消息；文本给模型，events 给 UI 画一行行卡片 */
    function add(text, ev){ parts.push(text); if (ev) events.push(ev); }
  function addImg(dataUrl){ if (dataUrl && imgs.length < 4) imgs.push(dataUrl); }
    function finish(extra){
      UI.holdBusy(-1);
      var body = parts.join('\n\n');
      if (extra) body += '\n\n' + extra;
      if (!/^\[(run-result|vfs|web|search|preview|play|download|get)\]/.test(body)) body = '[run-result]\n' + body;
      note(body.slice(0, LIMITS.WORK_RESULT_CHARS), sid0, events, imgs);
    }
    (function next(){
      if (w0.cancel){ UI.holdBusy(-1); return; } // v0.3.0：取消也要归还 busy，否则 S.pend 永久 >0
      if (done >= calls.length){
        w0.turns++;
        finish();
        UI.startStreamFor(sid0); // 结果回灌后自动续跑一轮（目标会话，v2.2）
        return;
      }
      var c = calls[done++];
      /* v0.4.0：扩展系统 —— 关闭的内置工具直接拒绝；技能懒加载；自定义工具走 EXT.runTool */
      if (EXT.isKnownBuiltin(c.op) && !EXT.isOn(c.op)){
        add('[' + c.op + '] 该工具已在「设置 → 扩展」里关闭', { op: c.op, ok: false, brief: '已关闭' });
        next(); return;
      }
      if (c.op === 'skill'){
        var skName = String(c.arg || '').trim().split(/\s+/)[0];
        var sk = EXT.skillText(skName);
        add(sk ? '[skill] ' + skName + '\n```\n' + sk.slice(0, 6000) + '\n```'
               : '[skill] 没有这个技能：' + skName + '（已有：' + (EXT.skillNames(S.cfg.mode).join(', ') || '无') + '）',
            { op: 'skill', ok: !!sk, brief: skName });
        next(); return;
      }
      if (c.op === 'suball'){
        var items = (c.items && c.items.length) ? c.items.slice() : [];
        if (!items.length){
          var rawLines = String(c.body || c.arg || '').split(/\r?\n/);
          for (var sli = 0; sli < rawLines.length; sli++){
            var ln = rawLines[sli].trim(); if (!ln) continue;
            var mm2 = ln.match(/^([a-z][a-z0-9-]{1,24})\s*[|:：]\s*(.+)$/) || ln.match(/^([a-z][a-z0-9-]{1,24})\s+(.+)$/);
            if (mm2) items.push({ name: mm2[1], task: mm2[2] });
          }
        }
        if (!items.length){ add('[suball] 没解析出任务（每行：名字 | 任务）', { op: 'suball', ok: false, brief: '解析失败' }); next(); return; }
        var t0a = Date.now();
        SUB.runAll(items, 0).then(function(rs){
          var outTxt = rs.map(function(r){ return '【' + r.name + '】' + (r.ok ? '' : '（失败）') + '\n' + String(r.text).slice(0, 3000); }).join('\n\n');
          var allOk = true; for (var ri = 0; ri < rs.length; ri++) if (!rs[ri].ok) allOk = false;
          var hintA = SUB.stageHint(rs.map(function(r){ return r.name; }));
          add('[suball] ' + rs.length + ' 个并行完成（' + (Date.now() - t0a) + 'ms）\n' + outTxt + (hintA ? '\n' + hintA : ''),
            { op: 'suball', ok: allOk, ms: Date.now() - t0a, brief: rs.map(function(r){ return r.name; }).join(' + ') });
        }, function(e){
          add('[suball] 失败：' + (e && e.message || e), { op: 'suball', ok: false, brief: '失败' });
        }).then(next);
        return;
      }
      if (c.op === 'sub' || c.op === 'agent'){
        var subName = String(c.arg || '').trim().split(/\s+/)[0];
        var subTask = (String(c.arg || '').replace(subName, '') + (c.body ? '\n' + c.body : '')).trim();
        var t0s = Date.now();
        SUB.run(subTask, subName, 0).then(function(txt){
          var hintS = SUB.stageHint([subName]);
          add('[sub] ' + subName + '\n```\n' + String(txt).slice(0, 6000) + '\n```' + (hintS ? '\n' + hintS : ''), { op: 'sub', ok: true, ms: Date.now() - t0s, brief: subName });
        }, function(e){
          add('[sub] ' + subName + ' 失败：' + (e && e.message || e), { op: 'sub', ok: false, brief: '失败' });
        }).then(next);
        return;
      }
      var extTool = EXT.hasTool(c.op);
      if (extTool){
        var t0x = Date.now();
        EXT.runTool(c.op, String(c.arg || '') + (c.body ? '\n' + c.body : '')).then(function(out){
          var txt = String(out == null ? '' : out);
          add('[' + c.op + '] ' + (txt.length > 4000 ? txt.slice(0, 4000) + '\n…（已截断）' : txt || '（无输出）'),
            { op: c.op, ok: true, ms: Date.now() - t0x, brief: extTool.title || c.op });
        }, function(e){
          add('[' + c.op + '] 扩展工具执行失败：' + (e && e.message || e), { op: c.op, ok: false, brief: '执行失败' });
        }).then(next);
        return;
      }
      /* ---- v0.2.1：联网抓取（页面侧真实请求，走宿主桥/代理，不受沙箱限制） ---- */
      if (c.op === 'web'){
        var u = NET.safeUrl(c.arg);
        if (!u){
          add('[web] 地址无效（需 http/https 绝对地址）：' + (c.arg || '（空）'), { op: 'web', ok: false, brief: '地址无效' });
          next(); return;
        }
        if (NET.isBinaryUrl(u)){
          add('[web] 跳过（图片/媒体/二进制资源，web 只抓文本）：' + u + '；要保存视频用 download，要看起来用 play',
            { op: 'web', url: u, ok: false, brief: '二进制资源，已跳过' });
          next(); return;
        }
        var t0 = Date.now();
        NET.fetchPageText(u).then(function(txt){
          var ms = Date.now() - t0;
          if (!txt){
            add('[web] 抓取失败：' + u + '（可能被反爬/需要登录/网络不通；可改用 search 拿摘要）',
              { op: 'web', url: u, ok: false, ms: ms, brief: '抓取失败（反爬/登录墙/断网）' });
          } else {
            var cut = txt.slice(0, LIMITS.WORK_WEB_CHARS);
            add('[web] ' + u + '（成功，' + txt.length + ' 字' + (txt.length > cut.length ? '，已截断' : '') + '）\n```\n' + cut + '\n```',
              { op: 'web', url: u, ok: true, ms: ms, len: txt.length });
            w0.errStreak = 0;
          }
        }).then(next);
        return;
      }
      /* ---- v0.2.1：联网搜索（复用设置里的搜索服务商） ---- */
      if (c.op === 'search'){
        var q = String(c.arg || '').trim();
        if (!q){ add('[search] 缺少查询词', { op: 'search', ok: false, brief: '缺少查询词' }); next(); return; }
        var ts0 = Date.now();
        NET.searchWeb(q, null, true).then(function(r){
          var ms = Date.now() - ts0;
          if (!r || !r.block){
            add('[search] 未返回结果：' + q + '（检查 设置 → 连接与模型 → 联网搜索 的服务商与密钥）',
              { op: 'search', q: q, ok: false, ms: ms, brief: '未配置搜索服务或无结果' });
          } else {
            add('[search] ' + q + '（' + (r.n || 0) + ' 条，' + (ms / 1000).toFixed(1) + 's）\n\n' + r.block,
              { op: 'search', q: q, ok: true, ms: ms, n: r.n || 0 });
            w0.errStreak = 0;
          }
        }).then(next);
        return;
      }
      if (c.op === 'vfs-write'){
        vfsWrite(sid0, c.arg, c.body).then(
          function(r){ add('[vfs] 已写入 ' + r.path + '（' + sizeFmt(r.size) + '）', { op: 'write', path: r.path, size: sizeFmt(r.size), ok: true }); w0.errStreak = 0;
            if (sid0 === S.sid && RUNNER.renderWs) RUNNER.renderWs(); // 运行面板「工作区」区即时刷新（v2.1）
            RUNNER.previewRefreshIf(sid0, r.path); }, // v2.5：正在预览该文件 → 自动刷新
          function(e){ add('[vfs] 写入失败：' + (e && e.message || '未知错误'), { op: 'write', ok: false, brief: (e && e.message || '未知错误') }); }
        ).then(next);
        return;
      }
      if (c.op === 'patch'){ /* v3.0 #14：补丁式写入 */
        DB.workfsBySid(sid0).then(function(fs){
          var base = null;
          for (var i = 0; i < fs.length; i++) if (fs[i].path === c.arg) base = fs[i].content;
          if (base == null) return Promise.reject(new Error('目标文件不存在：' + c.arg + '（先用 vfs-write 创建）'));
          var next2;
          try { next2 = applyUnified(base, c.body); }
          catch (e) { return Promise.reject(new Error('补丁无法应用：' + e.message)); }
          return vfsWrite(sid0, c.arg, next2).then(function(r){
            if (sid0 === S.sid && RUNNER.renderWs) RUNNER.renderWs();
            RUNNER.previewRefreshIf(sid0, r.path);
            w0.errStreak = 0;
            add('[vfs] 已打补丁 ' + r.path + '（' + sizeFmt(r.size) + '）', { op: 'patch', path: r.path, size: sizeFmt(r.size), ok: true });
          });
        }).catch(function(e){ add('[vfs] 打补丁失败：' + (e && e.message || e), { op: 'patch', ok: false, brief: (e && e.message || String(e)) }); })
          .then(next);
        return;
      }
      if (c.op === 'vfs-list'){
        DB.workfsBySid(sid0).then(function(fs){
          fs.sort(function(a, b){ return a.path < b.path ? -1 : a.path > b.path ? 1 : 0; });
          var lines = fs.map(function(f){ return f.path + '（' + sizeFmt(f.size || 0) + '）'; });
          add('[vfs] 工作区文件（' + fs.length + ' 项）' + (lines.length ? '\n```\n' + lines.join('\n') + '\n```' : '（空）'), { op: 'list', n: fs.length, ok: true });
        }).then(next);
        return;
      }
      /* ---- v0.2.8：任意 URL → 磁盘（图片/PDF/Office/压缩包/音视频都能存；文档顺手抽文本）---- */
      if (c.op === 'get'){
        var gline = String(c.arg || '').trim().split('\n')[0].trim();
        var gurl = (gline.split(/\s+/)[0] || '');
        if (!/^https?:\/\//i.test(gurl)){
          add('[get] 首行需要文件直链（http/https）：' + (gline || '（空）'), { op: 'get', ok: false, brief: '缺少地址' });
          next(); return;
        }
        var tg0 = Date.now(), lastT = 0;
        NET.fileGet(gurl, '', function(pr){
          var now = Date.now(); if (now - lastT < 1200) return; lastT = now;
          UI.toast('抓取中 ' + (pr.got / 1048576).toFixed(1) + ' / ' + (pr.total ? (pr.total / 1048576).toFixed(1) : '?') + ' MB');
        }).then(function(r){
          var head = '[get] 已保存：' + r.path + '（' + sizeFmt(r.size || 0) + '，' + (r.ext || '') + (r.mime ? ' / ' + r.mime : '') + '）';
          var meta = { op: 'get', path: r.path, size: sizeFmt(r.size || 0), ms: Date.now() - tg0, ok: true };
          /* v0.2.9：图片 → data URL 随结果附上，模型直接看图 */
          if (r.img && r.b64){
            var durl = 'data:' + (r.mime || 'image/png') + ';base64,' + r.b64;
            addImg(durl);
            add(head + '\n（图片已附在本条结果里，请直接看图片内容作答，不要猜）', meta);
            next(); return;
          }
          if (!r.b64){ add(head, meta); next(); return; }
          return NET.fileText(r).then(function(txt){
            txt = String(txt || '').replace(/\r/g, '').trim();
            add(txt ? head + '\n\n' + '```' + '\n' + txt.slice(0, 4000) + (txt.length > 4000 ? '\n…（已截断，共 ' + txt.length + ' 字）' : '') + '\n' + '```' : head + '\n（该文件没有可提取的文本层）', meta);
          }, function(e){
            add(head + '\n（文本提取失败：' + (e && e.message || e) + '）', meta);
          }).then(next);
        }, function(e){
          add('[get] 抓取失败：' + (e && e.message || e), { op: 'get', ok: false, brief: (e && e.message || String(e)).slice(0, 60) });
          next();
        });
        return;
      }
      /* ---- v0.2.4：把视频下载成 mp4 落到磁盘（宿主持有 Referer/UA；网页版无此能力） ---- */
      if (c.op === 'download'){
        var darg = String(c.arg || '').trim();
        var dhead = (darg.split('\n')[0] || '').trim();
        var dm = /BV[0-9A-Za-z]{10}/.exec(dhead);
        var dbvid = dm ? dm[0] : '';
        var durl = /^https?:\/\//i.test(dhead) ? dhead : '';
        if (!dbvid && !durl){
          add('[download] 首行需要视频页 URL 或 BV 号：' + (dhead || '（空）'), { op: 'download', ok: false, brief: '缺少地址' });
          next(); return;
        }
        var td0 = Date.now(), lastToast = 0;
        NET.mediaDownload({
          bvid: dbvid, url: durl, qn: 80,
          onProgress: function(pr){
            var now = Date.now();
            if (now - lastToast < 1500) return;
            lastToast = now;
            UI.toast('下载中 ' + (pr.got / 1048576).toFixed(1) + ' / ' + (pr.total ? (pr.total / 1048576).toFixed(1) : '?') + ' MB');
          }
        }).then(function(r){
          add('[download] 已保存：' + r.path + '（' + sizeFmt(r.size || 0) + (r.quality ? '，' + r.quality : '') + '）',
            { op: 'download', path: r.path, size: sizeFmt(r.size || 0), ms: Date.now() - td0, ok: true });
          UI.toast('视频已下载：' + r.path);
        }, function(e){
          add('[download] 下载失败：' + (e && e.message || e), { op: 'download', ok: false, brief: (e && e.message || String(e)).slice(0, 60) });
        }).then(next);
        return;
      }
      /* ---- v1.28.1：内置浏览器窗口（任意网页，带 cookie/登录态） ---- */
      if (c.op === 'browser'){
        var bu = NET.safeUrl(String(c.arg || '').trim() || String(c.body || '').trim());
        if (!bu){ add('[browser] 地址无效（需 http/https 绝对地址）：' + (c.arg || '（空）'), { op: 'browser', ok: false, brief: '地址无效' }); next(); return; }
        var bo = NET.openExternal(bu, 'window');
        add('[browser] 已在应用内窗口打开：' + bu, { op: 'browser', url: bu, ok: !!bo });
        next(); return;
      }
      /* ---- v0.2.3：在应用内播放窗口打开视频/网页（顶层 WebView2，带 Referer 与登录态） ---- */
      if (c.op === 'play'){
        var pu = NET.safeUrl(c.arg);
        if (!pu){ add('[play] 地址无效（需 http/https 绝对地址）：' + (c.arg || '（空）'), { op: 'play', ok: false, brief: '地址无效' }); next(); return; }
        var opened2 = NET.openExternal(pu, 'window');
        add('[play] 已在播放窗口打开：' + pu, { op: 'play', url: pu, ok: !!opened2 });
        next(); return;
      }
      if (c.op === 'preview'){ /* v2.6：AI 打开右侧内置侧边栏浏览器预览 VFS 文件 */
        var pp = String(c.arg || '').replace(/\\/g, '/').replace(/^\/+/, '').trim();
        if (!pp || pp.indexOf('..') >= 0){ add('[preview] 路径无效（需工作区相对路径）：' + (c.arg || '（空）'), { op: 'preview', ok: false, brief: '路径无效' }); next(); return; }
        if (sid0 !== S.sid){ add('[preview] 已就绪：' + pp + '（后台会话，切回本会话可预览）', { op: 'preview', path: pp, ok: true }); next(); return; }
        RUNNER.previewTo(sid0, pp, true);
        add('[preview] 已在运行面板打开：' + pp, { op: 'preview', path: pp, ok: true });
        next();
        return;
      }
      /* op === 'run' */
      var kind = crKind(c.arg);
      if (!kind){ add('[run-result] 不支持的类型：' + (c.arg || '（空）') + '（可用 html/svg/js/css/c）', { op: 'run', ok: false, brief: '不支持的类型' }); next(); return; }
      RUNNER.runCapture(kind, c.body, sid0 === S.sid).then(function(r){
        var brief = String(r.output || r.error || '').split('\n')[0].slice(0, 90);
        add(fmtRun(r, kind), { op: 'run', kind: kind, ok: !!r.ok, ms: r.ms, brief: brief });
        if (!r.ok){
          var key = String(r.error || r.output || '').replace(/\d+/g, 'N').slice(0, 120); // 错误归一（数字泛化）
          if (key && key === w0.lastErr) w0.errStreak++; else { w0.lastErr = key; w0.errStreak = 1; }
        } else w0.errStreak = 0;
      }).then(function(){
        if (w0.errStreak >= LIMITS.WORK_SAME_ERR){
          /* v3.0 #16：先在第二次同型错误时做一次「带错误上下文的自愈」，仍失败才停 */
          if (!w0.healed){
            w0.healed = 1;
            w0.turns++;
            finish('（同型错误已连续 ' + w0.errStreak + ' 次：请对照上方报错逐条修正后再运行，不要重复原写法）');
            UI.startStreamFor(sid0);
            return;
          }
          w0.turns++;
          finish('（同型错误已连续 ' + w0.errStreak + ' 次，含 1 次自愈重试仍失败，停止自动修复，请人工查看上方输出）');
          UI.toast('Work：同型错误连续 ' + w0.errStreak + ' 次，已停止自动修复', true);
          return; // 不续跑
        }
        next();
      });
    })();
  }
  return {
    handleTurn: handleTurn, scan: scan, applyUnified: applyUnified,
    reset: function(sid){ stMap[sid || S.sid] = { turns: 0, cancel: false, t0: 0, errStreak: 0, lastErr: '' }; }, // v2.2：按会话
    stop: function(sid){ stOf(sid).cancel = true; },                                                          // v2.2：按会话
    protocol: PROTOCOL, vfsWrite: vfsWrite
  };
})();

/* 调试钩子（仅当 localStorage['sc.debug']==='1'）：便于自动化测试 Work 沙箱的纯函数 */
try {
  if (localStorage.getItem('sc.debug') === '1'){
    window.SC_WORK = WORK;
    window.SC_DBG = { EXT: EXT, SUB: SUB, MODE: MODE, modelCaps: NET.modelCaps, md: MD, busy: UI.holdBusy, stage: STAGE_PROTOCOL,
      ws: function(){ var c = curSession(); return (c && c.workspace) || ''; },
      bindWs: function(path){ var c = curSession(); if (!c) return ''; c.workspace = path; DB.putSession(c); return c.workspace; },
      sid: function(){ return S.sid; },
   hint: function(a, b){ UI.routeHint(a, b); },
   hideHint: function(){ UI.hideRouteHint(); },
   fs: NET.fs,
   snaps: function(){ return SC_SNAPS; },
   diag: function(){ return DIAG; },
   FS: FS, DB: DB,
   search: function(q){ return NET.searchWeb(q, null, true); },
   src: function(){ return RUNNER.srcs(); },
   addSrc: function(a, b, c, d){ RUNNER.addSources(a, b, c, d); },
   renderSrc: function(){ RUNNER.renderSrc(); },
      cfg: function(){ return S.cfg; },
      setCfg: function(o){ setCfg(o); } };
  }
} catch (e) {}
loadCfg();
document.body.classList.toggle('sb-collapsed', S.cfg.sbHidden !== false); // v1.3：按钮 / Ctrl+B 控制，不再悬浮呼出
NET.bridge.init();
Vault.avail = NET.bridge.ok; // F4：有宿主桥才启用 DPAPI 保险库
if (Vault.avail) Vault.hydrate(S.cfg).then(function(){ saveCfg(); }); // 迁移：把旧 localStorage 明文密钥入保险库并脱敏重写
UI.init();
MODE.mountUI(); // v0.6.0：自定义模式按钮
UI.DUAL.init(); // v1.4：双开视图
if (!Vault.avail) UI.toast('未连接宿主：API Key 将明文存于浏览器 localStorage，建议使用桌面版', true);
DB.open()
  .then(function(){ UI.reloadSessions(true); }) // 每次启动进入新建会话（草稿态，发送首条消息才落库）；不再做任何自动删除
  .catch(function(){ UI.toast('本地数据库打开失败，历史记录将不可用', true); });
})();
</script>
