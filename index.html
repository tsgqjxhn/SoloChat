    function crawlList(list, ref){
      var idx = 0, lastNext = '', lastUrl = '';
      function nextOne(){
        if (idx >= list.length || out.length >= maxPages){
          /* 目录只列出前 30 章时，从最后一章继续沿「下一章」抓，避免 60 章只抓 30 章 */
          if (lastNext && out.length < maxPages) return step(lastNext, out.length, lastUrl);
          return Promise.resolve();
        }
        var cu = list[idx++];
        if (seen[cu]) return nextOne();
        seen[cu] = 1;
        return one(cu, ref).then(function(r){
          if (r.err){ fails.push({ url: cu, err: r.err }); return nextOne(); }
          var doc = null;
          try { doc = new DOMParser().parseFromString(r.html || '', 'text/html'); } catch (e) { doc = null; }
          var h1 = doc && doc.querySelector('h1');
          var title = h1 ? String(h1.textContent || '').replace(/\s+/g, ' ').trim()
                         : ((/<h1[^>]*>([\s\S]*?)<\/h1>/i.exec(r.html) || [,''])[1] || '').replace(/<[^>]+>/g, '').trim();
          lastNext = nextFromDoc(doc, cu); lastUrl = cu;
          out.push({ url: cu, title: title, text: htmlToText(r.html), next: lastNext });
          return new Promise(function(res){ setTimeout(res, delay); }).then(nextOne);
        });
      }
      return nextOne();
    }
    /* 起点是“目录页”时，自动找第一章/开始阅读 */
    function firstChapterFromDoc(doc, base){
      if (!doc) return '';
      var as = doc.querySelectorAll('a[href]'), i, t;
      for (i = 0; i < as.length; i++){
        t = String(as[i].textContent || '').replace(/\s+/g, ' ').trim();
        if (/^(第[一1]章|开始阅读|立即阅读|从头阅读|start reading)(\s|$)/i.test(t) || /第[一1]章/.test(t)){
          var h = absHref(as[i].getAttribute('href'), base); if (h) return h;
        }
      }
      return '';
    }
    function one(u, referer){
      return new Promise(function(res){
        /* v0.9.3：没有宿主桥（浏览器版）时退回 fetch，同源或带 CORS 的站照样能抓 */
        if (!(bridge.ok && S.cfg.useBridge)){
          var ac = new AbortController();
          var t2 = setTimeout(function(){ try { ac.abort(); } catch (e) {} }, 20000);
          return fetch(u, { signal: ac.signal, headers: { 'Accept': 'text/html,application/xhtml+xml' } })
            .then(function(r){ clearTimeout(t2); if (!r.ok) return { err: 'HTTP ' + r.status }; return r.text().then(function(t){ return { html: t }; }); })
            .then(function(o){ res(o); })
            .catch(function(e){ clearTimeout(t2); res({ err: '连接失败：' + ((e && e.message) || '未知') }); });
        }
        var id = 'c' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){
          if (fin) return; fin = true; lastFetchErr = '超时（20s）';
          try { bridge.abort(id); } catch (e) {}
          delete bridge.pend[id]; res({ err: '超时 20s' });
        }, 20000);
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 800000) acc += t; },
          onDone: function(status){
            if (fin) return; fin = true; clearTimeout(to); delete bridge.pend[id];
            if (!(status >= 200 && status < 300)){ lastFetchErr = 'HTTP ' + status; return res({ err: 'HTTP ' + status }); }
            res({ html: acc });
          },
          onError: function(e){
            if (fin) return; fin = true; clearTimeout(to); delete bridge.pend[id];
            lastFetchErr = '连接失败：' + ((e && e.message) || '未知');
            res({ err: lastFetchErr });
          }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(u), url: u, method: 'GET', cookies: true,
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36',
                     'Accept': 'text/html,application/xhtml+xml', 'Accept-Language': 'zh-CN,zh;q=0.9',
                     'Referer': referer || u } });
      });
    }
    function step(u, n, ref){
      if (!u || out.length >= maxPages) return Promise.resolve();
      if (seen[u]){ fails.push({ url: u, err: '循环引用' }); return Promise.resolve(); }
      seen[u] = 1;
      return one(u, ref).then(function(r){
        if (r.err){ fails.push({ url: u, err: r.err }); return; }
        var doc = null;
        try { doc = new DOMParser().parseFromString(r.html || '', 'text/html'); } catch (e) { doc = null; }
        var h1 = doc && doc.querySelector('h1');
        var title = h1 ? String(h1.textContent || '').replace(/\s+/g, ' ').trim()
                       : ((/<h1[^>]*>([\s\S]*?)<\/h1>/i.exec(r.html) || [,''])[1] || '').replace(/<[^>]+>/g, '').trim();
        var nxt = nextFromDoc(doc, u);
        var _isChapterTitle = /第\s*[0-9一二三四五六七八九十百千]+\s*章/.test(title);
        if (n === 0 && !_isChapterTitle){
          /* 目录页：拿目录里第一章的 URL（按章号排序），再沿章节页的“下一章”走。
             不要直接抓目录列表：有些站点的目录会漏/重复章节链接，章节页 next 才是完整链条。 */
          var _chapters0 = chapterLinksFromDoc(doc, u);
          if (_chapters0.length >= 1)
            return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return step(_chapters0[0], n, u); });
          var _first0 = firstChapterFromDoc(doc, u);
          if (_first0)
            return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return step(_first0, n, u); });
        }
        var _numM = /第\s*(\d+)\s*章/.exec(title);
        var _num = _numM ? +_numM[1] : 0;
        var _last = out[out.length - 1];
        /* “第5章（2/2）”这种同章分页并入上一章，不单独占一个章节名额 */
        if (_last && _num && _last.num && _num === _last.num){
          _last.text += '\n' + htmlToText(r.html);
          _last.next = nxt;
        } else {
          out.push({ url: u, title: title, text: htmlToText(r.html), next: nxt, num: _num });
        }
        if (!followNext || !nxt || out.length >= maxPages) return;
        return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return step(nxt, n + 1, u); });
      });
    }
    return step(url, 0, '').then(function(){ return { pages: out, fails: fails, start: startUrl }; });
  }

  function fetchPageText(u){
    var href = safeUrl(u);
    if (!href) return Promise.resolve(null);
    if (isBinaryUrl(href)) return Promise.resolve(null); // 图片/视频等直接跳过
    var ms = 8000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 'p' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 400000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (!(status >= 200 && status < 300)) return resolve(null);
            var txt = htmlToText(acc);
            resolve(looksBinary(txt) ? null : txt);
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(href), url: href, method: 'GET', cookies: true,
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml' } });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(href, { signal: ac.signal, headers: { 'Accept': 'text/html,application/xhtml+xml' } })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.text(); })
      .then(function(h){ clearTimeout(t); if (!h) return null; var txt = htmlToText(h); return looksBinary(txt) ? null : txt; })
      .catch(function(){ clearTimeout(t); return null; });
  }
  function fetchPages(list){
    if (!S.cfg.searchFetch || !list || !list.length) return Promise.resolve(list);
    var n = clamp(parseInt(S.cfg.searchFetchCount, 10), 0, 5);
    if (!n) return Promise.resolve(list);
    var jobs = [];
    for (var i = 0; i < list.length && jobs.length < n; i++){
      (function(it){
        /* 已是长文（Firecrawl markdown）或地址非法则跳过 */
        if (!it || !safeUrl(it.url) || it.full || String(it.text || '').length >= 1600) return;
        jobs.push(fetchPageText(it.url).then(function(t){
          if (t && t.length >= 120){ it.text = t.slice(0, 3500); it.full = 1; }
        }));
      })(list[i]);
    }
    return jobs.length ? Promise.all(jobs).then(function(){ return list; }) : Promise.resolve(list);
  }

  /* POST/GET JSON 双通道：桥/fetch，超时或非 2xx 返回 null */
  function httpJSON(req, ms){
    ms = ms || 15000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 's' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 1000000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (status && (status < 200 || status >= 300)) return resolve(null);
            try { resolve(req.parse(JSON.parse(acc))); } catch (e) { resolve(null); }
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, direct: isDirectHost(req.url), url: req.url, method: req.method || 'POST', headers: req.headers, body: req.body });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    var mth = req.method || 'POST';
    return fetch(req.url, { method: mth, headers: req.headers, body: mth === 'GET' ? undefined : req.body, signal: ac.signal })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.json(); })
      .then(function(j){ clearTimeout(t); try { return j ? req.parse(j) : null; } catch (e) { return null; } })
      .catch(function(){ clearTimeout(t); return null; });
  }
  /* 各源响应解析（命名函数，便于单测抓取） */
  function parseSerper(j){
    return (j.organic || []).map(function(r){ return { title: r.title, url: r.link, text: r.snippet }; });
  }
  function parseSerpApi(j){
    return (j.organic_results || []).map(function(r){ return { title: r.title, url: r.link, text: r.snippet }; });
  }
  function parseBrave(j){
    return ((j.web && j.web.results) || []).map(function(r){ return { title: r.title, url: r.url, text: r.description }; });
  }
  function parseTavily(j){
    return (j.results || []).map(function(r){ return { title: r.title, url: r.url, text: (r.content || '').slice(0, 1500) }; });
  }
  function parseFirecrawl(j){
    return (j.data || []).map(function(r){
      return { title: (r.metadata && r.metadata.title) || '', url: (r.metadata && r.metadata.sourceURL) || '', text: (r.markdown || '').slice(0, 2000) };
    });
  }
  function parseBocha(j){
    var wp = (j && (j.webPages || (j.data && j.data.webPages))) || {};
    return (wp.value || []).map(function(r){ return { title: r.name, url: r.url, text: (r.summary || r.snippet || '').slice(0, 2000) }; });
  }
  function parseJina(j){
    return (j.data || []).map(function(r){ return { title: r.title, url: r.url, text: (r.content || r.description || '').slice(0, 2000) }; });
  }
  function parseExa(j){
    return (j.results || []).map(function(r){ return { title: r.title, url: r.url, text: (r.text || '').slice(0, 2000) }; });
  }
  /* v0.4.9：新增四家（Perplexity / 百度千帆 / You.com / Google Grounding） */
  function parsePerplexity(j){
    return (j.results || j.data || []).map(function(r){
      return { title: r.title || '', url: r.url || r.link || '', text: String(r.snippet || r.text || r.description || '').slice(0, 2000) };
    });
  }
  function parseBaidu(j){
    var arr = j.references || (j.data && j.data.references) || (j.data && j.data.results) || j.results || [];
    return arr.map(function(r){
      return { title: r.title || r.name || '', url: r.url || r.link || '', text: String(r.content || r.snippet || r.summary || '').slice(0, 2000) };
    });
  }
  function parseYou(j){
    var w = (j.results && (j.results.web || j.results.news)) || j.results || j.hits || [];
    if (!Array.isArray(w)) w = [];
    return w.map(function(r){
      var sn = r.snippets || r.snippet || r.description || '';
      if (Array.isArray(sn)) sn = sn.join(' ');
      return { title: r.title || '', url: r.url || '', text: String(sn).slice(0, 2000) };
    });
  }
  /* Google 的 Grounding 不是 SERP API：它是"带引用的回答"，这里转成一条 full 结果 */
  function parseGoogleGround(j){
    var cand = (j.candidates || [])[0] || {};
    var txt = ((cand.content && cand.content.parts) || []).map(function(p){ return p.text || ''; }).join('');
    var gm = cand.groundingMetadata || {};
    var chunks = gm.groundingChunks || [];
    var url = (chunks[0] && chunks[0].web && chunks[0].web.uri) || 'https://www.google.com/';
    var cites = chunks.map(function(c){
      return (c.web && c.web.uri) ? ('- ' + (c.web.title || '') + ' ' + c.web.uri) : '';
    }).filter(Boolean).join('\n');
    if (!txt) return [];
    return [{ title: 'Google 联网回答', url: url, text: (txt + (cites ? '\n\n来源：\n' + cites : '')).slice(0, 3000), full: true }];
  }


  /* v0.4.7：搜索缓存 + URL 归一化去重 + SearXNG/自定义解析 */
  var SEARCH_CACHE = {}, SEARCH_TTL = 10 * 60 * 1000;
  function dedupeKey(u){
    return String(u).toLowerCase()
      .replace(/^https?:\/\//, '')
      .replace(/[?#].*$/, '')
      .replace(/\/+$/, '');
  }
  function parseSearx(j){
    return ((j && j.results) || []).map(function(r){
      return { title: r.title, url: r.url, text: (r.content || r.snippet || '').slice(0, 2000) };
    });
  }
  function pickPath(o, path){
    if (!path) return o;
    var segs = String(path).replace(/^\$?\.?/, '').split(/[.\[\]]+/).filter(Boolean);
    var v = o;
    for (var i = 0; i < segs.length && v != null; i++) v = v[segs[i]];
    return v;
  }
  function parseCustom(j, c){
    var arr = pickPath(j, c.path || '');
    if (!Array.isArray(arr)) return [];
    return arr.map(function(r){
      return {
        title: String(pickPath(r, c.fTitle || 'title') || ''),
        url: String(pickPath(r, c.fUrl || 'url') || ''),
        text: String(pickPath(r, c.fText || 'snippet') || '').slice(0, 2000)
      };
    });
  }
  /* 检索：地址校验 + URL 去重 + 本地缓存 */
  function runProviders(query, num){
    var prov = (S.cfg.searchProvider || 'none').toLowerCase();
    var key = S.cfg.searchKey || '';
    var noKey = (prov === 'searxng' || prov === 'custom');
    if (prov === 'none' || (!key && !noKey)) return Promise.resolve(null);
    var ck = prov + '|' + String(query || '').toLowerCase().replace(/\s+/g, ' ').trim();
    var hit = SEARCH_CACHE[ck];
    if (hit && Date.now() - hit.ts < SEARCH_TTL) return Promise.resolve(hit.list);
    var req = null;
    if (prov === 'serper'){
      req = {
        url: 'https://google.serper.dev/search',
        headers: { 'X-API-KEY': key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: query, num: num }),
        parse: parseSerper
      };
    } else if (prov === 'serpapi'){
      req = {
        method: 'GET',
        url: 'https://serpapi.com/search.json?engine=google&q=' + encodeURIComponent(query) + '&num=' + clamp(num, 1, 100) + '&api_key=' + encodeURIComponent(key),
        headers: { 'Accept': 'application/json' },
        parse: parseSerpApi
      };
    } else if (prov === 'brave'){
      req = {
        method: 'GET',
        url: 'https://api.search.brave.com/res/v1/web/search?q=' + encodeURIComponent(query) + '&count=' + clamp(num, 1, 20),
        headers: { 'X-Subscription-Token': key, 'Accept': 'application/json' },
        parse: parseBrave
      };
    } else if (prov === 'tavily'){
      req = {
        url: 'https://api.tavily.com/search',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: key, query: query, max_results: num }),
        parse: parseTavily
      };
    } else if (prov === 'firecrawl'){
      req = {
        url: 'https://api.firecrawl.dev/v1/search',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, limit: num, scrapeOptions: { formats: ['markdown'] } }),
        parse: parseFirecrawl
      };
    } else if (prov === 'bocha'){
      req = {
        url: 'https://api.bochaai.com/v1/web-search',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, count: num, freshness: 'noLimit', summary: true }),
        parse: parseBocha
      };
    } else if (prov === 'jina'){
      req = {
        url: 'https://s.jina.ai/',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ q: query, num: num }),
        parse: parseJina
      };
    } else if (prov === 'searxng'){
      var sb = String(S.cfg.searchBase || '').replace(/\/+$/, '');
      if (!sb) return Promise.resolve(null);
      req = { method: 'GET',
        url: sb + '/search?q=' + encodeURIComponent(query) + '&format=json',
        headers: { 'Accept': 'application/json' },
        parse: parseSearx };
    } else if (prov === 'custom'){
      var cc = S.cfg.searchCustom || {};
      if (!cc.url) return Promise.resolve(null);
      var curl = String(cc.url).replace(/\{q\}/g, encodeURIComponent(query)).replace(/\{n\}/g, String(num));
      req = { method: String(cc.method || 'GET').toUpperCase(), url: curl, headers: cc.headers || {},
        parse: function(j){ return parseCustom(j, cc); } };
    } else if (prov === 'perplexity'){
      req = { url: 'https://api.perplexity.ai/search',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, max_results: num }),
        parse: parsePerplexity };
    } else if (prov === 'baidu'){
      req = { url: 'https://qianfan.baidubce.com/v2/ai_search/web_search',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: query }], search_source: 'baidu_search_v2',
          resource_type_filter: [{ type: 'web', top_k: num }] }),
        parse: parseBaidu };
    } else if (prov === 'you'){
      req = { method: 'GET',
        url: 'https://ydc-index.io/v1/search?query=' + encodeURIComponent(query) + '&count=' + num,
        headers: { 'X-API-Key': key, 'Accept': 'application/json' },
        parse: parseYou };
    } else if (prov === 'google'){
      /* Gemini 的 Grounding with Google Search：一次调用直接拿"带引用的回答" */
      var gm2 = S.cfg.searchModel || 'gemini-2.0-flash';
      req = { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(gm2) +
          ':generateContent?key=' + encodeURIComponent(key),
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: query }] }], tools: [{ google_search: {} }] }),
        parse: parseGoogleGround };
    } else if (prov === 'bing'){
      return Promise.resolve(null);   // Azure AI Agents 专属，当前未接入
    } else if (prov === 'exa'){
      req = {
        url: 'https://api.exa.ai/search',
        headers: { 'x-api-key': key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, numResults: num, type: 'auto', contents: { text: { maxCharacters: 2000 } } }),
        parse: parseExa
      };
    } else return Promise.resolve(null);
    return httpJSON(req, 15000).then(function(list){
      if (!list || !list.length) return null;
      var seen = {}, out = [];
      for (var i = 0; i < list.length; i++){
        var it = list[i]; if (!it) continue;
        var u = safeUrl(it.url);
        if (!u) continue;                       // 非 http/https 直接丢弃
        var dk = dedupeKey(u);                  // 去 utm/尾斜杠/协议差异后判重
        if (seen[dk]) continue;
        seen[dk] = 1; it.url = u; it.source = prov; out.push(it);
      }
      if (!out.length) return null;
      SEARCH_CACHE[ck] = { ts: Date.now(), list: out };
      var ks = Object.keys(SEARCH_CACHE);
      if (ks.length > 80) for (var d = 0; d < ks.length - 80; d++) delete SEARCH_CACHE[ks[d]];
      return out;
    });
  }

  /* 结构化注入格式（档②）：编号 + 引用要求 + 正文/摘要标注，总量 16384 字符 */
  function fmtBlock(list, query){
    if (!list || !list.length) return null;
    function pad(x){ return x < 10 ? '0' + x : '' + x; }
    var ts = new Date();
    var stamp = ts.getFullYear() + '-' + pad(ts.getMonth() + 1) + '-' + pad(ts.getDate()) + ' ' + pad(ts.getHours()) + ':' + pad(ts.getMinutes());
    var entries = [], total = 0;
    for (var i = 0; i < list.length && total < 16384; i++){
      var body = String((list[i] && list[i].text) || '').slice(0, 3500);
      if (!body) continue;
      total += body.length;
      entries.push({ title: ((list[i].title || '').trim()) || '（无标题）', url: list[i].url || '', body: body, full: !!list[i].full });
    }

function walkEntry(ent, path, out){
  return new Promise(function(res){
    if (ent.isFile){ ent.file(function(f){ if (f){ f._rel = path + ent.name; out.push(f); } res(); }, function(){ res(); }); return; }
    if (ent.isDirectory){
      var rd = ent.createReader(), all = [];
      (function more(){
        rd.readEntries(function(es){
          if (!es.length){
            var ch = Promise.resolve();
            all.forEach(function(x){ ch = ch.then(function(){ return walkEntry(x, path + ent.name + '/', out); }); });
            ch.then(function(){ res(); }); return;
          }
          all = all.concat(Array.prototype.slice.call(es)); more();
        }, function(){ res(); });
      })();
      return;
    }
    res();
  });
}
function collectDrop(dt){
  var items = dt && dt.items ? Array.prototype.slice.call(dt.items) : [];
  var ents = items.map(function(it){ try { return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; } catch(e){ return null; } }).filter(Boolean);
  if (!ents.length) return Promise.resolve(Array.prototype.slice.call((dt && dt.files) || []));
  var out = [], ch = Promise.resolve();
  ents.forEach(function(en){ ch = ch.then(function(){ return walkEntry(en, '', out); }); });
  return ch.then(function(){ return out; });
}

  /* 回读文本附件（重试/重发）——v1.1.20：解析后的文档文本直接从附件记录取，

      if (!m) return res(null);
      if (m.fileTexts && m.fileTexts.length) return res(m.fileTexts);
      if (!m.attachments || !m.attachments.length) return res(null);
      var out = [], pending = m.attachments.length;
      function done(){ if (--pending === 0) res(out.length ? out : null); }
      m.attachments.forEach(function(aid){

          if (!a) return done();
          if (a.text){ out.push({ id: a.id, name: a.name, text: a.text }); return done(); }
          var ext = extOf(a.name);

  /* v1.1.21：附件自动进入工作区（Work=VFS，Agent=真实工作区），并生成可读文本/清单 */

    else if (kind === 'doc') body += '- 说明：文档未提取到文本；原文件已保存在工作区（同名文件）。\n';

  /* 上下文估算（v2.9 重做 / v3.0 修正口径）
     口径 = 缓存命中 + 未缓存历史 + 本次输入 + 本次输出。
     注意「本次输出」是**已经发生的**：上一轮回复真实生成的 completion token，
     不再按 max_tokens 预占一个「预计输出」（那既会重复计数，又会在空草稿时凭空多出几千）。 */
  function ctxEst(){
    var fam = NET.estimate.family(S.cfg.currentModel);
    var u = lastUsage(S.msgs);
    var sys = (curSession() && curSession().systemPrompt) || S.cfg.systemPrompt || '';
    var sysT = Math.ceil(NET.estimate.text(sys, fam));
    var histT, cache = 0, outT = 0, src = 'estimate';
    if (u && u.p > 0){
      /* 真实口径：prompt（缓存+未缓存）与 completion 分开报，不再拿「预计输出」凑数 */
      histT = u.p;                        /* 上一轮请求的 prompt = 系统提示 + 全部历史 */
      outT = u.c || 0;                    /* 上一轮回复真实生成的 token（已发生） */
      cache = Math.min(u.h || 0, histT);
      src = 'actual';
    } else {
      var t = 0, n = 0, chars = 0;
      for (var i = S.msgs.length - 1; i >= 0 && n < LIMITS.CTX_MSGS; i--){
        var m = S.msgs[i], len = String(m.content || '').length;
        if (chars + len > LIMITS.CTX_CHARS && n) break;
        t += 4 + NET.estimate.text(m.content, fam); chars += len; n++;
      }
      histT = Math.ceil(sysT + t);
    }
    var inp = ($input && $input.value) || '';
    var inpT = (inp ? 4 : 0) + NET.estimate.text(inp, fam);
    var imgN = 0, attT = 0;
    for (var k = 0; k < S.pendAtts.length; k++){
      var a = S.pendAtts[k];
      if (a.isText) attT += NET.estimate.text(a.text || '', fam);
      else { imgN++; attT += NET.estimate.image(a.w, a.h); }
    }
    var used = histT + inpT + attT + outT;
    return { tok: Math.ceil(used), sys: sysT, hist: histT, cache: Math.ceil(cache),
      uncached: Math.ceil(Math.max(0, histT - cache)),
      inp: Math.ceil(inpT), att: Math.ceil(attT), imgN: imgN,
      out: Math.ceil(outT), src: src, nMsgs: u ? 0 : undefined };
  }

  /* ---------- #19 命令面板 ---------- */
  var PAL = (function(){
    var box = null, inp = null, list = null, items = [], sel = 0, shown = false;
    function score(q, t){
      t = String(t || '').toLowerCase();

      if (t.indexOf(q) === 0) return 1000 - t.length;
      var k = t.indexOf(q);
      if (k > 0) return 500 - k;
      var i = 0, s = 0;                       /* 子序列匹配 */
      for (var j = 0; j < q.length; j++){
        while (i < t.length && t[i] !== q[j]) i++;

        s += 10 - Math.min(9, i - j); i++;

    }
    function source(){

      if (S.msgs.length) arr.push({ pin: '动作', t: '导出完整备份（JSON）', k: '', run: function(){ doExport(); } /* v0.3.62：少的不是功能，是诚实——要 Markdown 用 /export */ });

      arr.push({ pin: '动作', t: S.tempMode ? '关闭临时会话' : '开启临时会话', k: '', run: function(){ toggleTemp(); } });
      arr.push({ pin: '动作', t: '切换深浅色', k: '', run: function(){
        setCfg({ theme: resolvedTheme() === 'dark' ? 'light' : 'dark' }); applyTheme(); } });

        var s = S.sessions[i]; if (s.temp) continue;
        arr.push({ pin: '会话', t: s.title || '未命名会话', k: s.workspace ? '工作区' : '', run: (function(sid){

      }
      for (var j = 0; j < (S.cfg.models || []).length; j++){
        var mid = S.cfg.models[j];
        arr.push({ pin: '模型', t: mid, k: mid === S.cfg.currentModel ? '当前' : '', run: (function(m){
          return function(){ setCfg({ currentModel: m }); mmUse(m); toast('已切换模型：' + m); };
        })(mid) });
      }
      for (var p = 0; p < (S.cfg.prompts || []).length; p++){
        var pr = S.cfg.prompts[p];
        arr.push({ pin: '提示词', t: pr.name, k: '', run: (function(txt){
          return function(){ $input.value = txt; autosize(); $input.focus(); };
        })(pr.text) });

      for (var g = 0; g < groups.length; g++)
        arr.push({ pin: '设置', t: groups[g], k: '', run: (function(gname){
          return function(){ openSettings(); setTimeout(function(){ setGroup(gname); }, 60); };
        })(groups[g]) });

    }
    function render(q){
      list.textContent = '';
      var all = items, scored = [];
      for (var i = 0; i < all.length; i++){
        var sc = Math.max(score(q, all[i].t), score(q, all[i].pin) - 400, 0);
        if (q && !sc) continue;
        scored.push({ it: all[i], sc: sc });
      }
      scored.sort(function(a, b){ return b.sc - a.sc; });
      scored = scored.slice(0, 40);
      items._view = scored.map(function(x){ return x.it; });
      if (!scored.length){ list.appendChild(el('div', { class: 'pal-empty', text: '没有匹配项' })); return; }
      sel = Math.min(sel, scored.length - 1);

        var it = scored[k].it;

    var _lastFire = 0;

    }
    return { open: open, close: close, isOpen: isOpen, key: key };
  })();

  /* ---------- #23 会话内搜索 ---------- */
  var FIND = (function(){
    var bar, inp, cnt, hits = [], idx = -1, on = false;
    function ensure(){
      if (bar) return;
      inp = el('input', { placeholder: '在会话内查找…', spellcheck: 'false' });
      cnt = el('span', { class: 'cnt', text: '' });
      bar = el('div', { id: 'find-bar' }, [
        inp, cnt,
        el('button', { class: 'btn btn-sec', 'data-f': 'prev', text: '↑' }),
        el('button', { class: 'btn btn-sec', 'data-f': 'next', text: '↓' }),
        el('button', { class: 'btn btn-sec', 'data-f': 'close', text: '✕' })
      ]);
      var sc = $('#msg-scroll');
      sc.parentNode.insertBefore(bar, sc);
      inp.addEventListener('input', function(){ scan(inp.value); });
      bar.addEventListener('click', function(e){
        var b = e.target.closest('[data-f]'); if (!b) return;
        var a = b.getAttribute('data-f');
        if (a === 'close') return close();
        step(a === 'next' ? 1 : -1);
      });
    }
    function clearMarks(){
      var ms = document.querySelectorAll('#msg-list mark.hit');
      for (var i = 0; i < ms.length; i++){
        var m = ms[i], p = m.parentNode;
        p.replaceChild(document.createTextNode(m.textContent), m);
        p.normalize();
      }
      hits = []; idx = -1;
    }
    function scan(q){
      clearMarks();
      if (!q){ cnt.textContent = ''; return; }
      var root = $('#msg-list'), walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var nodes = [], t;
      while ((t = walker.nextNode())) if (t.nodeValue && t.nodeValue.trim()) nodes.push(t);
      var lq = q.toLowerCase();
      for (var i = 0; i < nodes.length; i++){
        var node = nodes[i], txt = node.nodeValue, low = txt.toLowerCase(), from = 0;
        while (true){
          var k = low.indexOf(lq, from);
          if (k < 0) break;
          var r = document.createRange();
          r.setStart(node, k); r.setEnd(node, k + q.length);
          var mk = el('mark', { class: 'hit', text: txt.slice(k, k + q.length) });
          try { r.deleteContents(); r.insertNode(mk); } catch (e) { break; }
          hits.push(mk);
          node = mk.nextSibling;                         /* 继续在剩下的文本节点里找 */
          if (!node || node.nodeType !== 3) break;
          txt = node.nodeValue; low = txt.toLowerCase(); from = 0;
        }
      }
      cnt.textContent = hits.length ? '0/' + hits.length : '无结果';
      idx = -1;
      if (hits.length) step(1);
    }
    function step(d){
      if (!hits.length) return;
      if (idx >= 0 && hits[idx]) hits[idx].classList.remove('cur');
      idx = (idx + d + hits.length) % hits.length;
      var h = hits[idx];
      if (!h) return;
      h.classList.add('cur');
      try { h.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { h.scrollIntoView(); }
      cnt.textContent = (idx + 1) + '/' + hits.length;
    }
    function open(){ ensure(); bar.classList.add('show'); on = true; inp.focus(); inp.select(); }
    function close(){ if (!bar) return; clearMarks(); bar.classList.remove('show'); on = false; }
    function isOpen(){ return on; }
    function key(e){
      if (e.key === 'Escape' && on){ close(); return true; }
      if (e.key === 'F3' && on){ step(1); return true; }
      return false;
    }
    return { open: open, close: close, isOpen: isOpen, key: key, rescan: function(){ if (on) scan(inp.value); } };
  })();

  function storagePanel(){
    var box = el('div', {}, [el('h2', { text: '存储用量' })]);

    box.appendChild(el('div', { class: 'f-actions' }, [
      el('button', { class: 'btn btn-danger', 'data-m': 'purge-orphan', text: '清理孤立附件' }),

      el('button', { class: 'btn btn-sec', 'data-m': 'close', text: '关闭' })
    ]));
    openModal(box);
    render();
    function kb(n){ return (n / 1024 / 1024).toFixed(2) + ' MB'; }
    function render(){
      body.textContent = '';
      Promise.all([DB.allSessions(), DB.allAttachments(), DB.allWorkfs()]).then(function(r){
        var ses = r[0] || [], atts = r[1] || [], wfs = r[2] || [];
        var ids = {}; ses.forEach(function(s){ ids[s.id] = 1; });
        var aBytes = 0, orphan = [];
        atts.forEach(function(a){
          var sz = (a.blob && a.blob.size) || a.size || (a.text ? a.text.length : 0);
          aBytes += sz;
          if (a.sid && !ids[a.sid]) orphan.push(a.id);
        });
        var wBytes = 0;
        wfs.forEach(function(w){ wBytes += (w.content || '').length + (w.path || '').length; });
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '会话' }), el('b', { text: String(ses.length) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '附件' }), el('b', { text: atts.length + ' 个 · ' + kb(aBytes) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '虚拟工作区文件' }), el('b', { text: wfs.length + ' 个 · ' + kb(wBytes) })]));
        body.appendChild(el('div', { class: 'kv' }, [el('span', { text: '孤立附件' }), el('b', { text: orphan.length + ' 个' })]));
        S._orphan = orphan;
        /* v3.0 #3：按会话排出占用前 20，长会话可压缩（只留最近 30 条 + 一条摘要占位） */
        var top = ses.slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 20);
        var attBySid = {};
        atts.forEach(function(a){
          var sz = (a.blob && a.blob.size) || a.size || (a.text ? a.text.length : 0);
          if (a.sid) attBySid[a.sid] = (attBySid[a.sid] || 0) + sz;
        });
        Promise.all(top.map(function(s){ return DB.msgsBySid(s.id); })).then(function(lists){
          var rows = [];
          for (var i = 0; i < top.length; i++){
            var ms = lists[i] || [], bytes = attBySid[top[i].id] || 0;
            for (var j = 0; j < ms.length; j++) bytes += (ms[j].content || '').length;
            rows.push({ s: top[i], n: ms.length, b: bytes });
          }
          rows.sort(function(a, b){ return b.b - a.b; });
          if (!rows.length) return;
          body.appendChild(el('div', { class: 'sub', style: 'margin-top:12px', text: '占用最大的会话（前 20）' }));
          rows.forEach(function(r){
            body.appendChild(el('div', { class: 'sc-row' }, [
              el('span', { class: 't', text: r.s.title || '未命名会话', title: r.s.title || '' }),
              el('span', { class: 'hint', text: r.n + ' 条 · ' + (r.b / 1024).toFixed(0) + ' KB' }),
              r.n > 40 ? el('button', { class: 'btn btn-ghost rn-mini', 'data-m': 'compress', 'data-id': r.s.id, text: '压缩' }) : ''
            ]));
          });
        });
        if (navigator.storage && navigator.storage.estimate)
          navigator.storage.estimate().then(function(est){
            var pct = est.quota ? est.usage / est.quota : 0;
            body.appendChild(el('div', { class: 'kv', style: 'margin-top:8px' }, [
              el('span', { text: '浏览器分配空间' }), el('b', { text: kb(est.usage || 0) + ' / ' + kb(est.quota || 0) })
            ]));
            var bar = el('div', { class: 'bar' }, [el('i', { style: 'width:' + Math.max(1, Math.round(pct * 100)) + '%' })]);
            body.appendChild(bar);
          });
      });
    }
    S._refreshStorage = render;
  }
  /* v3.0 #3：压缩单个长会话——保留最近 30 条，早前消息合并成一条摘要占位（不可逆，需二次确认） */
  function compressSession(sid){
    DB.msgsBySid(sid).then(function(ms){
      ms.sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
      var keep = 30, dropN = ms.length - keep;
      if (dropN <= 10) return toast('消息不多，无需压缩');
      var drop = ms.slice(0, dropN);
      return confirmBox({
        title: '压缩会话',
        text: '将删除该会话最早的 ' + dropN + ' 条消息，保留最近 ' + keep + ' 条，并插入一条摘要占位。此操作不可撤销，确定继续？',
        okText: '压缩'
      }).then(function(ok){
        if (!ok) return;
        var head = (drop[0].content || '').replace(/\s+/g, ' ').slice(0, 40);
        var tail = (drop[drop.length - 1].content || '').replace(/\s+/g, ' ').slice(0, 40);
        var chain = Promise.resolve();
        drop.forEach(function(m){ chain = chain.then(function(){ return DB.delMessage(m.id); }); });
        chain = chain.then(function(){
          return DB.putMessage({
            id: uuid(), sid: sid, role: 'system', status: 'ok', ts: (drop[0].ts || Date.now()),
            content: '（已压缩 ' + dropN + ' 条早期消息：' + head + ' … ' + tail + '）', attachments: []
          });
        }).then(function(){
          return DB.msgsBySid(sid);
        }).then(function(now){
          var s = (S.sessions || []).filter(function(x){ return x.id === sid; })[0];
          if (s){ s.msgCount = now.length; DB.putSession(s); }
          toast('已压缩 ' + dropN + ' 条早期消息');
          if (sid === S.sid) renderMsgs();
          if (S._refreshStorage) S._refreshStorage();
        });
        return chain;
      });
    });
  }
  function purgeOrphans(){

  /* ---------- #4 配置快照 ---------- */
  function exportSnapshot(){
    var c = {}, skip = /(apiKey|token|secret|password)/i;
    /* v0.3.0：先深拷贝再剥离，否则 scrub 删的是活动配置里的密钥 */
    try { c = JSON.parse(JSON.stringify(S.cfg)); } catch (e) { c = {}; }
    for (var k0 in c) if (skip.test(k0)) delete c[k0];
    /* presets 里也有 apiKey：深拷贝时递归剥离，避免密钥进快照文件 */
    (function scrub(v){
      if (!v || typeof v !== 'object') return v;
      for (var kk in v){
        if (skip.test(kk)) delete v[kk];
        else if (v[kk] && typeof v[kk] === 'object') scrub(v[kk]);
      }
      return v;
    })(c);
    var o = { app: 'SoloChat', v: 1, ts: Date.now(), cfg: c };
    download('solochat-快照-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(o, null, 2), 'application/json');
    toast('已导出配置快照（不含密钥）');
  }

    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  function route(text){
    var t = String(text || '');
    for (var i = 0; i < RULES.length; i++) if (RULES[i][1].test(t)) return RULES[i][0];
    /* v1.28.1：句子里带网址、或明说要打开/访问，就别落到 Chat —— Chat 没有工具，模型只能空口答应 */
    if (/https?:\/\//i.test(t) || /(打开|访问|展开|浏览器|browser)/i.test(t)) return 'work';
    return 'chat';
  }
  function promptFor(){
    var p = persona(S.cfg.persona);
    if (!p) return '';
    return '模式配方「' + (p.name || p.id) + '」：' + (p.prompt || '');
  }
  function mountUI(){
    var seg = document.getElementById('seg-mode');
    if (!seg) return; // v1.13：模式条已换成顶栏的「切换按钮 + 当前模式名」
    var old = seg.querySelectorAll('[data-persona]');
    for (var i = 0; i < old.length; i++) old[i].remove();
    personas().forEach(function(p){
      var b = el('button', { type: 'button', 'data-persona': p.id, title: '自定义模式：' + (p.prompt || '').slice(0, 60) });
      b.textContent = p.name || p.id;
      if (S.cfg.persona === p.id) b.classList.add('on');
      seg.appendChild(b);
    });
  }
  return { personas: personas, persona: persona, route: route, promptFor: promptFor, mountUI: mountUI,
           SUBS: SUBS, subList: subList, sub: sub, setSub: setSub, subPrompt: subPrompt, denied: denied,
           texts: { chat: CHAT_NO_TOOLS_P, work: WORK_P, agent: AGENT_P, research: RESEARCH_P, agentWrite: AGENT_W_P, agentRead: AGENT_READ_P },
  /* v1.28：系统提示词各段可改写（存 cfg.sysEdits），空字符串也算「改过」 */
  edited: function(key){ var o = S.cfg.sysEdits || {}; return Object.prototype.hasOwnProperty.call(o, key); },
  text: function(key){ var o = S.cfg.sysEdits || {}; if (Object.prototype.hasOwnProperty.call(o, key)) return o[key] || ''; return MODE.texts[key] || ''; },
           /* v1.28.1：某个工具在当前模式是否可用（渲染时给「不会执行」的围栏打标） */
    toolAllowed: function(op){
      /* v0.4.1：Chat 里用户勾了工具，围栏就真的会执行，不再标「本轮不执行」 */
      if (S.cfg.mode === 'chat' && typeof PICK !== 'undefined' && PICK.restrict())
        return PICK.resolve().tools.indexOf(op) >= 0;
      var list = (typeof EXT !== 'undefined' && EXT.BUILTIN) ? EXT.BUILTIN : [];
      for (var i = 0; i < list.length; i++) if (list[i].id === op) return (list[i].modes || []).indexOf(S.cfg.mode) >= 0;
      return true;
    },
    efforts: efforts };
})();

/* v1.17：记忆 —— 工作记忆（每会话一张任务卡）+ 情景记忆（历史任务卡，词法检索）
   不引入向量库：中文按二元组切词，拉丁按词切，做重叠打分；够用且零依赖。 */
var MEM = (function(){
  var MAXN = 300;
  function toks(t){
    t = String(t || '').toLowerCase();
    var out = (t.match(/[a-z0-9_.\-]{2,}/g) || []).slice(0, 80);
    var hz = t.match(/[\u4e00-\u9fa5]+/g) || [];
    for (var i = 0; i < hz.length && out.length < 200; i++){
      var x = hz[i];
      if (x.length === 1){ out.push(x); continue; }
      for (var j = 0; j < x.length - 1 && out.length < 200; j++) out.push(x.slice(j, j + 2));
    }
    return out;
  }
  function uniq(a){ var m = {}, o = []; for (var i = 0; i < a.length; i++) if (!m[a[i]]){ m[a[i]] = 1; o.push(a[i]); } return o; }
  function score(qt, card){
    if (!card._t) card._t = uniq(toks((card.goal || '') + ' ' + (card.lesson || '') + ' ' + (card.artifacts || []).join(' ')));
    var set = {}, n = card._t.length;
    for (var i = 0; i < n; i++) set[card._t[i]] = 1;
    var hit = 0;
    for (var j = 0; j < qt.length; j++) if (set[qt[j]]) hit++;
    return n ? hit / Math.sqrt(n) : 0;
  }
  function lastUser(msgs){
    for (var i = (msgs || []).length - 1; i >= 0; i--)
      if (msgs[i].role === 'user') return String(msgs[i].content || '').trim();
    return '';
  }
  /* 写入：工作记忆 + （有工具动作时）情景卡 */
  function note(sid, msgs, status){
    if (!sid || S.cfg.memory === false) return Promise.resolve();
    var goal = lastUser(msgs).slice(0, 160);
    if (!goal) return Promise.resolve();
    return DB.workfsBySid(sid).then(function(files){
      var arts = (files || []).map(function(f){ return f.path; }).slice(0, 12);
      var card = { sid: sid, goal: goal, artifacts: arts, ts: Date.now(), status: status || 'ok' };
      return DB.taskPut(card).then(function(){
        if (!arts.length) return;
        return DB.memAll().then(function(all){
          var dup = null;
          for (var i = 0; i < (all || []).length; i++)
            if (all[i].sid === sid && all[i].goal === goal) dup = all[i];
          var rec = dup || { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
          rec.sid = sid; rec.goal = goal; rec.artifacts = arts; rec.ts = Date.now(); rec.status = status || 'ok';
          rec.lesson = rec.lesson || '';
          return DB.memPut(rec);
        });
      });
    }).then(function(){
      return promptFor(sid, msgs);
    }).then(function(blk){
      S._mem = S._mem || {}; S._mem[sid] = blk || '';
    }).catch(function(){});
  }
  /* 打开会话时预热一次 */
  function warm(sid, msgs){
    if (!sid || S.cfg.memory === false) return Promise.resolve('');
    return promptFor(sid, msgs).then(function(blk){ S._mem = S._mem || {}; S._mem[sid] = blk || ''; return blk; }).catch(function(){ return ''; });
  }
  /* 注入：当前任务卡 + 相似历史（不含本会话） */
  function promptFor(sid, msgs){
  /* v1.29.7：只注入本会话目标（会话内记忆）；不再检索其它会话的卡片 */
  if (S.cfg.memory === false) return Promise.resolve('');
  var q = lastUser(msgs).slice(0, 400);
  if (!q) return Promise.resolve('');
  return DB.taskGet(sid).then(function(t){
    if (!t || !t.goal) return '';
    return '【记忆】\n本会话目标：' + t.goal +
      (t.artifacts && t.artifacts.length ? '；已有产物：' + t.artifacts.join('、') : '');
  }).catch(function(){ return ''; });
}
function search(q){
    return DB.memAll().then(function(all){
      var qt = uniq(toks(q));
      var arr = (all || []).slice();
      if (!qt.length) return arr.sort(function(a, b){ return b.ts - a.ts; });
      arr = arr.map(function(c){ return { c: c, s: score(qt, c) }; }).filter(function(x){ return x.s > 0; });
      arr.sort(function(a, b){ return b.s - a.s; });
      return arr.map(function(x){ return x.c; });
    });
  }
  function all(){ return DB.memAll(); }
  function del(id){ return DB.memDel(id); }
  function clear(){ return DB.memClear(); }
  return { note: note, warm: warm, promptFor: promptFor, search: search, all: all, del: del, clear: clear };
})();

/* v1.17：编排 —— 多智能体流水线 / 辩论 / 工作流（DAG + 自检回边） */
var ORCH = (function(){
  function cut(t, n){ t = String(t || ''); return t.length > n ? t.slice(0, n) + '…' : t; }
  function modal(title, sub){
    var logEl = el('div', { class: 'orch-log' });
    var acts = el('div', { class: 'f-actions', style: 'justify-content:flex-end;margin-top:12px' });
    var box = el('div', { style: 'padding:18px 20px;min-width:min(720px,92vw)' }, [
      el('h2', { text: title }), el('div', { class: 'sub', text: sub }), logEl, acts
    ]);
    UI.openModal(box, false);
    return {
      log: function(t, kind){
        var d = el('div', { class: 'orch-line' + (kind ? ' ' + kind : ''), text: t });
        logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
      },
      acts: acts, close: function(){ UI.closeModal(); }
    };
  }
  function ask(title, sub, ph, cb){
    var ta = el('textarea', { class: 'f-in', rows: '4', placeholder: ph || '' });
    ta.style.width = '100%';
    var ok = el('button', { class: 'btn btn-primary', text: '开始' });
    var no = el('button', { class: 'btn btn-sec', text: '取消' });
    var box = el('div', { style: 'padding:18px 20px;min-width:min(560px,92vw)' }, [
      el('h2', { text: title }), el('div', { class: 'sub', text: sub }), ta,
      el('div', { class: 'f-actions', style: 'justify-content:flex-end;margin-top:12px' }, [no, ok])
    ]);
    UI.openModal(box, false);
    no.addEventListener('click', function(){ UI.closeModal(); });
    ok.addEventListener('click', function(){
      var v = ta.value.trim();
      if (!v){ UI.toast('先写点什么', true); return; }
      UI.closeModal(); cb(v);
    });
    setTimeout(function(){ try { ta.focus(); } catch(e){} }, 50);
  }
  /* 没有会话就先建一个（编排要落库/落盘，必须有 sid） */
  function ensureSid(title){
    if (S.sid && curSession()) return S.sid;
    var id = uuid(), now = Date.now();
    var s = { id: id, title: title || '编排', createdAt: now, updatedAt: now, pinned: false,
      model: S.cfg.currentModel || '', systemPrompt: '', params: {}, workspace: '', msgCount: 0, temp: false };
    S.sessions.unshift(s);
    S.sid = id; S.msgs = [];
    try { DB.putSession(s); } catch(e){}
    try { renderSessions(); } catch(e){}
    try { var t = document.getElementById('tb-title'); if (t) t.textContent = s.title; } catch(e){}
    return id;
  }
  function addToInput(txt){
    var box = document.getElementById('input');
    if (!box) return;
    box.value = (box.value ? box.value + '\n\n' : '') + txt;
    box.dispatchEvent(new Event('input', { bubbles: true }));
    box.focus();
  }

  /* ---------- 1. 流水线：方案 → 执行 → 验证 → 交付 ---------- */
  var HINT = {
    plan: '只做设计：文件清单、每个文件的职责与关键接口/数据形状、验收标准。不要写完整实现。',
    build: '按上面的设计实现，交完整文件内容（用 ```write 围栏）。',
    verify: '基于设计与实现，列出可照做的验证步骤、逐条断言（输入→期望），并指出明显缺陷。',
    deliver: '汇总成果：完成了什么、怎么用、有哪些限制、还有什么待办。不要复述全文。'
  };
  function pipeline(){
    ask('多智能体流水线', '四个角色依次干活，后一个看得到前一个的产出。', '例如：做一个能记事的待办页面', function(goal){
      ensureSid('流水线：' + cut(goal, 16));
      var m = modal('流水线：' + cut(goal, 40), '方案 → 执行 → 验证 → 交付');
      var ctx = '', chain = Promise.resolve();
      var steps = [['plan', '方案'], ['build', '执行'], ['verify', '验证'], ['deliver', '交付']];
      steps.forEach(function(st, i){
        chain = chain.then(function(){
          m.log('▶ ' + (i + 1) + '/4 ' + st[1] + '（' + st[0] + '）…');
          var task = '目标：' + goal + (ctx ? '\n\n前序产出：\n' + cut(ctx, 3000) : '') + '\n\n' + (HINT[st[0]] || '');
          var gap = i ? new Promise(function(r){ setTimeout(r, 1500); }) : Promise.resolve();
          return gap.then(function(){ return SUB.run(task, st[0], 0); }).then(function(out){
            ctx += '\n\n【' + st[0] + '】\n' + out;
            m.log('✔ ' + st[0] + '：' + cut(out, 500), 'ok');
          });
        }).catch(function(e){ m.log('✘ ' + st[0] + '：' + (e && e.message || e), 'bad'); });
      });
      chain.then(function(){
        var ins = el('button', { class: 'btn btn-sec', text: '把结论放进输入框' });
        ins.addEventListener('click', function(){ addToInput(cut(ctx, 8000)); m.close(); });
        var cp = el('button', { class: 'btn btn-ghost', text: '复制' });
        cp.addEventListener('click', function(){
          try { if (window.chrome && chrome.webview) chrome.webview.postMessage({ t: 'copy', text: ctx }); } catch(e){}
          UI.toast('已复制');
        });
        m.acts.appendChild(cp); m.acts.appendChild(ins);
        m.log('—— 结束 ——');
      });
    });
  }

  /* ---------- 2. 辩论：三视角并行 + 裁判 ---------- */
  function debate(){
    ask('多智能体辩论', '三个视角各自论证，再由审查角色合并共识与分歧。', '例如：这个页面该不该拆成组件？', function(q){
      ensureSid('辩论：' + cut(q, 16));
      var m = modal('辩论：' + cut(q, 40), 'plan / build / verify 并行 → 裁判合并');
      var views = [
        ['plan', '从事实与证据角度：先列已知/未知，再论证。'],
        ['build', '从实现与代价角度：给出可执行方案与成本。'],
        ['verify', '从风险与反例角度：找漏洞、边界条件、反例。']
      ];
      var ps = views.map(function(v){
        return SUB.run('问题：' + q + '\n' + v[1] + '\n结论 5 行以内，给出你方最强的三条论据。', v[0], 0)
          .then(function(out){ m.log('◆ ' + v[0] + '：' + cut(out, 300)); return '【' + v[0] + '】\n' + out; })
          .catch(function(e){ return '【' + v[0] + '】（失败：' + (e && e.message || e) + '）'; });
      });
      Promise.all(ps).then(function(arr){
        m.log('▶ 裁判合并…');
        return NET.chatOnce([
          { role: 'system', content: '你是裁判。合并多方论证：共识、分歧（各自最强理由）、结论与前提条件。不要复述全文。' },
          { role: 'user', content: '问题：' + q + '\n\n各方观点：\n' + cut(arr.join('\n\n'), 8000) }
        ], { maxTokens: 2400, timeout: 0 });
      }).then(function(msg){
        var txt = (msg && msg.content) || '（无输出）';
        m.log('✔ 裁判：\n' + txt, 'ok');
        var ins = el('button', { class: 'btn btn-sec', text: '放进输入框' });
        ins.addEventListener('click', function(){ addToInput(txt); m.close(); });
        m.acts.appendChild(ins);
      }).catch(function(e){ m.log('✘ ' + (e && e.message || e), 'bad'); });
    });
  }

  /* ---------- 3. 工作流：生成 → 运行 → 自检重写 → 存盘 ---------- */
  function extractHtml(t){
    var t2 = String(t || '');
    var mm = /```(?:html)?\s*\n([\s\S]*?)```/i.exec(t2);
    if (mm && /<[a-z!]/i.test(mm[1])) return mm[1].trim();
    var i = t2.search(/<!doctype html|<html/i);
    return i >= 0 ? t2.slice(i).trim() : '';
  }
  function flow(){
    ask('工作流 · 生成页面并自检', '生成 → 沙箱运行 → 有报错就带着报错重写（最多 2 次）→ 存入工作区', '例如：做一个能拖拽排序的看板', function(goal){
      ensureSid('工作流：' + cut(goal, 16));
      var m = modal('工作流', '节点 1 生成 · 2 运行 · 3 判定 · 4 存盘');
      var code = '', tries = 0, lastErr = '';
      function gen(err){
        m.log('▶ 节点 1 生成' + (tries ? '（第 ' + tries + ' 次重写）' : ''));
        return NET.chatOnce([
          { role: 'system', content: '你是前端实现者。只输出一个完整可运行的单文件 HTML（内联 CSS/JS），不要解释。' },
          { role: 'user', content: goal + (err ? '\n\n上次沙箱报错：\n' + cut(err, 2000) + '\n修好后输出完整 HTML。' : '') }
        ], { maxTokens: 6000, timeout: 240000 }).then(function(msg){
          var txt = (msg && msg.content) || '';
          code = extractHtml(txt);
          if (!code) throw new Error('模型没给出 HTML（回复 ' + txt.length + ' 字符：' + cut(txt, 120).replace(/\n/g, ' ') + '）');
          m.log('✔ 生成 ' + code.length + ' 字符', 'ok');
        });
      }
      function runNode(){
        m.log('▶ 节点 2 沙箱运行');
        return RUNNER.runCapture('html', code, false).then(function(r){
          if (r.ok){ m.log('✔ 运行通过（' + r.ms + 'ms）', 'ok'); return true; }
          lastErr = (r.error || '') + '\n' + (r.output || '');
          m.log('✘ 运行失败：' + cut(lastErr, 300), 'bad');
          return false;
        });
      }
      function save(){
        var sid = ensureSid('工作流产物');
        var name = 'flow-' + Date.now().toString(36) + '.html';
        m.log('▶ 节点 4 存盘');
        return WORK.vfsWrite(sid, name, code).then(function(rec){
          m.log('✔ 已存入工作区：' + rec.path, 'ok');
          try { RUNNER.setTab('ws'); RUNNER.open(); } catch(e){}
          try { RUNNER.renderWs(); } catch(e){}
          var pv = el('button', { class: 'btn btn-sec', text: '预览结果' });
          pv.addEventListener('click', function(){ RUNNER.setTab('view'); RUNNER.open(); });
          m.acts.appendChild(pv);
          return rec;
        });
      }
      (function next(){
        gen(tries ? lastErr : '').then(runNode).then(function(ok){
          if (ok) return save();
          if (tries >= 2){ m.log('✘ 两次重写仍失败，停止（产物未存盘）', 'bad'); return null; }
          tries++; return next();
        }).catch(function(e){ m.log('✘ ' + (e && e.message || e), 'bad'); });
      })();
    });
  }
  return { pipeline: pipeline, debate: debate, flow: flow };
})();

/* v0.6.0：配方（自定义模式）的增删 + 顶栏刷新 */

}

/* v0.7.0：跨模式交接 —— 带上下文与产物换模式，落成新会话（原会话不动） */
var HANDOFF = (function(){
  function summaryOf(msgs){
    var out = [];
    var start = Math.max(0, (msgs || []).length - 10);
    for (var i = start; i < (msgs || []).length; i++){
      var m = msgs[i];
      if (!m || m.role === 'tool') continue;
      var t = String(m.content || '').replace(/\s+/g, ' ').trim();
      if (!t) continue;
      out.push((m.role === 'user' ? '用户：' : '助手：') + t.slice(0, 300));
    }
    return out.join('\n');
  }
  function artifactsOf(sid){
    return DB.allWorkfs().then(function(rows){
      return (rows || []).filter(function(f){ return f.sid === sid; }).map(function(f){ return f.path; }).slice(0, 12);
    }).catch(function(){ return []; });
  }
  function to(targetMode){
    var cs = curSession();
    if (!cs && !S.msgs.length){ UI.toast('当前没有可交接的对话', true); return; }
    var text = summaryOf(S.msgs);
    if (!text){ UI.toast('对话还是空的，没什么可交接', true); return; }
    var oldMode = S.cfg.mode, oldTitle = (cs && cs.title) || '未命名';
    var sid = uuid();
    artifactsOf(cs && cs.id).then(function(files){
      var sys = '【交接】本会话来自 ' + oldMode.toUpperCase() + ' 模式会话「' + oldTitle + '」，由用户主动交接。\n' +
        '目标模式：' + targetMode.toUpperCase() + '。\n' +
        (files.length ? '原会话产物（虚拟工作区）：' + files.join('、') + '\n' : '') +
        '已压缩的前情（按时间）：\n' + text.slice(0, 3000);
      var sess = { id: sid, title: '交接·' + targetMode + ' · ' + oldTitle, ts: Date.now(), pinned: false,
        workspace: (cs && cs.workspace) || S.pendWs || '', msgCount: 1, systemPrompt: sys };
      return DB.putSession(sess).then(function(){
        return DB.putMessage({ id: uuid(), sid: sid, role: 'user', status: 'ok', ts: Date.now(), attachments: [],
          content: '（交接自 ' + oldMode.toUpperCase() + '）请先复述你理解的待办与已有产物，再开始做。' }).then(function(){
          setCfg({ mode: targetMode, persona: '' });
          S.sessions.unshift(sess);
          selectSession(sid);
          UI.toast('已交接给 ' + targetMode.toUpperCase() + '（原会话保留）');
        });
      });
    }).catch(function(e){ UI.toast('交接失败：' + (e && e.message || e), true); });
  }
  return { to: to, summaryOf: summaryOf };
})();

/* v1.28.3：母智能体的阶段流程 + 并行派活纪律（Work / Agent 都注入） */

        add(fmtRun(r, kind), { op: 'run', kind: kind, ok: !!r.ok, ms: r.ms, brief: brief });
        if (!r.ok){
          var key = String(r.error || r.output || '').replace(/\d+/g, 'N').slice(0, 120); // 错误归一（数字泛化）
          if (key && key === w0.lastErr) w0.errStreak++; else { w0.lastErr = key; w0.errStreak = 1; }
        } else w0.errStreak = 0;
      }).then(function(){
        if (LIMITS.WORK_SAME_ERR > 0 && w0.errStreak >= LIMITS.WORK_SAME_ERR){
          /* v3.0 #16：先在第二次同型错误时做一次「带错误上下文的自愈」，仍失败才停 */
          if (!w0.healed){
            w0.healed = 1;
            w0.turns++;
            finish('（同型错误已连续 ' + w0.errStreak + ' 次：请对照上方报错逐条修正后再运行，不要重复原写法）');
            UI.startStreamFor(sid0);
            return;
          }
          w0.turns++;
          finish('（同型错误已连续 ' + w0.errStreak + ' 次，含 1 次自愈重试仍失败，停止自动修复，请人工查看上方输出）');
          UI.toast('Work：同型错误连续 ' + w0.errStreak + ' 次，已停止自动修复', true);
          return; // 不续跑
        }
        next();
      });
    })();
  }
  return {
    handleTurn: handleTurn, scan: scan, applyUnified: applyUnified,
    reset: function(sid){ stMap[sid || S.sid] = { turns: 0, cancel: false, t0: 0, errStreak: 0, lastErr: '' }; }, // v2.2：按会话
    stop: function(sid){ stOf(sid).cancel = true; },                                                          // v2.2：按会话
    protocol: PROTOCOL, vfsWrite: vfsWrite
  };
})();

/* 调试钩子（仅当 localStorage['sc.debug']==='1'）：便于自动化测试 Work 沙箱的纯函数 */
try {
try { document.title = 'SoloChat ' + APP_VER; } catch (e) {} // v0.3.27：标题栏直接显示当前构建版本，便于确认装的是哪个包
  if (localStorage.getItem('sc.debug') === '1'){
    window.SC_WORK = WORK;
    window.SC_DBG = { EXT: EXT, SUB: SUB, MODE: MODE, PICK: PICK, label: modelLabel, modelCaps: NET.modelCaps, md: MD, busy: UI.holdBusy, stage: STAGE_PROTOCOL, net: NET, openSettings: UI.openSettings, setCfg: setCfg, cfg: function(){ return S.cfg; }, ocr: OCR,
      ws: function(){ var c = curSession(); return (c && c.workspace) || ''; },
      bindWs: function(path){ var c = curSession(); if (!c) return ''; c.workspace = path; DB.putSession(c); return c.workspace; },
      sid: function(){ return S.sid; },
   hint: function(a, b){ UI.routeHint(a, b); },
   hideHint: function(){ UI.hideRouteHint(); },
   fs: NET.fs,
   snaps: function(){ return SC_SNAPS; },
  chatMd: function(msgs, s){ return chatToMarkdown(msgs, s); }, // v0.3.35：便于自测
  ver: APP_VER, // v0.3.16：唯一来源
   diag: function(){ return DIAG; },
   FS: FS, DB: DB,
   search: function(q){ return NET.searchWeb(q, null, true); },
   src: function(){ return RUNNER.srcs(); },
   addSrc: function(a, b, c, d){ RUNNER.addSources(a, b, c, d); },
   renderSrc: function(){ RUNNER.renderSrc(); },
      cfg: function(){ return S.cfg; },
      setCfg: function(o){ setCfg(o); } };
  }
} catch (e) {}
loadCfg();
document.body.classList.toggle('sb-collapsed', S.cfg.sbHidden !== false); // v1.3：按钮 / Ctrl+B 控制，不再悬浮呼出
NET.bridge.init();
Vault.avail = NET.bridge.ok; // F4：有宿主桥才启用 DPAPI 保险库
if (Vault.avail) Vault.hydrate(S.cfg).then(function(){ saveCfg(); }); // 迁移：把旧 localStorage 明文密钥入保险库并脱敏重写
UI.init();
MODE.mountUI(); // v0.6.0：自定义模式按钮
UI.DUAL.init(); // v1.4：双开视图
if (!Vault.avail) UI.toast('未连接宿主：API Key 将明文存于浏览器 localStorage，建议使用桌面版', true);
DB.open()
  .then(function(){ UI.reloadSessions(true); }) // 每次启动进入新建会话（草稿态，发送首条消息才落库）；不再做任何自动删除
  .catch(function(){ UI.toast('本地数据库打开失败，历史记录将不可用', true); });
})();
</script>
