<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src *; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>SoloChat · AI 对话</title>
<script>
/* 防闪烁：首帧前定主题 */
try{var __c=JSON.parse(localStorage.getItem('sc.cfg.v1')||localStorage.getItem('op.cfg.v1')||'{}'),__t=__c.theme||'auto';
if(__t==='auto')__t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=__t;}catch(e){document.documentElement.dataset.theme='light';}
</script>
<style>
/*  */
:root[data-theme="light"]{
  --canvas:#faf9f5; --soft:#f5f0e8; --card:#efe9de; --lift:#e8e0d2;
  --hairline:#e6dfd8; --hairline-soft:#ebe6df;
  --ink:#141413; --body:#3d3d3a; --muted:#6c6a64; --faint:#8e8b82;
  --primary:#cc785c; --primary-active:#a9583e; --primary-hover:#b96a4f; --on-primary:#ffffff;
  --ring:rgba(204,120,92,.16); --ring-line:#cc785c;
  --danger:#c64545; --success:#5db872; --warning:#d4a017;
  --code-bg:#181715; --code-bg-soft:#1f1e1b; --code-ink:#faf9f5; --code-muted:#a09d96;
  --bubble:#efe9de; --bubble-line:#e6dfd8;
  --scrim:rgba(20,20,19,.45);
  --shadow-pop:0 4px 20px rgba(20,20,19,.10);
  --font-display:Georgia,'Times New Roman','Songti SC','SimSun',serif;
  --tracking-display:-.02em;
}
:root[data-theme="dark"]{
  --canvas:#010102; --soft:#0f1011; --card:#0f1011; --lift:#141516;
  --hairline:#23252a; --hairline-soft:#23252a;
  --ink:#f7f8f8; --body:#d0d6e0; --muted:#8a8f98; --faint:#62666d;
  --primary:#5e6ad2; --primary-active:#5e69d1; --primary-hover:#828fff; --on-primary:#ffffff;
  --ring:rgba(94,105,209,.45); --ring-line:#5e69d1;
  --danger:#e5484d; --success:#27a644; --warning:#d4a017;
  --code-bg:#0f1011; --code-bg-soft:#0f1011; --code-ink:#f7f8f8; --code-muted:#8a8f98;
  --bubble:#141516; --bubble-line:#23252a;
  --scrim:rgba(0,0,0,.62);
  --shadow-pop:0 4px 20px rgba(0,0,0,.5);
  --font-display:-apple-system,'SF Pro Display','Segoe UI','Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --tracking-display:-.03em;
}
:root{
  --font-sans:-apple-system,'SF Pro Text','Segoe UI','Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:9999px;
  --sb-w:264px; --tb-h:52px; --content-w:780px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-sans); font-size:14px; line-height:1.55;
  background:var(--canvas); color:var(--body);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::placeholder{color:var(--faint)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.fill{fill:currentColor;stroke:none}

/* 布局骨架 */
#app{display:flex;height:100vh}
#sidebar{
  width:var(--sb-w); flex:none; display:flex; flex-direction:column;
  background:var(--canvas); border-right:1px solid var(--hairline);
}
#main{flex:1; min-width:0; display:flex; flex-direction:column}
body.sb-collapsed #sidebar{display:none}

/* 侧栏 */
.sb-top{padding:14px 12px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;color:var(--ink)}
.brand .ic{width:18px;height:18px}
.brand b{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:var(--tracking-display)}
#btn-new{width:100%;justify-content:center}
.sb-search{padding:8px 12px}
.sb-search .wrap{position:relative}
.sb-search .ic{position:absolute;left:9px;top:8px;color:var(--faint)}
#sb-q{
  width:100%;height:32px;padding:0 10px 0 30px;border-radius:var(--r-md);
  background:var(--soft);border:1px solid transparent;outline:none;font-size:13px;
}
#sb-q:focus{border-color:var(--ring-line);box-shadow:0 0 0 3px var(--ring)}
#session-list{flex:1;overflow-y:auto;padding:2px 8px 12px}
.ss-item{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:7px 8px;border-radius:var(--r-md);cursor:pointer;color:var(--body);
}
.ss-item:hover{background:var(--soft)}
.ss-item.active{background:var(--lift);color:var(--ink)}
.ss-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.ss-item .acts{display:none;gap:2px}
.ss-item:hover .acts,.ss-item.active .acts{display:flex}
.ss-item .acts button{padding:3px;border-radius:var(--r-sm);color:var(--muted)}
.ss-item .acts button:hover{background:var(--hairline-soft);color:var(--ink)}
.ss-item .pin{color:var(--faint);display:none}
.ss-item.pinned .pin{display:block}
.ss-group{font-size:11px;color:var(--faint);padding:10px 10px 4px}
.sb-foot{padding:10px 12px;border-top:1px solid var(--hairline);display:flex;gap:6px}
.sb-foot button{flex:1;justify-content:center}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-md);
  font-size:13.5px;font-weight:500;line-height:1.2;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease;
}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{background:var(--primary-active)}
.btn-sec{background:var(--canvas);border:1px solid var(--hairline);color:var(--ink)}
.btn-sec:hover{background:var(--soft)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{padding:6px;border-radius:var(--r-md);color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}

/* 顶栏 */
#topbar{
  height:var(--tb-h);flex:none;display:flex;align-items:center;gap:6px;
  padding:0 12px;border-bottom:1px solid var(--hairline);position:relative;
}
/* 顶栏控件簇：模式/模型/思考/文件夹 */
#tb-c{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
#sel-model{width:336px}
#tb-title{
  flex:1;min-width:0;
  font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);
  letter-spacing:var(--tracking-display);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 窗控：最小化/最大化/托盘 */
#win-ctl{margin-left:auto;display:flex;align-self:stretch}
.win-btn{width:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border-radius:0}
.win-btn .ic{width:15px;height:15px}
.win-btn:hover{background:var(--soft);color:var(--ink)}
.win-btn[data-win="close"]:hover{background:var(--danger);color:#fff}

/* 侧栏悬浮呼出（左缘热区） */
#sb-hover{position:fixed;left:0;top:0;bottom:0;width:calc(var(--sb-w)/2);z-index:35;display:none}
body.sb-collapsed:not(.sb-float) #sb-hover{display:block}
body.sb-collapsed.sb-float #sidebar{
  display:flex;position:fixed;inset:0 auto 0 0;z-index:40;box-shadow:var(--shadow-pop);
}

/* 消息区 */
#msg-scroll{flex:1;overflow-y:auto;position:relative;scroll-behavior:auto}
#msg-list{max-width:var(--content-w);margin:0 auto;padding:20px 20px 8px}
#load-earlier{display:flex;margin:0 auto 14px}
.msg{margin:0 0 22px;position:relative}
.msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.msg-role{font-size:12.5px;font-weight:600;color:var(--ink)}
.msg-time{font-size:11.5px;color:var(--faint)}
.msg-tokens{font-size:11px;color:var(--faint)}
.msg-body{font-size:14.5px;color:var(--body);overflow-wrap:anywhere}
.msg[data-role="user"] .msg-body{
  background:var(--bubble);border:1px solid var(--bubble-line);
  padding:9px 13px;border-radius:var(--r-lg);
}
.msg[data-role="assistant"] .msg-body{padding:2px 0}
/* [fs-result] 紧凑弱化样式（MD 渲染） */
.msg.fsres .msg-body{background:none;border:0;padding:0;font-size:13px;color:var(--muted)}
.msg.fsres .msg-role{color:var(--muted);font-weight:500}
.msg-acts{display:flex;gap:2px;margin-top:5px;opacity:0;transition:opacity .12s}
.msg:hover .msg-acts,.msg-acts.pin{opacity:1}
.msg-acts button{padding:3px 5px;border-radius:var(--r-sm);color:var(--faint);display:inline-flex;align-items:center;gap:4px;font-size:11.5px}
.msg-acts button:hover{background:var(--soft);color:var(--ink)}
.msg-acts button[disabled]{opacity:.35;pointer-events:none}
.msg-acts .var-pos{font-size:11px;color:var(--faint);align-self:center;padding:0 2px;font-family:var(--font-mono)}
.msg-err{
  margin-top:6px;padding:8px 11px;border-radius:var(--r-md);font-size:12.5px;
  background:color-mix(in srgb,var(--danger) 8%,var(--canvas));color:var(--danger);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.msg-err .btn{padding:3px 9px;font-size:12px}
.badge{
  font-size:11px;padding:1px 8px;border-radius:var(--r-pill);
  background:var(--lift);color:var(--muted);
}
.reason{
  margin:0 0 8px;border:1px solid var(--hairline);border-radius:var(--r-md);
  background:var(--soft);font-size:13px;
}
.reason summary{padding:6px 10px;cursor:pointer;color:var(--muted);user-select:none}
.reason .r-body{padding:2px 10px 8px;color:var(--muted);white-space:pre-wrap}
.msg-atts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.msg-atts img{max-width:220px;max-height:160px;border-radius:var(--r-md);border:1px solid var(--hairline);display:block}
.att-file{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r-md);background:var(--soft);border:1px solid var(--hairline);font-size:11.5px;color:var(--muted);max-width:280px}
.att-file .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.collapsed .msg-body{max-height:1200px;overflow:hidden}
.msg-fold{margin-top:4px}

/* Markdown 内容排版 */
.md h1,.md h2,.md h3,.md h4{
  font-family:var(--font-display);font-weight:600;color:var(--ink);
  letter-spacing:var(--tracking-display);margin:14px 0 6px;line-height:1.3;
}
.md h1{font-size:20px}.md h2{font-size:17.5px}.md h3{font-size:15.5px}.md h4{font-size:14.5px}
.md p{margin:7px 0}
.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md a{color:var(--primary);text-decoration:none}
.md a:hover{text-decoration:underline}
.md strong{color:var(--ink);font-weight:600}
.md code{
  font-family:var(--font-mono);font-size:12.5px;padding:1.5px 5px;border-radius:var(--r-sm);
  background:var(--soft);color:var(--ink);border:1px solid var(--hairline-soft);
}
.md pre{
  position:relative;margin:10px 0;border-radius:var(--r-lg);overflow:hidden;
  background:var(--code-bg);border:1px solid var(--hairline);
}
:root[data-theme="light"] .md pre{border-color:#2a2825}
.md pre code{
  display:block;padding:12px 14px;background:none;border:0;color:var(--code-ink);
  font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre;
}
.md pre .lang{
  position:absolute;top:6px;right:44px;font-size:10.5px;color:var(--code-muted);
  font-family:var(--font-mono);user-select:none;
}
.code-copy{
  position:absolute;top:5px;right:5px;padding:4px 6px;border-radius:var(--r-sm);
  background:transparent;color:var(--code-muted);display:inline-flex;align-items:center;gap:4px;font-size:11px;
}
.code-copy:hover{background:rgba(255,255,255,.08);color:var(--code-ink)}
.code-copy.ok{color:var(--success)}
.md ul,.md ol{margin:7px 0 7px 22px}
.md li{margin:3px 0}
.md blockquote{
  margin:8px 0;padding:4px 12px;border-left:3px solid var(--primary);
  background:var(--soft);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--muted);
}
.md hr{border:0;border-top:1px solid var(--hairline);margin:14px 0}
.md table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
.md th,.md td{border:1px solid var(--hairline);padding:5px 10px;text-align:left}
.md th{background:var(--soft);color:var(--ink);font-weight:600}

/* 文件 Agent 卡片渲染（fs-* 围栏，§5.4） */
.fs-card{margin:10px 0;border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;background:var(--soft)}
.fs-head{display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.fs-head .fs-path{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere;flex:1;min-width:120px}
.fs-badge{font-size:10.5px;padding:1px 8px;border-radius:var(--r-pill);background:var(--lift);color:var(--muted);flex:none}
.fs-badge.ok{background:color-mix(in srgb,var(--success) 15%,var(--canvas));color:var(--success)}
.fs-badge.rej{background:color-mix(in srgb,var(--danger) 12%,var(--canvas));color:var(--danger)}
.fs-card .fs-diff{font-family:var(--font-mono);font-size:12px;line-height:1.55;overflow:auto;max-height:300px;
  padding:6px 0;border-top:1px solid var(--hairline);background:var(--canvas)}
.fs-card .fs-diff:empty::after{content:'差异加载中…';color:var(--faint);padding:0 12px;font-size:11.5px}
.fs-diff span{display:block;padding:0 12px;white-space:pre;overflow-wrap:anywhere}
.fs-diff .add{color:var(--success);background:color-mix(in srgb,var(--success) 9%,transparent)}
.fs-diff .del{color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.fs-diff .hunk{color:var(--warning)}

/* 输入区左右分区+编辑器控件 */
#composer .inner{position:relative}
.crow{display:grid;grid-template-columns:1fr minmax(300px,var(--content-w)) 1fr;align-items:end;gap:8px}
.cwrap{display:flex;align-items:flex-end;gap:8px;min-width:0}
.czone{display:flex;align-items:center;gap:4px;flex:none;padding-bottom:9px}
.cz-l{justify-self:start}

.ctxsvg{width:26px;height:26px;transform:rotate(-90deg)}
.ctxsvg circle{fill:none;stroke-width:3.5}
.ctx-bg{stroke:var(--hairline)}
.ctx-fg{stroke:var(--primary);stroke-linecap:round;stroke-dasharray:0 98;transition:stroke-dasharray .3s,stroke .3s}
#ctx-ring.warn .ctx-fg{stroke:var(--warning)}
#ctx-ring.over .ctx-fg{stroke:var(--danger)}
.ctx-num{font-size:10px;color:var(--faint)}
.seg-sm{padding:2px}
.seg-sm button{padding:4px 10px;font-size:12px}
.sel-mini{
  width:168px;height:30px;padding:0 6px;border-radius:var(--r-md);outline:none;
  background:var(--canvas);border:1px solid var(--hairline);color:var(--ink);font-size:12.5px;
}
.sel-think{width:96px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
#btn-ws.on{color:var(--primary)}
.tb-ws{height:30px;padding:0 10px;font-size:12.5px;max-width:300px}
.tb-ws .ic{width:14px;height:14px;flex:none}
#ws-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ws:disabled{opacity:.85;cursor:default}
.tb-ws.locked{background:none;border-color:transparent;color:var(--muted)}
#btn-ws[hidden]{display:none}
#cmp-pop{
  position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);
  width:min(var(--content-w),100%);z-index:20;
  background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);
  box-shadow:var(--shadow-pop);max-height:262px;overflow-y:auto;padding:6px;
}
.cmp-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px}
.cmp-item:hover{background:var(--soft)}
.cmp-item .t{flex:none;color:var(--ink);font-weight:500}
.cmp-item .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.cmp-item .x{flex:none;padding:2px 5px;border-radius:4px;color:var(--faint)}
.cmp-item .x:hover{color:var(--danger)}
.cmp-title{font-size:11px;color:var(--faint);padding:4px 8px}
.cmp-new{width:100%;justify-content:center;margin-top:4px}

/* 侧栏项目组：项目=工作区文件夹 */
.ss-proj{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r-md);cursor:pointer;color:var(--body);font-weight:500}
.ss-proj:hover{background:var(--soft)}
.ss-proj .chev{width:12px;height:12px;color:var(--faint);transition:transform .12s}
.ss-proj.closed .chev{transform:rotate(-90deg)}
.ss-proj .ic{width:15px;height:15px;color:var(--muted)}
.ss-proj .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ss-proj .add,.ss-proj .pinb,.ss-proj .delb{display:none;padding:3px;border-radius:var(--r-sm);color:var(--muted);background:none;border:0;cursor:pointer}
.ss-proj:hover .add,.ss-proj:hover .pinb,.ss-proj:hover .delb,.ss-proj .pinb.on{display:inline-flex}
.ss-proj .add:hover,.ss-proj .pinb:hover{background:var(--hairline-soft);color:var(--ink)}
.ss-proj .delb:hover{background:var(--hairline-soft);color:var(--danger)}
.ss-proj .add .ic,.ss-proj .pinb .ic,.ss-proj .delb .ic{width:14px;height:14px}
.ss-proj .pinb.on{color:var(--primary);display:inline-flex}
.ss-item.sub{margin-left:20px}
.ss-item .tm{font-size:11px;color:var(--faint);margin-left:6px;flex:none;display:none}
.ss-item.sub .tm{display:block}
.ss-item.sub:hover .tm,.ss-item.sub.active .tm{display:none}

/* 骨架屏 / 空状态 / 回到底部 */
.skel{padding:4px 0}
.skel i{display:block;height:12px;border-radius:6px;background:var(--soft);margin:8px 0}
.skel i:nth-child(1){width:62%}.skel i:nth-child(2){width:88%}.skel i:nth-child(3){width:41%}
#empty{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;text-align:center;padding:24px;
}
#empty.show{display:flex}
#empty h1{
  font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--ink);
  letter-spacing:var(--tracking-display);
}
#empty p{color:var(--muted);max-width:420px}
#empty .row{display:flex;gap:10px}
.e-sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:600px}
.e-sug{padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--canvas);color:var(--muted);font-size:12.5px;cursor:pointer}
.e-sug:hover{background:var(--soft);color:var(--ink)}
.srch{font-size:12px;color:var(--muted)}
#msg-list > .srch{margin:-4px 0 16px}
.srch summary{cursor:pointer;user-select:none;padding:2px 0}
.srch .srch-i{padding:2px 0 2px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch .srch-i a{color:var(--muted);text-decoration:none}
.srch .srch-i a:hover{color:var(--primary)}
#btn-bottom{
  position:sticky;bottom:10px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-pill);
  background:var(--lift);color:var(--ink);border:1px solid var(--hairline);
  box-shadow:var(--shadow-pop);font-size:12.5px;z-index:5;
}
#btn-bottom.show{display:inline-flex}

/* 输入区 */
#composer{flex:none;border-top:1px solid var(--hairline);padding:10px 16px 12px;position:relative;z-index:36}
#chips{display:flex;gap:8px;flex-wrap:wrap;max-width:var(--content-w);margin:0 auto 8px}
#chips:empty{display:none}
.chip{
  position:relative;width:52px;height:52px;border-radius:var(--r-md);
  border:1px solid var(--hairline);overflow:hidden;background:var(--soft);
}
.chip img{width:100%;height:100%;object-fit:cover;display:block}
.chip.txt{width:auto;min-width:60px;max-width:180px;display:flex;align-items:center;padding:0 24px 0 10px;font-size:11.5px;color:var(--body)}
.chip.txt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{
  position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;
}
.chip button .ic{width:10px;height:10px}
.cbox{
  width:100%;min-width:0;flex:1;display:flex;align-items:flex-end;gap:6px;padding:8px;
  background:var(--soft);border:1px solid var(--hairline);border-radius:var(--r-lg);
}
#btn-send{color:var(--primary);flex:none}
#btn-send:hover{background:var(--soft);color:var(--primary)}
.cbox:focus-within{border-color:var(--ring-line);box-shadow:0 0 0 3px var(--ring)}
#input{
  flex:1;border:0;outline:none;background:none;resize:none;
  max-height:180px;padding:5px 4px;font-size:14.5px;line-height:1.5;color:var(--ink);
}
#btn-web.on{background:var(--primary);color:var(--on-primary)}

/* 展开式折叠面板（设置） */
.acc{border:1px solid var(--hairline);border-radius:var(--r-md);margin-bottom:10px;overflow:hidden}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:var(--soft);color:var(--ink);font-size:13px;font-weight:500;user-select:none}
.acc-head .ic{transition:transform .15s;color:var(--muted)}
.acc.open .acc-head .ic{transform:rotate(180deg)}
.acc-body{display:none;padding:12px;border-top:1px solid var(--hairline)}
.acc.open .acc-body{display:block}

/* 弹层 */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.show{display:block}
#modal .scrim{position:absolute;inset:0;background:var(--scrim)}
#modal .panel{
  position:absolute;left:50%;top:8vh;transform:translateX(-50%);
  width:min(560px,92vw);max-height:84vh;overflow-y:auto;
  background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);
  box-shadow:var(--shadow-pop);padding:20px 22px;
}
#modal h2{
  font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--ink);
  letter-spacing:var(--tracking-display);margin-bottom:4px;
}
#modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
/* 设置分屏：左目录 / 右内容 */
#modal .panel.wide{width:min(760px,94vw);padding:0;display:flex;flex-direction:column;overflow:hidden}
.set-main{display:flex;flex:1;min-height:0}
.set-nav{width:148px;flex:none;border-right:1px solid var(--hairline);padding:14px 10px}
.set-title{
  font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);
  letter-spacing:var(--tracking-display);padding:2px 10px 12px;
}
.set-nav button{display:block;width:100%;text-align:left;padding:8px 12px;margin:2px 0;border-radius:var(--r-md);color:var(--muted);font-size:13.5px}
.set-nav button:hover{background:var(--soft);color:var(--ink)}
.set-nav button.on{background:var(--soft);color:var(--ink);font-weight:500}
.set-body{flex:1;min-width:0;overflow-y:auto;padding:18px 20px;max-height:72vh}
.set-page{display:none}
.set-page.on{display:block}
.set-page h2{margin-bottom:14px}
.set-foot{border-top:1px solid var(--hairline);padding:10px 14px;display:flex;justify-content:flex-end}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:5px}
.f-row .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.f-in,.f-row textarea,.f-row select{
  width:100%;padding:8px 11px;border-radius:var(--r-md);outline:none;
  background:var(--canvas);border:1px solid var(--hairline);color:var(--ink);font-size:13.5px;
}
.f-in:focus,.f-row textarea:focus,.f-row select:focus{border-color:var(--ring-line);box-shadow:0 0 0 3px var(--ring)}
.f-row textarea{resize:vertical;min-height:64px;font-family:var(--font-sans)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-pill);padding:2px;gap:2px}
.seg button{padding:5px 13px;border-radius:var(--r-pill);font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:var(--lift)}
.f-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.p-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.p-card{border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.p-card.edit{grid-column:1/-1}
.p-name{font-weight:600;font-size:12px;color:var(--primary);font-family:var(--font-mono)}
.p-text{font-size:12px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.m-sec{border-top:1px solid var(--hairline);margin-top:16px;padding-top:14px}
.m-sec h3{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px}
#modal .panel.narrow{width:min(400px,90vw)}

/* Toast */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  padding:9px 16px;border-radius:var(--r-pill);font-size:13px;
  background:var(--ink);color:var(--canvas);box-shadow:var(--shadow-pop);
  animation:t-in .18s ease;
}
.toast.err{background:var(--danger);color:#fff}
@keyframes t-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:5px;border:2px solid var(--canvas)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
::-webkit-scrollbar-track{background:transparent}

/* 响应式 */

    if (!Array.isArray(kids)) kids = [kids];

function throttle(fn, ms){
  var last = 0, timer = null;
  return function(){
    var now = Date.now(), args = arguments, self = this;
    var run = function(){ last = Date.now(); timer = null; fn.apply(self, args); };
    if (now - last >= ms) run();
    else if (!timer) timer = setTimeout(run, ms - (now - last));

function debounce(fn, ms){
  var t = null;

  d.cancel = function(){ clearTimeout(t); t = null; };

     Sciter   ：window.xcall('solohost', json) 页面→宿主；宿主经 SciterCall 调全局 __hostPush(json) 宿主→页面
     浏览器   ：降级（无宿主，http 直连 fetch 走通道①） */
  var ENGINE = (window.chrome && window.chrome.webview) ? 'webview2'
             : (typeof Window !== 'undefined' && Window.this && typeof window.xcall === 'function') ? 'sciter'
             : 'browser';
  var bridge = {
    engine: ENGINE,
    ok: ENGINE !== 'browser',
    pend: {}, seq: 0,
    init: function(){
      if (this.engine === 'webview2'){
        window.chrome.webview.addEventListener('message', function(e){ bridge._dispatch(e.data); });
      } else if (this.engine === 'sciter'){
        window.__hostPush = function(data){ // 宿主 SciterCall 调用入口
          try { bridge._dispatch(typeof data === 'string' ? JSON.parse(data) : data); } catch(e){}
        };
      }
    },
    _dispatch: function(d){
      if (!d || !d.t) return;
      /* 宿主推送（无关联 id）先于 pend 匹配处理 */
      if (d.t === 'quick.ask'){ UI.quickAsk(d.text); return; }
      if (d.t === 'quickbar.sync'){ setCfg({ quickbar: !!d.show }); return; } // 热键切换显隐后的静默同步
      if (d.t === 'quickbar.hidden'){ setCfg({ quickbar: false }); UI.toast('快速输入条已隐藏，可在 设置 → 主题 中重新开启'); return; }
      if (d.t === 'hotkey.result'){
        if (!d.ok) UI.toast('全局热键注册失败：' + d.combo + '（可能被其它程序占用）', true);
        return;
      }
      var p = d.id && bridge.pend[d.id];
      if (!p) return;
      if (d.t === 'http.chunk') p.onChunk(d.data);
      else if (d.t === 'http.meta'){ /* 状态码统一由 done/error 通道携带 */ }
      else if (d.t === 'http.done'){ delete bridge.pend[d.id]; p.onDone(d.status); }
      else if (d.t === 'http.error'){ delete bridge.pend[d.id]; p.onError(new Error(d.message || 'bridge error')); }
      else if (d.t === 'fs.done'){ delete bridge.pend[d.id]; p.onDone(d.data); }
      else if (d.t === 'fs.error'){ delete bridge.pend[d.id]; p.onError(new Error(d.message || '文件操作失败')); }
      else if (d.t === 'secret.done' || d.t === 'secret.error'){
        var pv = bridge.pend[d.id];
        if (pv){ delete bridge.pend[d.id];
          if (d.t === 'secret.error') pv.reject(new Error(d.message || '保险库错误'));
          else pv.resolve(d.status === 404 ? null : d.data);
        }
      }
    },
    send: function(msg){
      if (msg && msg.t === 'http') msg.proxy = (typeof S !== 'undefined' && S.cfg && S.cfg.proxy) || ''; // 代理只随宿主桥通道下发
      if (this.engine === 'webview2') window.chrome.webview.postMessage(msg);
      else if (this.engine === 'sciter') window.xcall('solohost', JSON.stringify(msg)); // 同步投递，宿主异步回推
    },
    abort: function(id){ this.send({ t: 'http.abort', id: id }); },
    vault: function(op, name, value){ // F4：密钥保险库（DPAPI），get→string|null / set→void
      if (!this.ok) return Promise.resolve(null);
      var id = 'v' + (++this.seq);
      return new Promise(function(res, rej){
        bridge.pend[id] = { resolve: res, reject: rej };
        var msg = { t: 'secret', op: op, name: name, id: id };
        if (value !== undefined) msg.value = value;
        bridge.send(msg);
      });
    }
  };
  function bridgeStream(opt){
    var id = 'r' + (++bridge.seq);
    var parser = createParser(opt.onDelta, function(u){ opt.onUsage(u); });
    var finished = false;
    function finErr(e){
      if (finished) return; finished = true;
      delete bridge.pend[id];
      opt.onError(e);
    }
    bridge.pend[id] = {
      onChunk: function(text){ parser.feed(text); },
      onDone: function(status){
        if (finished) return; finished = true;
        delete bridge.pend[id];
        // Issue 12: 非 2xx 视为失败（此前 401/500 仍当成功，UI 停在空回复且无错误提示）
        if (status != null && (status < 200 || status >= 300)) {
          var e = new Error('HTTP ' + status); e.status = status; e.name = 'HttpError';
          opt.onError(e); return;
        }
        parser.end(); opt.onDone(status == null ? null : status);
      },
      onError: finErr
    };
    bridge.send({
      t: 'http', id: id,
      url: normBase(S.cfg.baseURL) + '/chat/completions',
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (S.cfg.apiKey || '')
      },
      body: JSON.stringify(opt.body)
    });
    return { abort: function(){
      bridge.abort(id);
      var e = new Error('aborted'); e.name = 'AbortError';
      finErr(e); // 中止也要走完成回调，否则 UI 卡在发送态
    } };
  }

  /* 内置 mock：离线演示流式+推理+usage */
  var MOCK_REPLY = [
    '这是**离线演示**回复：「%Q」。演示流式、Markdown、代码块与操作条。\n\n',
    '```js\nconsole.log("你好")\n```\n\n> 配置 Base URL 后即为真实对话。\n\n',
    '行内 `code`、*斜体*、**粗体**、[链接](https://example.com)、表格：\n\n| 项 | 值 |\n| --- | --- |\n| SSE | 正常 |'
  ].join('');
  var MOCK_REASON = '（演示）组织覆盖 Markdown 各元素的回复。';
  function mockStream(opt){
    var q = '';
    var lastU = null;
    for (var i = opt.body.messages.length - 1; i >= 0; i--)
      if (opt.body.messages[i].role === 'user'){ lastU = opt.body.messages[i]; break; }
    if (lastU) q = (typeof lastU.content === 'string' ? lastU.content : '（含图片）').slice(0, 60);
    var text = MOCK_REPLY.replace('%Q', q || '…');
    /* 文件 Agent 演示：读→写申请→确认 */
    var lastText = lastU && typeof lastU.content === 'string' ? lastU.content : '';
    if (S.cfg.fileOps && lastText.indexOf('[fs-result]') === 0){
      if (lastText.indexOf('已确认写入') >= 0 || lastText.indexOf('已拒绝写入') >= 0) text = '文件 Agent 演示完成：写入申请已处理，工作区状态已同步。还需要我做别的吗？';
      else if (lastText.indexOf('失败') >= 0) text = '工具调用失败了（见上方 [fs-result] 消息）。可检查工作区设置后重试。';
      else text = '好的：\n\n```fs-write\nreadme.md\n# 说明\n```\n\n请卡片上确认写入。';
    } else if (S.cfg.fileOps && /文件|fs/i.test(q)) text = '好的，我先看一下工作区里有什么：\n\n```fs-list\n\n```\n\n```fs-read\nreadme.md\n```';
    var aborted = false;
    var steps = [], si = 0;
    for (i = 0; i < MOCK_REASON.length; i += 3) steps.push({ t: MOCK_REASON.slice(i, i + 3), r: true });
    for (i = 0; i < text.length; i += 2) steps.push({ t: text.slice(i, i + 2), r: false });
    var timer = setInterval(function(){
      if (aborted) return;
      if (si >= steps.length){
        clearInterval(timer);
        opt.onUsage({ prompt_tokens: 128, completion_tokens: Math.ceil(text.length / 4), total_tokens: 128 + Math.ceil(text.length / 4), prompt_cache_hit_tokens: 96 });
        opt.onDone(null);
        return;
      }
      var s = steps[si++];
      opt.onDelta(s.t, s.r);
    }, 18);
    return { abort: function(){
      if (aborted) return;
      aborted = true; clearInterval(timer);
      var e = new Error('aborted'); e.name = 'AbortError';
      opt.onError(e); // 通知 UI 结束流式态
    } };
  }

  /* 文件 Agent 桥：优先桥，mock 走内存 */
  var MOCK_FS = { // 内存 VFS：离线验收文件 Agent 全链路
    'readme.md': '# 演示工作区\n\nmock 文件系统根目录，可在设置换真实目录。\n',
    'src/main.js': 'function main(){\n  console.log("hello SoloChat");\n}\nmain();\n',
    'src/util.js': 'function add(a, b){ return a + b; }\nmodule.exports = { add: add };\n' };
  function mockFs(op, path, data){
    return sleep(120).then(function(){
      var p = String(path || ''), key; // GuardPath 同款：绝对路径/.. 拒绝
      if (/^[A-Za-z]:[\\/]/.test(p) || p.indexOf('..') >= 0) throw new Error('必须使用工作区内相对路径（越界已拒绝）');
      key = p.replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
      if (op === 'config' || op === 'setroot') return { root: 'mock://workspace' };
      if (op === 'rmroot') return { root: '' };
      if (op === 'write'){
        if (!key) throw new Error('路径为空');
        if ((data || '').length > LIMITS.FS_WRITE_MAX) throw new Error('内容超过 256KB，拒绝写入');
        MOCK_FS[key] = data || '';
        return { path: p, bytes: (data || '').length };
      }
      if (op === 'read'){
        var t = MOCK_FS[key];
        if (t == null) throw new Error('文件不存在: ' + p);
        return { path: p, text: t, bytes: t.length, lines: t.split('\n').length };
      }
      if (op === 'list'){
        var dirs = {}, files = {}, entries = [], k;
        for (k in MOCK_FS){
          if (key && k.indexOf(key + '/') !== 0) continue;
          var rest = key ? k.slice(key.length + 1) : k, sl = rest.indexOf('/');
          if (sl >= 0) dirs[rest.slice(0, sl)] = 1; else files[rest] = MOCK_FS[k].length;
        }
        for (k in dirs) entries.push({ n: k, d: true, s: 0 });
        for (k in files) entries.push({ n: k, d: false, s: files[k] });
        return { path: p, entries: entries, truncated: false };
      }
      throw new Error('未知文件操作: ' + op);
    });
  }
  function fsCall(op, path, data, root){
    if (isMock()) return mockFs(op, path, data);
    return new Promise(function(res, rej){
      if (!bridge.ok){ rej(new Error('文件 Agent 需在 SoloChat 宿主内或 mock 模式使用')); return; }
      var id = 'f' + (++bridge.seq);
      bridge.pend[id] = { onChunk: function(){}, onDone: res, onError: rej };
      bridge.send({ t: 'fs', id: id, op: op, path: path || '', data: data == null ? '' : data, root: root || '' });
      setTimeout(function(){ // setroot 含选目录交互放宽超时；普通 IO 15s
        if (bridge.pend[id]){ delete bridge.pend[id]; rej(new Error('文件操作超时')); }
      }, op === 'setroot' ? 300000 : 15000);
    });
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* ---- 联网搜索管线：查询预处理 → LLM 改写 → 三通道检索 → 网页正文抓取 → 结构化注入 ---- */
  var SEARCH_HEADS = ['请帮我查', '请帮我搜索', '请帮我', '麻烦帮我', '能不能帮我', '可以帮我', '麻烦', '请你', '请问',
    '帮我查', '帮我搜索', '帮我', '给我查', '查一下', '查询一下', '搜一下', '搜索一下', '检索一下',
    '找一下', '查找一下', '想知道', '我要查', '我要搜索'];
  var SEARCH_REFER = /(第\s*[一二三四五六七八九十\d]+\s*[个条项种类号页章节款]|上面|前面|刚才|之前|后者|前者|上述|上文|这个问题|那个问题|该问题|这些|那些|这个|那个|它|他们)/;

  /* 规则预处理（档①）：去客套前缀；短且含指代 → 判定追问，拼上上一条用户消息 */
  function prepQuery(raw, prev){
    var s = String(raw || '').trim().replace(/\s+/g, ' ');
    for (var pass = 0; pass < 3; pass++){ // 多轮去客套：麻烦请帮我查一下… → 实体
      var before = s;
      for (var i = 0; i < SEARCH_HEADS.length; i++){
        if (s.indexOf(SEARCH_HEADS[i]) === 0){
          var rest = s.slice(SEARCH_HEADS[i].length)
            .replace(/^[\s,，。.、;；:：!！?？]+/, '').replace(/^一下/, '')
            .replace(/^[\s,，。.、;；:：!！?？]+/, '');
          if (rest) s = rest;
          break;
        }
      }
      if (s === before) break;
    }
    var follow = s.length > 0 && s.length <= 40 && SEARCH_REFER.test(s);
    if (follow && prev){
      var p = String(prev).replace(/\s+/g, ' ').trim();
      if (p) s = p.slice(-160) + ' ' + s;
    }
    return { q: s || String(raw || '').trim(), follow: follow };
  }
  /* 当前消息发送前已入列，取更早的一条不同内容的用户消息作追问上下文 */
  function lastUserBefore(msgs, raw){
    var t = String(raw || '').trim();
    for (var i = (msgs || []).length - 1; i >= 0; i--){
      var m = msgs[i];
      if (m && m.role === 'user'){
        var c = String(m.content || '').trim();
        if (c && c !== t) return c;
      }
    }
    return null;
  }

  /* 非流式 chat 补全（查询改写用）：双通道，任何失败返回 null */
  function chatOnce(messages, opt){
    opt = opt || {};
    var base = normBase(S.cfg.baseURL);
    if (!base || !S.cfg.currentModel) return Promise.resolve(null);
    var headers = { 'Content-Type': 'application/json' };
    if (S.cfg.apiKey) headers['Authorization'] = 'Bearer ' + S.cfg.apiKey;
    var body = { model: S.cfg.currentModel, messages: messages, stream: false,
      temperature: opt.temperature == null ? 0.2 : opt.temperature, max_tokens: opt.maxTokens || 160 };
    var ms = opt.timeout || 15000;
    var url = base + '/chat/completions';
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 'q' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 500000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (status && (status < 200 || status >= 300)) return resolve(null);
            try { resolve(JSON.parse(acc).choices[0].message || null); } catch (e) { resolve(null); }
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, url: url, method: 'POST', headers: headers, body: JSON.stringify(body) });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: ac.signal })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.json(); })
      .then(function(j){ clearTimeout(t); return (j && j.choices && j.choices[0] && j.choices[0].message) || null; })
      .catch(function(){ clearTimeout(t); return null; });
  }
  /* 查询改写（档③）：开启且已配模型才走；改写失败/过短回退原查询 */
  function rewriteQuery(q, msgs){
    if (!S.cfg.searchRewrite || isMock()) return Promise.resolve(q);
    var sys = '你是搜索查询改写器。把用户问题改写成一条适合网页搜索的检索词：保留实体、年份、数字与限定，去掉客套与指代，使其独立可检索；不回答问题，只输出检索词本身，不要引号与解释。';
    var ctx = '';
    (msgs || []).slice(-3).forEach(function(m){
      if (m && m.role === 'user' && m.content) ctx += '用户：' + String(m.content).slice(0, 160) + '\n';
    });
    return chatOnce([
      { role: 'system', content: sys },
      { role: 'user', content: (ctx ? '最近对话：\n' + ctx : '') + '当前问题：' + q }
    ], { temperature: 0.2, maxTokens: 120, timeout: 15000 }).then(function(m){
      var r = m && m.content ? String(m.content).trim().replace(/^["'「『\s]+/, '').replace(/["'」』\s]+$/, '').replace(/\s+/g, ' ') : '';
      return r.length >= 2 && r.length <= 200 ? r : q;
    });
  }

  function safeUrl(u){
    try {
      var p = new URL(String(u));
      return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
    } catch (e) { return null; }
  }
  /* HTML → 纯文本：块级标签先转 \n，再去脚本样式与导航壳 */
  function htmlToText(html){
    var src = String(html || '')
      .replace(/<(br\s*\/?|\/(p|div|li|h[1-6]|tr|section|article|blockquote|pre))\s*>/gi, '\n');
    var doc = null;
    try { doc = new DOMParser().parseFromString(src, 'text/html'); } catch (e) { return ''; }
    if (!doc || !doc.body) return '';
    var drop = doc.querySelectorAll('script,style,noscript,svg,canvas,iframe,nav,header,footer,aside,form,button,select,textarea,template');
    for (var i = 0; i < drop.length; i++) if (drop[i].parentNode) drop[i].parentNode.removeChild(drop[i]);
    return (doc.body.textContent || '').replace(/\u00a0/g, ' ')
      .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }
  /* 单页抓取（档④）：桥 GET 优先，浏览器直连受 CORS 约束，失败返回 null（回退摘要） */
  function fetchPageText(u){
    var href = safeUrl(u);
    if (!href) return Promise.resolve(null);
    var ms = 8000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 'p' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 400000) acc += t; },
          onDone: function(status){ if (fin) return; stop(); resolve((status >= 200 && status < 300) ? htmlToText(acc) : null); },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, url: href, method: 'GET',
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml' } });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(href, { signal: ac.signal, headers: { 'Accept': 'text/html,application/xhtml+xml' } })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.text(); })
      .then(function(h){ clearTimeout(t); return h ? htmlToText(h) : null; })
      .catch(function(){ clearTimeout(t); return null; });
  }
  function fetchPages(list){
    if (!S.cfg.searchFetch || !list || !list.length) return Promise.resolve(list);
    var n = clamp(parseInt(S.cfg.searchFetchCount, 10), 0, 5);
    if (!n) return Promise.resolve(list);
    var jobs = [];
    for (var i = 0; i < list.length && jobs.length < n; i++){
      (function(it){
        /* 已是长文（Firecrawl markdown）或地址非法则跳过 */
        if (!it || !safeUrl(it.url) || it.full || String(it.text || '').length >= 1600) return;
        jobs.push(fetchPageText(it.url).then(function(t){
          if (t && t.length >= 120){ it.text = t.slice(0, 3500); it.full = 1; }
        }));
      })(list[i]);
    }
    return jobs.length ? Promise.all(jobs).then(function(){ return list; }) : Promise.resolve(list);
  }

  /* POST JSON 双通道：桥/fetch，超时或非 2xx 返回 null */
  function httpJSON(req, ms){
    ms = ms || 15000;
    if (bridge.ok && S.cfg.useBridge){
      return new Promise(function(resolve){
        var id = 's' + (++bridge.seq), acc = '', fin = false;
        var to = setTimeout(function(){ if (fin) return; fin = true; bridge.abort(id); delete bridge.pend[id]; resolve(null); }, ms);
        function stop(){ if (!fin){ fin = true; clearTimeout(to); delete bridge.pend[id]; } }
        bridge.pend[id] = {
          onChunk: function(t){ if (acc.length < 1000000) acc += t; },
          onDone: function(status){
            if (fin) return; stop();
            if (status && (status < 200 || status >= 300)) return resolve(null);
            try { resolve(req.parse(JSON.parse(acc))); } catch (e) { resolve(null); }
          },
          onError: function(){ stop(); resolve(null); }
        };
        bridge.send({ t: 'http', id: id, url: req.url, method: 'POST', headers: req.headers, body: req.body });
      });
    }
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, ms);
    return fetch(req.url, { method: 'POST', headers: req.headers, body: req.body, signal: ac.signal })
      .then(function(res){ clearTimeout(t); if (!res.ok) return null; return res.json(); })
      .then(function(j){ clearTimeout(t); try { return j ? req.parse(j) : null; } catch (e) { return null; } })
      .catch(function(){ clearTimeout(t); return null; });
  }
  /* 三通道检索 + 地址校验 + URL 去重（Issue 17） */
  function runProviders(query, num){
    var prov = (S.cfg.searchProvider || 'none').toLowerCase();
    var key = S.cfg.searchKey || '';
    if (prov === 'none' || !key) return Promise.resolve(null);
    var req = null;
    if (prov === 'serper'){
      req = {
        url: 'https://google.serper.dev/search',
        headers: { 'X-API-KEY': key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: query, num: num }),
        parse: function(j){ return (j.organic || []).map(function(r){ return { title: r.title, url: r.link, text: r.snippet }; }); }
      };
    } else if (prov === 'tavily'){
      req = {
        url: 'https://api.tavily.com/search',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: key, query: query, max_results: num }),

  /* 侧栏会话列表 */
  function ago(ts){
    var d = Date.now() - (ts || 0);
    if (d < 6e4) return '刚刚';
    if (d < 36e5) return Math.floor(d / 6e4) + '分钟';
    if (d < 864e5) return Math.floor(d / 36e5) + '小时';
    return Math.floor(d / 864e5) + '天';
  }
  /* 侧栏：会话+项目组混排 */
  function renderSessions(){
    var q = ($('#sb-q').value || '').trim().toLowerCase();
    $list.textContent = '';
    var frag = document.createDocumentFragment();
    var pins = [], units = [], byWs = {};
    for (var i = 0; i < S.sessions.length; i++){
      var s = S.sessions[i];
      var hit = !q || (s.title || '').toLowerCase().indexOf(q) >= 0 || (s.workspace || '').toLowerCase().indexOf(q) >= 0;
      if (!hit) continue;
      if (s.workspace) (byWs[s.workspace] || (byWs[s.workspace] = [])).push(s);
      else (s.pinned ? pins : units).push({ t: s.updatedAt, s: s });
    }
    for (var ws in byWs){
      var arr = byWs[ws], mt = 0;
      for (var k = 0; k < arr.length; k++) if (arr[k].updatedAt > mt) mt = arr[k].updatedAt;
      arr.sort(function(a, b){
        if (!!b.pinned !== !!a.pinned) return b.pinned - a.pinned; // 项目内置顶优先
        return b.updatedAt - a.updatedAt;
      });
      units.push({ t: mt, ws: ws, arr: arr, pin: !!(S.cfg.pinnedWs || {})[ws] });
    }
    units.sort(function(a, b){ return b.t - a.t; });
    for (var ui = units.length - 1; ui >= 0; ui--)
      if (units[ui].ws && units[ui].pin) pins.push(units.splice(ui, 1)[0]); // 置顶项目并入置顶组
    pins.sort(function(a, b){ return b.t - a.t; });
    function group(label, arr){
      if (!arr.length) return;
      if (label) frag.appendChild(el('div', { class: 'ss-group', text: label }));
      for (var i = 0; i < arr.length; i++){
        var u = arr[i];
        if (u.s){ frag.appendChild(sessionNode(u.s)); continue; }
        var closed = !!(S.cfg.wsClosed || {})[u.ws];
        var nm = u.ws.split(/[\\/]/).filter(Boolean).pop() || u.ws;
        frag.appendChild(el('div', { class: 'ss-proj' + (closed ? ' closed' : '') + (u.pin ? ' pinned' : ''), 'data-pws': u.ws, title: u.ws }, [
          icon('down', 'chev'),
          icon('folder'),
          el('span', { class: 'nm', text: nm }),
          el('button', { class: 'pinb' + (u.pin ? ' on' : ''), 'data-ppin': '1', title: u.pin ? '取消置顶' : '置顶项目' }, [icon('pin')]),
          el('button', { class: 'add', 'data-pnew': '1', title: '新建任务（Agent+本文件夹）' }, [icon('plus')]),
          el('button', { class: 'delb', 'data-pdel': '1', title: '删除项目（含全部任务）' }, [icon('trash')])
        ]));
        if (!closed) for (var j = 0; j < u.arr.length; j++) frag.appendChild(sessionNode(u.arr[j], true));
      }
    }
    group(pins.length ? '置顶' : null, pins);
    group(pins.length && units.length ? '会话' : null, units);
    $list.appendChild(frag);
  }

                el('span', { class: 't', text: (a.name || '文件') + ' · ' + sizeFmt(a.blob.size) })
              ]));
            }
          });
        })(m.attachments[i]);
      }
      n.appendChild(ats);
    }
    if (m.status === 'error' || m.status === 'aborted'){
      var errRow = el('div', { class: 'msg-err' }, [
        el('span', { text: m.errMsg || (m.status === 'aborted' ? ERR.EABORT : '出错了') }),
        el('button', { class: 'btn btn-sec', 'data-act': 'retry', 'data-id': m.id, text: '重试' }),
        el('button', { class: 'btn btn-sec', 'data-act': 'continue', 'data-id': m.id, text: '继续生成' })
      ]);
      n.appendChild(errRow);
    }
    n.appendChild(actsRow(m));
    return n;
  }
  function actsRow(m){
    var row = el('div', { class: 'msg-acts' });
    row.appendChild(el('button', { 'data-act': 'copy', 'data-id': m.id, title: '复制' }, [icon('copy'), '复制']));
    if (m.role === 'user' && (m.content || '').indexOf('[fs-result]') !== 0){
      row.appendChild(el('button', { 'data-act': 'edit', 'data-id': m.id, title: '编辑并重新发送' }, [icon('edit'), '编辑']));
    }
    if (m.role === 'assistant' && m.status === 'ok'){
      if (m.variants && m.variants.length > 1){
        var vi = m.vi || 0;
        row.appendChild(el('button', { 'data-act': 'varprev', 'data-id': m.id, title: '上一版', text: '<', disabled: vi <= 0 }));
        row.appendChild(el('span', { class: 'var-pos', text: (vi + 1) + '/' + m.variants.length }));
        row.appendChild(el('button', { 'data-act': 'varnext', 'data-id': m.id, title: '下一版', text: '>', disabled: vi >= m.variants.length - 1 }));
      }
      row.appendChild(el('button', { 'data-act': 'regen', 'data-id': m.id, title: '重新生成' }, [icon('retry'), '重新生成']));
    }
    row.appendChild(el('button', { 'data-act': 'delmsg', 'data-id': m.id, title: '删除' }, [icon('trash'), '删除']));
    return row;
  }
  function foldIfLong(n, body){
    requestAnimationFrame(function(){
      if (body.scrollHeight > LIMITS.FOLD_H){
        n.classList.add('collapsed');
        n.appendChild(el('button', { class: 'btn btn-sec msg-fold', 'data-act': 'fold', text: '展开全文' }));
      }
    });
  }

  /* 流式渲染：追加式+rAF 合并 */
  var stream = null; // {msg,node,body,rBody,acc,rAcc,flush}
  function beginStream(msg){
    S.msgs.push(msg);
    var node = msgNode(msg);
    $('#msg-list').appendChild(node);
    var body = node.querySelector('.msg-body');
    stream = {
      msg: msg, node: node, body: body,
      acc: msg.content || '', rAcc: msg.reasoning || '',
      rNode: null, rBody: null
    };
    stream.flush = rafOnce(function(){
      if (!stream) return;
      if (stream.acc){
        stream.body.textContent = stream.acc; // 流式期间纯文本（两段式 §5.1.2）
      }
      if (stream.rAcc){
        if (!stream.rNode){
          stream.rNode = el('details', { class: 'reason' }, [el('summary', { text: '思考过程' })]);
          stream.rBody = el('div', { class: 'r-body' });
          stream.rNode.appendChild(stream.rBody);
          stream.node.insertBefore(stream.rNode, stream.body);
        }
        stream.rBody.textContent = stream.rAcc;
      }
      maybeScroll(false);
    });
    S.streamMsg = msg;
  }
  /* 自动压缩：usage≥80% 触发，9 段摘要+工具输出裁剪 */
  var COMPACT_PROMPT = '把以下对话历史压缩为结构化摘要供后续接续。严格按 9 段 Markdown 输出，标题固定：1.主要请求 2.关键发现 3.读取或修改的文件 4.问题解决 5.待办任务 6.当前工作 7.可选下一步 8.重要上下文 9.明确约束。空段写"无"。只输出摘要，2000 字内。';
  function lastUsage(msgs){ for (var i = msgs.length - 1; i >= 0; i--) if (msgs[i].usage && msgs[i].usage.p) return msgs[i].usage; return null; }
  function compactCtx(s, cb){
    var KEEP = 6, cut = [], lastTs = 0;
    for (var i = 0; i < S.msgs.length - KEEP; i++){
      var m = S.msgs[i];
      if (m.status !== 'ok' || !m.content) continue;
      var t = m.content.slice(0, 3000);
      if (m.role !== 'user' && t.length > 600) t = t.slice(0, 400) + '\n[工具输出已裁剪]'; // 早期工具输出裁剪
      cut.push((m.role === 'user' ? '【用户】' : '【助手】') + t); lastTs = m.ts;
    }
    if (cut.length < 3){ cb(false); return; }
    var text = '', fin = false;
    function done(ok){ if (fin) return; fin = true; if (S.compactHandle === h) S.compactHandle = null; cb(ok); }
    var h = NET.send({
      body: { model: S.cfg.currentModel, stream: true, max_tokens: 2000,
        messages: [{ role: 'user', content: COMPACT_PROMPT + '\n\n' + cut.join('\n') }] },
      onDelta: function(t2){ text += t2; },
      onUsage: function(){},
      onDone: function(){
        if (!text || text.length < 40){ done(false); return; }
        s.summary = text.slice(0, 6000); s.summaryTs = lastTs;
        DB.putSession(s); done(true);
      },
      onError: function(){ done(false); }
    });
    S.compactHandle = h; // Issue 18: 暴露句柄，停止生成(Esc)时一并中止压缩请求
  }
  /* usage 落消息：p=上下文占用（进度环数据源） */
  function usageSink(u){
    if (!u || !stream) return;
    stream.msg.tokens = u.total_tokens || stream.msg.tokens;
    stream.msg.usage = { p: u.prompt_tokens || 0, c: u.completion_tokens || 0, t: u.total_tokens || 0,
      h: u.prompt_cache_hit_tokens || (u.prompt_tokens_details && u.prompt_tokens_details.cached_tokens) || u.cache_read_input_tokens || (u.usageMetadata && u.usageMetadata.cachedContentTokenCount) || 0 };
  }
  function streamDelta(text, isReasoning){
    if (!stream) return;
    if (isReasoning) stream.rAcc += text; // 字符串拼接累加，不留 chunk 数组（§5.2.5）
    else stream.acc += text;
    stream.flush();
    if (qa && stream.msg.sid === qa.sid && Date.now() - qa.last > 250){ qa.last = Date.now(); if (NET.bridge.ok) NET.bridge.send({ t: 'quick.answer', text: stream.acc }); } // 节流同步到输入条
  }
  function endStream(status, errInfo, usage){
    if (!stream) return;
    var msg = stream.msg;
    msg.content = stream.acc;
    if (stream.rAcc) msg.reasoning = stream.rAcc;
    msg.status = status;
    if (errInfo) msg.errMsg = errInfo.msg;
    if (usage && usage.total_tokens) msg.tokens = usage.total_tokens;
    if (msg.content.length > LIMITS.MSG_TEXT){
      msg.content = msg.content.slice(0, LIMITS.MSG_TEXT); // 超限截断（§4.3）
      msg.truncated = true;
    }
    /* 结束一次性换成完整 Markdown（§5.1.2） */
    var body = stream.body;
    body.textContent = '';
    if (msg.role === 'assistant' && msg.content) body.innerHTML = MD.render(msg.content);
    else body.textContent = msg.content;
    /* 更新错误行 / 动作行 */
    var node = stream.node;
    var old = node.querySelector('.msg-err'); if (old) old.remove();
    var oldActs = node.querySelector('.msg-acts'); if (oldActs) oldActs.remove();
    if (status === 'error' || status === 'aborted'){
      var errRow = el('div', { class: 'msg-err' }, [
        el('span', { text: msg.errMsg || '出错了' }),
        el('button', { class: 'btn btn-sec', 'data-act': 'retry', 'data-id': msg.id, text: '重试' }),
        el('button', { class: 'btn btn-sec', 'data-act': 'continue', 'data-id': msg.id, text: '继续生成' })
      ]);
      node.insertBefore(errRow, null);
    }
    node.appendChild(actsRow(msg));
    var tk = node.querySelector('.msg-tokens');
    if (tk) tk.textContent = '~' + (msg.tokens || tokEst(msg.content)) + ' tok';
    renderCtxRing();
    foldIfLong(node, body);
    stream = null;
    S.streamMsg = null;
    DB.putMessage(msg); // 一次性落库（§5.1.5）
    touchSession();
    setSending(false);
    if (qa && msg.sid === qa.sid){ // 快速提问终态：错误给简短原因，其余给全文
      if (NET.bridge.ok) NET.bridge.send({ t: 'quick.answer', text: msg.errMsg || msg.content || '', done: true });
      qa = null;
    }
    maybeScroll(true);
  }

  /* 会话操作 */
  function createSession(title){
    var now = Date.now();
    var s = {
      id: uuid(), title: title || '新会话', createdAt: now, updatedAt: now,
      pinned: false, model: S.cfg.currentModel || '',
      systemPrompt: S.cfg.systemPrompt || '',
      params: { temperature: S.cfg.temperature, maxTokens: S.cfg.maxTokens },
      workspace: S.pendWs || '', msgCount: 0
    };
    S.pendWs = '';
    S.sessions.unshift(s);
    DB.putSession(s);
    /* 新会话无历史，同步切换，避免异步加载覆盖刚发送的消息 */
    if (S.sending) stopGeneration();
    revokePreviews();
    S.sid = s.id;
    S.windowSize = LIMITS.DOM_WINDOW;
    S.msgs = [];
    renderSessions();
    $title.textContent = s.title;
    renderMsgs();
    renderWsBtn();
    renderCtxRing();
    return s;
  }
  /* 草稿不落库；首条建会话 */
  function newDraft(){
    if (S.sending) stopGeneration();
    revokePreviews();
    S.sid = null; S.windowSize = LIMITS.DOM_WINDOW; S.msgs = [];
    renderSessions(); renderMsgs();
    renderComposerCtl();
    $title.textContent = 'SoloChat';
    $input.value = ''; autosize();
  }
  /* 侧栏项目新建任务：Agent+预选文件夹 */
  function newFromProject(ws){
    ws = ws || (curSession() && curSession().workspace) || '';
    setCfg({ fileOps: true });
    S.pendWs = ws;
    if (ws && S.cfg.wsClosed && S.cfg.wsClosed[ws]){ delete S.cfg.wsClosed[ws]; saveCfg(); }
    newDraft();
    if (ws) toast('已新建 Agent 任务，文件夹：' + ws);
    else toast('未找到文件夹，请在上边栏选择', true);
  }
  function selectSession(sid){
    if (S.sending) stopGeneration();
    revokePreviews(); // 切换时 revoke 上一会话预览 URL（§5.2.7）
    S.sid = sid;
    S.windowSize = LIMITS.DOM_WINDOW;
    S.msgs = [];
    renderSessions();
    var s = curSession();
    $title.textContent = s ? (s.title || '未命名会话') : 'SoloChat';
    if (!s){ renderMsgs(); renderWsBtn(); return; }
    DB.msgsBySid(sid).then(function(list){
      if (S.sid !== sid) return; // 已切走，丢弃过期结果
      list.sort(function(a, b){ return a.ts - b.ts; });
      S.msgs = list;
      renderMsgs();
      renderWsBtn();
      renderCtxRing();
      /* 恢复草稿 */
      $input.value = S.drafts[sid] || '';
      autosize();
    });
  }
  function touchSession(titleFrom){
    var s = curSession();
    if (!s) return;
    s.updatedAt = Date.now();
    s.msgCount = S.msgs.length;
    if (titleFrom && (s.title === '新会话' || !s.title))
      s.title = titleFrom.replace(/\s+/g, ' ').slice(0, 18);
    sortSessions();
    DB.putSession(s);
    renderSessions();
    $title.textContent = s.title;
  }
  function deleteSession(sid){ // 无确认，直接删除
    DB.delSessionDeep(sid).then(function(){
      S.sessions = S.sessions.filter(function(x){ return x.id !== sid; });
      delete S.drafts[sid];
      if (S.sid === sid){
        S.sid = null; S.msgs = [];
        if (S.sessions.length) selectSession(S.sessions[0].id);
        else { renderMsgs(); $title.textContent = 'SoloChat'; }
      }
      renderSessions();
      toast('已删除');
    });
  }
  /* 删除项目：其全部任务一并删除（无确认） */
  function deleteProject(ws){
    var arr = S.sessions.filter(function(x){ return x.workspace === ws; });
    Promise.all(arr.map(function(x){ return DB.delSessionDeep(x.id); })).then(function(){
      S.sessions = S.sessions.filter(function(x){ return x.workspace !== ws; });
      var curGone = false;
      for (var i = 0; i < arr.length; i++){
        delete S.drafts[arr[i].id];
        if (S.sid === arr[i].id) curGone = true;
      }
      if (S.cfg.pinnedWs) delete S.cfg.pinnedWs[ws];
      if (S.cfg.wsClosed) delete S.cfg.wsClosed[ws];
      saveCfg();
      if (curGone){
        S.sid = null; S.msgs = [];
        if (S.sessions.length) selectSession(S.sessions[0].id);
        else { renderMsgs(); $title.textContent = 'SoloChat'; }
      }
      renderSessions();
      toast('已删除项目');
    });
  }

  /* 输入区 */
  function autosize(){

  function renderChips(){

      (function(a){

          ]);

      /* 空态：问好+logo+建议 */

      ]));

  /* 滚动（§5.1.4：距底 ≤40px 才跟随） */
  function maybeScroll(force){
    if (force || S.follow) $scroll.scrollTop = $scroll.scrollHeight;
  }
  var onScroll = throttle(function(){
    var d = $scroll.scrollHeight - $scroll.scrollTop - $scroll.clientHeight;
    S.follow = d <= 40;
    $('#btn-bottom').classList.toggle('show', !S.follow && S.msgs.length > 0);
  }, 120);

  /* 发送 / 停止 / 重试 / 编辑 */
  function sendMessage(){
    if (S.sending){ stopGeneration(); return; }
    var text = $input.value.trim();
    if (!text && !S.pendAtts.length) return;
    if (!NET.isMock() && !S.cfg.baseURL){ openSettings(); toast('请先配置 Base URL，或填入 mock 试用', true); return; }
    if (!NET.isMock() && !S.cfg.currentModel){ toast('请先在「设置 → 连接与模型」中选择模型', true); return; }

    var s = curSession() || createSession();
    FS.reset(); // 新一轮用户输入：工具轮次与取消标志复位（v1.1）
    /* 附件先落 IDB，拿到 aid 列表 */
    var atts = S.pendAtts;
    var aids = [], attsData = {}, attsText = {};
    var userMsg = {
      id: uuid(), sid: s.id, role: 'user', content: text.slice(0, LIMITS.MSG_TEXT),
      status: 'ok', ts: Date.now(), attachments: []
    };
    var chain = Promise.resolve();
    atts.forEach(function(a){
      aids.push(a.id);
      chain = chain.then(function(){
        return DB.putAttachment({
          id: a.id, sid: s.id, name: a.name,
          mime: a.isText ? 'text/plain' : 'image/jpeg',
          size: a.blob.size, w: a.w || null, h: a.h || null, blob: a.blob
        });
      });
    });
    userMsg.attachments = aids;
    chain = chain.then(function(){
      /* base64 仅发送瞬间存在（§5.2.6） */
      var imgAtts = atts.filter(function(a){ return !a.isText; });
      var txtAtts = atts.filter(function(a){ return a.isText; });
      var p1 = imgAtts.length
        ? Promise.all(imgAtts.map(function(a){ return blobToDataURL(a.blob); }))
            .then(function(urls){ attsData[userMsg.id] = urls; })
        : null;
      if (txtAtts.length)
        attsText[userMsg.id] = txtAtts.map(function(a){
          return { name: a.name, text: a.text + (a.truncated ? '\n\n…（超长已截断）' : '') };
        });
      return p1;
    }).then(function(){
      atts.forEach(function(a){ if (a.url) URL.revokeObjectURL(a.url); });
      S.pendAtts = [];
      renderChips();
      S.msgs.push(userMsg);
      DB.putMessage(userMsg);
      $('#msg-list').appendChild(msgNode(userMsg));
      $empty.classList.remove('show'); // 草稿态首条消息：收起大屏问好
      /* 清空输入（原稿另存草稿）——发送成功后草稿即清空 */
      $input.value = ''; delete S.drafts[S.sid]; autosize();
      touchSession(text);
      maybeScroll(true);
      var go = function(block, meta){ startStream(attsData, attsText, block, meta); attsData = null; attsText = null; };
      if (S.cfg.webSearch && !NET.isMock()){
        var live = el('div', { class: 'srch', text: '正在联网搜索：' + text });
        $('#msg-list').appendChild(live); maybeScroll(true);
        var stage = function(s){ if (s){ live.textContent = s; maybeScroll(true); } };
        NET.searchWeb(text, stage).then(function(r){
          live.remove();
          if (!r || !r.block) toast('搜索未返回结果，仅按原问题回答');
          go(r && r.block, r);
        });
      } else go(null);
    });
  }

  function startStream(attsData, attsText, searchBlock, searchMeta){
    if (S.sending) return;
    var s = curSession();
    if (!s) return;
    var lim = parseInt(AP().ctxLimit, 10) || 131072;
    var lu = lastUsage(S.msgs);
    if (lu && lu.p >= lim * 0.8 && S.msgs.length >= 9 && !S.compacting && (!S.compactTried || Date.now() - S.compactTried > 120000)){
      S.compacting = true; S.compactTried = Date.now(); toast('上下文 80%+，自动压缩中…');
      compactCtx(s, function(ok){
        S.compacting = false;
        if (ok) toast('摘要完成，继续发送');
        startStream(attsData, attsText, searchBlock, searchMeta); // 失败回退原上下文继续
      });
      return;
    }
    setSending(true);
    var asst = {
      id: uuid(), sid: s.id, role: 'assistant', content: '',
      status: 'streaming', ts: Date.now(), attachments: []
    };
    beginStream(asst);
    if (searchMeta && searchMeta.block){ // 展示联网搜索过程：条数/耗时/可展开来源
      var sd = el('details', { class: 'srch' },
        [el('summary', { text: '已联网搜索 ' + searchMeta.n + ' 条结果 · ' + (searchMeta.ms / 1000).toFixed(1) + ' 秒' })]);
      for (var si = 0; si < searchMeta.items.length; si++){
        (function(it){
          // Issue 17: 仅 http/https 渲染为可点链接，其余（javascript:/data: 等）降级为纯文本，防链接注入
          var ok = /^https?:\/\//i.test(it.u || '');
          sd.appendChild(el('div', { class: 'srch-i' },
            [ok ? el('a', { href: it.u, target: '_blank', rel: 'noopener', text: it.t || it.u })
                : el('span', { text: it.t || it.u })]));
        })(searchMeta.items[si]);
      }
      stream.node.insertBefore(sd, stream.body);
    }
    var body = NET.buildBody(s, S.msgs, attsData || null, attsText || null, searchBlock || null);
    var ac = new AbortController();
    S.aborter = ac;
    var tmoErr = null, readerRef = null;
    var handle = NET.send({
      body: body,
      signal: ac.signal,
      abort: function(e){ tmoErr = e; ac.abort(); },
      onReader: function(r){ readerRef = r; },
      onDelta: streamDelta,
      onUsage: usageSink,
      onDone: function(){ finish(null); },
      onError: function(e){ finish(e); }
    });
    S.streamHandle = handle;
    function finish(err){
      if (readerRef && readerRef.cancel) try { readerRef.cancel(); } catch (e) {}
      if (!err){
        endStream('ok', null, stream && stream.msg.tokens ? { total_tokens: stream.msg.tokens } : null);
        FS.handleTurn(asst); // 文件 Agent 回合循环入口（v1.1）：扫 fs-* 标记并续跑
        return;
      }
      /* 中止优先真实 AbortError；超时用 tmoErr */
      var info = NET.classify(tmoErr && tmoErr.tmo ? tmoErr : err);
      if (info.code === 'abort') endStream('aborted', { msg: ERR.EABORT });
      else endStream('error', info);

  function stopGeneration(){
    FS.stop(); // 文件 Agent 循环一并中止（v1.1）
    if (S.compactHandle && S.compactHandle.abort){ S.compactHandle.abort(); S.compactHandle = null; } // Issue 18
    if (S.streamHandle && S.streamHandle.abort) S.streamHandle.abort();

  function findMsg(id){

    return -1;

  /* 回读文本附件（重试/重发） */
  function textsForMsg(m){
    return new Promise(function(res){
      if (!m || !m.attachments || !m.attachments.length) return res(null);
      var out = [], pending = m.attachments.length;
      function done(){ if (--pending === 0) res(out.length ? out : null); }
      m.attachments.forEach(function(aid){
        DB.getAttachment(aid).then(function(a){
          if (a && a.blob && (a.mime || '').indexOf('text/') === 0){
            a.blob.text().then(function(t){
              out.push({ name: a.name, text: t.slice(0, TEXT_SLICE) });
              done();
            }).catch(done);
          } else done();
        }).catch(done);
      });
    });
  }
  /* 重试：失败的助手消息 → 移除后以相同上下文重发 */
  function retryMsg(id){
    if (S.sending) return;
    var i = findMsg(id);
    if (i < 0) return;
    var m = S.msgs[i];
    if (m.role === 'assistant'){
      DB.delMessage(id);
      S.msgs.splice(i, 1);
      var node = $listNode(id); if (node) node.remove();
      textsForMsg(S.msgs[i - 1]).then(function(t){ startStream(null, t); });
    }
  }
  /* 原地流式：regen/continue 共用 */
  function inPlaceStream(m, i, acc0, ctxMsgs){
    m.status = 'streaming'; m.errMsg = null;
    setSending(true);
    var node = $listNode(m.id), body = node.querySelector('.msg-body');
    var q = ['.msg-err', '.msg-acts', '.msg-fold', '.reason'];
    for (var qi = 0; qi < q.length; qi++){ var qe = node.querySelector(q[qi]); if (qe) qe.remove(); }
    node.classList.remove('collapsed');
    body.textContent = '';
    stream = { msg: m, node: node, body: body, acc: acc0 || '', rAcc: '', rNode: null, rBody: null };
    stream.flush = rafOnce(function(){ if (!stream) return; if (stream.acc) stream.body.textContent = stream.acc; maybeScroll(false); });
    S.streamMsg = m;
    maybeScroll(true);
    var s = curSession(), ac = new AbortController();
    S.aborter = ac;
    var tmoErr = null, readerRef = null;
    var handle = NET.send({
      body: NET.buildBody(s, ctxMsgs, null, null), signal: ac.signal,
      abort: function(e){ tmoErr = e; ac.abort(); },
      onReader: function(r){ readerRef = r; }, onDelta: streamDelta,
      onUsage: usageSink,
      onDone: function(){ fin(null); }, onError: function(e){ fin(e); }
    });
    S.streamHandle = handle;
    function fin(err){
      if (readerRef && readerRef.cancel) try { readerRef.cancel(); } catch (e) {}
      if (!err){ endStream('ok', null, stream && stream.msg.tokens ? { total_tokens: stream.msg.tokens } : null); FS.handleTurn(m); return; }
      var info = NET.classify(tmoErr && tmoErr.tmo ? tmoErr : err);
      endStream(info.code === 'abort' ? 'aborted' : 'error', info.code === 'abort' ? { msg: ERR.EABORT } : info);
    }

  /* 重新生成：原地覆盖，旧版入 variants */
  function regenMsg(id){
    if (S.sending) return;
    var i = findMsg(id); if (i < 0) return;

    if (m.role !== 'assistant' || m.status === 'streaming') return;
    if (!m.variants || !m.variants.length){ m.variants = [m.content || '']; m.vi = 0; }
    m.variants = m.variants.slice(0, m.vi + 1); // 当前版往后截断，再追加新版
    m.variants.push('');
    m.vi = m.variants.length - 1; m.content = '';

  /* 版本切换：content 同步 variants[vi] */
  function variantStep(id, dir){
    var i = findMsg(id);

  function copyText(t){

  function $listNode(id){ // Issue 19: 转义属性值中的引号/反斜杠，防特殊 id 破坏选择器

  /* 附件：图片压缩 / 纯文本直读（§4.3） */
  var TEXT_EXT = { txt: 1, md: 1, markdown: 1, json: 1, html: 1, htm: 1, css: 1, js: 1, py: 1,
    java: 1, c: 1, cpp: 1, h: 1, cs: 1, xml: 1, yml: 1, yaml: 1, csv: 1, log: 1, ini: 1, toml: 1, sql: 1, sh: 1, bat: 1 };
  var TEXT_MAX = 1024 * 1024;      // 单个文本文件 1MB
  var TEXT_SLICE = 256 * 1024;     // 注入 prompt 时截断长度
  function isTextFile(f){
    if (/^text\//.test(f.type)) return true;
    var m = /\.([a-z0-9]+)$/i.exec(f.name || '');
    return !!(m && TEXT_EXT[m[1].toLowerCase()]);
  }
  function addFiles(files){
    var imgs = [], texts = [];
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      if (/^image\//.test(f.type)) imgs.push(f);
      else if (isTextFile(f)) texts.push(f);
    }
    if (!imgs.length && !texts.length) return;
    imgs.forEach(function(f){
      if (f.size > LIMITS.ATTACH_RAW){ toast('图片超过 5MB：' + f.name, true); return; }
      compressImage(f).then(function(r){
        S.pendAtts.push({ id: uuid(), name: f.name, blob: r.blob, w: r.w, h: r.h, url: URL.createObjectURL(r.blob) });
        renderChips();
      }).catch(function(){ toast('图片处理失败：' + f.name, true); });
    });
    texts.forEach(function(f){
      if (f.size > TEXT_MAX){ toast('文本文件超过 1MB：' + f.name, true); return; }
      f.text().then(function(content){
        S.pendAtts.push({
          id: uuid(), name: f.name, blob: f, isText: true, size: f.size,
          text: content.slice(0, TEXT_SLICE), truncated: content.length > TEXT_SLICE
        });
        renderChips();
      }).catch(function(){ toast('文件读取失败：' + f.name, true); });
    });
  }
  function compressImage(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file); // 避免 5MB 图转 base64 常驻（§5.2.6）
      var img = new Image();
      function done(){ URL.revokeObjectURL(url); }
      img.onload = function(){
        done();
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, LIMITS.ATTACH_EDGE / Math.max(w, h));
        var q = LIMITS.ATTACH_Q, tries = 0;
        (function attempt(){
          var cw = Math.round(w * scale), ch = Math.round(h * scale);
          var cv = el('canvas');
          cv.width = cw; cv.height = ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          cv.toBlob(function(b){
            if (!b) return rej(new Error('compress'));
            if (b.size <= LIMITS.ATTACH_SEND || ++tries >= 3)
              return res({ blob: b, w: cw, h: ch });
            scale *= 0.8; q = Math.max(0.6, q - 0.1);
            attempt();
          }, 'image/jpeg', q);
        })();
      };
      img.onerror = function(){ done(); rej(new Error('decode')); };
      img.src = url;
    });
  }
  function revokePreviews(){
    for (var i = 0; i < S.previewUrls.length; i++) URL.revokeObjectURL(S.previewUrls[i]);
    S.previewUrls = [];

  /* 导入/导出：流式写 Blob
     F5：导出含全部聊天/附件；默认【脱敏分享】把 workspace 绝对路径压成末级文件夹名，
     避免泄露本机目录结构。选【完整备份】才保留绝对路径（仅自用/还原；工作区需重新授权）。 */
  function doExport(){
    var full = confirm('导出模式\n\n【确定】完整备份 —— 保留本机工作区绝对路径，用于自用还原\n【取消】脱敏分享 —— 工作区只保留文件夹名，去除本机绝对路径\n\n导出文件包含全部聊天记录与附件，请确认分享对象。');
    DB.exportData().then(function(d){
      var sess = d.sessions;
      if (!full){
        sess = sess.map(function(s){
          var o = {}; for (var k in s) o[k] = s[k];
          if (o.workspace) o.workspace = (String(o.workspace).split(/[\\/]/).filter(Boolean).pop()) || '';
          return o;
        });
      }
      var atts = d.attachments || [];
      var parts = ['{"v":1,"sessions":', JSON.stringify(sess), ',"messages":', JSON.stringify(d.messages), ',"attachments":['];
      var chain = Promise.resolve();
      atts.forEach(function(a, i){
        chain = chain.then(function(){
          return blobToDataURL(a.blob).then(function(u){
            parts.push((i ? ',' : '') + JSON.stringify({ id: a.id, sid: a.sid, name: a.name, mime: a.mime, size: a.size, w: a.w, h: a.h, data: u }));
          });
        });
      });
      chain.then(function(){
        parts.push(']}');
        var blob = new Blob(parts, { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = el('a', { href: url, download: 'solochat-export-' + new Date().toISOString().slice(0, 10) + '.json' });
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); // createObjectURL 与 revoke 成对（§5.2.1）
        toast('导出完成');
      });
    });
  }
  function doImport(file){

      if (!d || !Array.isArray(d.sessions) || !Array.isArray(d.messages)){ toast('文件格式不符', true); return; }
      (d.attachments || []).forEach(function(a){
        if (a.data){

          catch (e){ a.blob = null; }
